<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>キャラクター相関図</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #1e1e24; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
        
        /* 全体のコンテナ */
        #canvas-container { width: 100%; height: 100%; position: relative; overflow: hidden; }
        
        /* 広大なマップ背景 */
        #workspace { width: 3000px; height: 3000px; position: absolute; top: 0; left: 0; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px; }
        
        /* キャラクターノードのコンテナ（線をキャラクターの下に敷くためにz-indexを調整） */
        #character-container { position: absolute; top: 0; left: 0; width: 3000px; height: 3000px; z-index: 10; pointer-events: none; }
        
        /* キャラクターノード */
        .character { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: #2a2a35; border: 3px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: move; user-select: none; font-size: 14px; font-weight: bold; text-align: center; padding: 5px; touch-action: none; pointer-events: auto; }
        .character.close { border-color: #ff4757; box-shadow: 0 0 15px rgba(255,71,87,0.4); background: #3a2226; }
        .character .status-badge { font-size: 9px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 10px; margin-top: 4px; color: #00ffff; }
        .character.close .status-badge { color: #ff4757; }
        
        /* 関係線を描くSVGレイヤー（巨大サイズにしてz-indexを5にし、確実に描画させる） */
        #svg-layer { position: absolute; top: 0; left: 0; width: 3000px; height: 3000px; z-index: 5; pointer-events: none; display: block !important; }
        
        /* 操作説明パネル */
        #info-panel { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; z-index: 100; pointer-events: none; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="info-panel">
        <strong>【操作方法】</strong><br>
        ・背景をドラッグ/スライド：画面のスクロール<br>
        ・ノードを短くタップ：Open/Close（線の切り替え）<br>
        ・ノードを長押し/ドラッグ：キャラクターの移動
    </div>
    <div id="canvas-container">
        <div id="workspace">
            <!-- 順番を入れ替え、さらに確実な描画環境にしました -->
            <div id="character-container"></div>
            <svg id="svg-layer"></svg>
        </div>
    </div>
    <script>
        // データ定義
        const characters = [
            { id: 'ch1', name: '主人公', x: 400, y: 300, state: 'open' },
            { id: 'ch2', name: 'ライバル', x: 200, y: 150, state: 'open' },
            { id: 'ch3', name: '幼馴染', x: 600, y: 200, state: 'open' },
            { id: 'ch4', name: '組織ボス', x: 300, y: 550, state: 'open' }
        ];
        const relations = [
            { from: 'ch1', to: 'ch2', type: 'ライバル', color: '#ff9f43' },
            { from: 'ch1', to: 'ch3', type: '友人', color: '#1dd1a1' },
            { from: 'ch1', to: 'ch4', type: '敵対', color: '#ff4757' },
            { from: 'ch2', to: 'ch4', type: '裏取引？', color: '#fece57' }
        ];

        const container = document.getElementById('canvas-container');
        const workspace = document.getElementById('workspace');
        const charContainer = document.getElementById('character-container');
        const svgLayer = document.getElementById('svg-layer');

        // 表示位置の初期化
        let currentX = -100;
        let currentY = -100;
        workspace.style.transform = `translate(${currentX}px, ${currentY}px)`;

        let isDraggingWorkspace = false;
        let isDraggingNode = false;
        let activeNode = null;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let nodeStartX = 0;
        let nodeStartY = 0;
        let wsStartX = 0;
        let wsStartY = 0;
        let hasMoved = false;

        // キャラクター初期配置
        function init() {
            charContainer.innerHTML = '';
            characters.forEach(char => {
                const div = document.createElement('div');
                div.className = `character ${char.state}`;
                div.id = char.id;
                div.style.left = `${char.x}px`;
                div.style.top = `${char.y}px`;
                div.innerHTML = `<div>${char.name}</div><div class="status-badge" id="badge-${char.id}">${char.state.toUpperCase()}</div>`;
                
                // ポインターイベント（マウス・タッチ共通）
                div.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    isDraggingNode = true;
                    activeNode = char;
                    pointerStartX = e.clientX;
                    pointerStartY = e.clientY;
                    nodeStartX = char.x;
                    nodeStartY = char.y;
                    hasMoved = false;
                    div.setPointerCapture(e.pointerId);
                });

                div.addEventListener('pointermove', (e) => {
                    if (!isDraggingNode || activeNode !== char) return;
                    e.stopPropagation();
                    const dx = e.clientX - pointerStartX;
                    const dy = e.clientY - pointerStartY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        hasMoved = true;
                    }
                    char.x = nodeStartX + dx;
                    char.y = nodeStartY + dy;
                    
                    // 画面外へのはみ出し制限
                    char.x = Math.max(0, Math.min(char.x, 2900));
                    char.y = Math.max(0, Math.min(char.y, 2900));
                    
                    div.style.left = `${char.x}px`;
                    div.style.top = `${char.y}px`;
                    drawLines();
                });

                div.addEventListener('pointerup', (e) => {
                    if (!isDraggingNode || activeNode !== char) return;
                    e.stopPropagation();
                    div.releasePointerCapture(e.pointerId);
                    isDraggingNode = false;
                    activeNode = null;

                    // 動かさずにタップだけしたなら状態を反転
                    if (!hasMoved) {
                        if (char.state === 'open') {
                            char.state = 'close';
                            div.classList.add('close');
                            document.getElementById(`badge-${char.id}`).innerText = 'CLOSE';
                        } else {
                            char.state = 'open';
                            div.classList.remove('close');
                            document.getElementById(`badge-${char.id}`).innerText = 'OPEN';
                        }
                        drawLines();
                    }
                });

                charContainer.appendChild(div);
            });
            drawLines();
        }

        // 背景スクロールの処理
        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.character')) return;
            isDraggingWorkspace = true;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            wsStartX = currentX;
            wsStartY = currentY;
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDraggingWorkspace) return;
            const dx = e.clientX - pointerStartX;
            const dy = e.clientY - pointerStartY;
            currentX = wsStartX + dx;
            currentY = wsStartY + dy;

            // スクロール範囲の制限
            currentX = Math.min(0, Math.max(currentX, -(3000 - window.innerWidth)));
            currentY = Math.min(0, Math.max(currentY, -(3000 - window.innerHeight)));

            workspace.style.transform = `translate(${currentX}px, ${currentY}px)`;
        });

        container.addEventListener('pointerup', (e) => {
            if (!isDraggingWorkspace) return;
            container.releasePointerCapture(e.pointerId);
            isDraggingWorkspace = false;
        });

        // 線の描画（完全にバグを回避する安全な実装）
        function drawLines() {
            svgLayer.innerHTML = '';
            relations.forEach(rel => {
                const fromChar = characters.find(c => c.id === rel.from);
                const toChar = characters.find(c => c.id === rel.to);

                if (fromChar.state === 'close' || toChar.state === 'close') return;

                const x1 = fromChar.x + 50; const y1 = fromChar.y + 50;
                const x2 = toChar.x + 50; const y2 = toChar.y + 50;

                // 1. 直線
                const line = document.createElementNS('http://w3.org', 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('stroke', rel.color); line.setAttribute('stroke-width', '3');
                line.setAttribute('opacity', '0.7');
                svgLayer.appendChild(line);

                const mx = (x1 + x2) / 2;
                const my = (y1 + y2) / 2;

                // 2. 中心の黒い座布団（四角形）
                const rect = document.createElementNS('http://w3.org', 'rect');
                rect.setAttribute('x', mx - 35);
                rect.setAttribute('y', my - 12);
                rect.setAttribute('width', '70');
                rect.setAttribute('height', '22');
                rect.setAttribute('fill', '#1e1e24'); // 背景と同じ色にして線を隠す
                rect.setAttribute('rx', '4'); // 少し角丸
                rect.setAttribute('stroke', rel.color);
                rect.setAttribute('stroke-width', '1');
                svgLayer.appendChild(rect);

                // 3. 中心の点（小さなサークル）
                const circle = document.createElementNS('w3.org', 'circle');

		        circle.setAttribute('cx', mx);
                circle.setAttribute('cy', my);
                circle.setAttribute('r', '4');
                circle.setAttribute('fill', rel.color);
                svgLayer.appendChild(circle);
                // 4. 関係名テキスト（エラーの起きないシンプルな描画に変更）const text = document.createElementNS('w3.org', 'text');
                text.setAttribute('x', mx);
                text.setAttribute('y', my + 5);
                 // 四角の真ん中に来るように調整text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-size', '11px');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = rel.type;
                svgLayer.appendChild(text);
     }
);
}init();
