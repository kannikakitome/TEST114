<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>キャラクター相関図</title>

<style>
/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #101218;
    color: #fff;
    font-family:
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

body {
    touch-action: none;
    user-select: none;
}


/* =========================================================
   画面
========================================================= */

#viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center,
            rgba(80, 90, 120, 0.08),
            transparent 55%),
        #101218;
}


/* =========================================================
   3000 × 3000 マップ
========================================================= */

#map {
    position: absolute;

    width: 3000px;
    height: 3000px;

    left: 0;
    top: 0;

    background-color: #161922;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    box-shadow:
        inset 0 0 100px rgba(0,0,0,0.7);

    transform-origin: 0 0;
}


/* =========================================================
   SVG関係線レイヤー
========================================================= */

#relations {
    position: absolute;

    left: 0;
    top: 0;

    width: 3000px;
    height: 3000px;

    overflow: visible;

    z-index: 10;

    pointer-events: none;
}


/* 関係線 */

.relation-line {
    stroke-width: 4;
    stroke-linecap: round;

    filter:
        drop-shadow(0 0 4px rgba(0,255,255,0.7));

    transition: opacity 0.15s;
}


/* 関係線の中央マーカー */

.relation-marker {
    stroke-width: 2;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,0.8));
}


/* 関係名 */

.relation-label rect {
    fill: rgba(15,18,25,0.95);

    stroke-width: 2;

    rx: 6;
    ry: 6;

    filter:
        drop-shadow(0 0 4px rgba(0,0,0,0.8));
}

.relation-label text {
    font-size: 14px;
    font-weight: bold;

    dominant-baseline: middle;
    text-anchor: middle;

    pointer-events: none;
}


/* CLOSEによって非表示になる要素 */

.relation.hidden {
    opacity: 0;
}


/* =========================================================
   キャラクターノード
========================================================= */

.node {
    position: absolute;

    width: 150px;
    height: 150px;

    margin-left: -75px;
    margin-top: -75px;

    border-radius: 50%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    cursor: grab;

    z-index: 20;

    touch-action: none;

    border: 3px solid #00eaff;

    background:
        radial-gradient(
            circle at 35% 25%,
            rgba(255,255,255,0.35),
            transparent 18%
        ),
        radial-gradient(
            circle at center,
            #273647 0%,
            #101721 65%,
            #080b10 100%
        );

    box-shadow:
        0 0 10px rgba(0,234,255,0.8),
        0 0 25px rgba(0,234,255,0.35),
        inset 0 0 20px rgba(0,234,255,0.15);

    transition:
        box-shadow 0.2s,
        border-color 0.2s,
        transform 0.1s;
}

.node:hover {
    box-shadow:
        0 0 15px rgba(0,234,255,1),
        0 0 40px rgba(0,234,255,0.5),
        inset 0 0 25px rgba(0,234,255,0.25);
}

.node.dragging {
    cursor: grabbing;

    box-shadow:
        0 0 20px rgba(255,255,255,1),
        0 0 45px rgba(0,234,255,0.8),
        inset 0 0 25px rgba(255,255,255,0.2);

    transform: scale(1.05);
}


/* ノード名 */

.node-name {
    max-width: 115px;

    text-align: center;

    font-size: 17px;
    font-weight: bold;

    line-height: 1.3;

    text-shadow:
        0 0 5px #000,
        0 0 8px rgba(0,234,255,0.7);

    pointer-events: none;
}


/* OPEN / CLOSE バッジ */

.status {
    margin-top: 8px;

    min-width: 58px;
    padding: 3px 9px;

    border-radius: 20px;

    text-align: center;

    font-size: 11px;
    font-weight: bold;

    letter-spacing: 1px;

    pointer-events: none;
}


/* OPEN */

.node.open {
    border-color: #00eaff;
}

.node.open .status {
    color: #061014;

    background: #00f0ff;

    box-shadow:
        0 0 10px rgba(0,240,255,0.8);
}


/* CLOSE */

.node.close {
    border-color: #ff416c;

    box-shadow:
        0 0 10px rgba(255,65,108,0.8),
        0 0 30px rgba(255,65,108,0.35),
        inset 0 0 20px rgba(255,65,108,0.15);
}

.node.close .status {
    color: white;

    background: #ff416c;

    box-shadow:
        0 0 10px rgba(255,65,108,0.8);
}


/* =========================================================
   UI
========================================================= */

#ui {
    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 100;

    padding: 12px 16px;

    border: 1px solid rgba(0,234,255,0.35);

    border-radius: 10px;

    background: rgba(10,13,20,0.85);

    backdrop-filter: blur(8px);

    box-shadow:
        0 0 20px rgba(0,0,0,0.4);

    pointer-events: none;
}

#ui-title {
    color: #00eaff;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 1px;
}

#ui-help {
    margin-top: 5px;

    color: #aeb8c8;

    font-size: 11px;

    line-height: 1.5;
}


/* スマホ */

@media (max-width: 600px) {

    #ui {
        top: 10px;
        left: 10px;

        padding: 9px 12px;
    }

    #ui-title {
        font-size: 12px;
    }

    #ui-help {
        font-size: 9px;
    }

    .node {
        width: 130px;
        height: 130px;

        margin-left: -65px;
        margin-top: -65px;
    }

    .node-name {
        font-size: 14px;
        max-width: 100px;
    }
}
</style>
</head>


<body>

<div id="viewport">

    <div id="map">

        <!-- SVG関係線レイヤー -->
        <svg id="relations"
             viewBox="0 0 3000 3000"
             preserveAspectRatio="none">
        </svg>

        <!-- キャラクターはJavaScriptで生成 -->

    </div>

</div>


<div id="ui">
    <div id="ui-title">CHARACTER RELATION MAP</div>

    <div id="ui-help">
        背景：ドラッグでマップ移動<br>
        キャラクター：ドラッグで移動／タップでOPEN・CLOSE
    </div>
</div>


<script>
/* =========================================================
   サンプルデータ
========================================================= */

const characterData = [

    {
        id: "hero",
        name: "主人公",
        x: 1000,
        y: 1100,
        status: "OPEN"
    },

    {
        id: "rival",
        name: "ライバル",
        x: 1450,
        y: 900,
        status: "OPEN"
    },

    {
        id: "childhood",
        name: "幼馴染",
        x: 700,
        y: 1450,
        status: "OPEN"
    },

    {
        id: "boss",
        name: "組織ボス",
        x: 1750,
        y: 1450,
        status: "OPEN"
    }

];


/* =========================================================
   関係データ
========================================================= */

const relationData = [

    {
        id: "r1",
        from: "hero",
        to: "rival",
        name: "ライバル",
        color: "#ff4d8d"
    },

    {
        id: "r2",
        from: "hero",
        to: "childhood",
        name: "幼馴染",
        color: "#00eaff"
    },

    {
        id: "r3",
        from: "rival",
        to: "boss",
        name: "敵対",
        color: "#ff416c"
    },

    {
        id: "r4",
        from: "hero",
        to: "boss",
        name: "因縁",
        color: "#ffc857"
    }

];


/* =========================================================
   DOM取得
========================================================= */

const viewport =
    document.getElementById("viewport");

const map =
    document.getElementById("map");

const svg =
    document.getElementById("relations");


/* =========================================================
   マップ状態
========================================================= */

const MAP_WIDTH = 3000;
const MAP_HEIGHT = 3000;

let mapX = 0;
let mapY = 0;


/* =========================================================
   ノード管理
========================================================= */

const nodes = {};

characterData.forEach(data => {

    const node =
        document.createElement("div");

    node.className =
        "node " +
        (data.status === "OPEN"
            ? "open"
            : "close");

    node.dataset.id =
        data.id;

    node.style.left =
        data.x + "px";

    node.style.top =
        data.y + "px";


    /* キャラクター名 */

    const name =
        document.createElement("div");

    name.className =
        "node-name";

    name.textContent =
        data.name;


    /* 状態バッジ */

    const status =
        document.createElement("div");

    status.className =
        "status";

    status.textContent =
        data.status;


    node.appendChild(name);
    node.appendChild(status);

    map.appendChild(node);

    nodes[data.id] = {
        data,
        element: node,
        x: data.x,
        y: data.y,
        dragging: false,
        moved: false,
        startX: 0,
        startY: 0,
        originalX: 0,
        originalY: 0
    };

});


/* =========================================================
   SVG関係線生成
========================================================= */

const relationElements = {};


function createRelations() {

    relationData.forEach(relation => {

        const group =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "g"
            );

        group.classList.add(
            "relation"
        );

        group.dataset.id =
            relation.id;


        /* 線 */

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.classList.add(
            "relation-line"
        );

        line.setAttribute(
            "stroke",
            relation.color
        );


        /* 中央マーカー */

        const marker =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        marker.classList.add(
            "relation-marker"
        );

        marker.setAttribute(
            "r",
            "7"
        );

        marker.setAttribute(
            "fill",
            relation.color
        );

        marker.setAttribute(
            "stroke",
            "#ffffff"
        );


        /* 関係名グループ */

        const label =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "g"
            );

        label.classList.add(
            "relation-label"
        );


        /* 背景矩形 */

        const rect =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );

        rect.setAttribute(
            "fill",
            "#10141c"
        );

        rect.setAttribute(
            "stroke",
            relation.color
        );


        /* テキスト */

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.textContent =
            relation.name;

        text.setAttribute(
            "fill",
            "#ffffff"
        );


        label.appendChild(rect);
        label.appendChild(text);

        group.appendChild(line);
        group.appendChild(marker);
        group.appendChild(label);

        svg.appendChild(group);


        relationElements[relation.id] = {
            group,
            line,
            marker,
            label,
            rect,
            text,
            relation
        };

    });

}


/* =========================================================
   関係線更新
========================================================= */

function updateRelations() {

    relationData.forEach(relation => {

        const a =
            nodes[relation.from];

        const b =
            nodes[relation.to];

        const elements =
            relationElements[relation.id];


        if (!a || !b || !elements) {
            return;
        }


        /* CLOSE状態なら完全非表示 */

        const hidden =
            a.data.status === "CLOSE" ||
            b.data.status === "CLOSE";

        elements.group.classList.toggle(
            "hidden",
            hidden
        );


        /* ノード中心 */

        const x1 = a.x;
        const y1 = a.y;

        const x2 = b.x;
        const y2 = b.y;


        /* 線 */

        elements.line.setAttribute(
            "x1",
            x1
        );

        elements.line.setAttribute(
            "y1",
            y1
        );

        elements.line.setAttribute(
            "x2",
            x2
        );

        elements.line.setAttribute(
            "y2",
            y2
        );


        /* 中央 */

        const centerX =
            (x1 + x2) / 2;

        const centerY =
            (y1 + y2) / 2;


        elements.marker.setAttribute(
            "cx",
            centerX
        );

        elements.marker.setAttribute(
            "cy",
            centerY
        );


        /* 関係名 */

        elements.text.setAttribute(
            "x",
            centerX
        );

        elements.text.setAttribute(
            "y",
            centerY
        );


        /*
         * SVG textの幅を取得
         * getBBoxが使用できない環境対策として
         * おおよその幅も計算
         */

        let width = 0;

        try {

            width =
                elements.text.getComputedTextLength();

        } catch {

            width =
                relation.name.length * 14;

        }


        width += 18;

        const height = 26;


        elements.rect.setAttribute(
            "x",
            centerX - width / 2
        );

        elements.rect.setAttribute(
            "y",
            centerY - height / 2
        );

        elements.rect.setAttribute(
            "width",
            width
        );

        elements.rect.setAttribute(
            "height",
            height
        );

    });

}


/* =========================================================
   ノード状態切替
========================================================= */

function toggleNode(nodeInfo) {

    nodeInfo.data.status =
        nodeInfo.data.status === "OPEN"
            ? "CLOSE"
            : "OPEN";


    nodeInfo.element.classList.toggle(
        "open",
        nodeInfo.data.status === "OPEN"
    );

    nodeInfo.element.classList.toggle(
        "close",
        nodeInfo.data.status === "CLOSE"
    );


    nodeInfo.element.querySelector(
        ".status"
    ).textContent =
        nodeInfo.data.status;


    updateRelations();

}


/* =========================================================
   ノード Pointer Events
========================================================= */

Object.values(nodes).forEach(nodeInfo => {

    const element =
        nodeInfo.element;


    element.addEventListener(
        "pointerdown",
        event => {

            /*
             * Pointer Capture
             * PC / スマホ両方で同じ処理をする
             */

            element.setPointerCapture(
                event.pointerId
            );


            nodeInfo.dragging = true;
            nodeInfo.moved = false;


            nodeInfo.startX =
                event.clientX;

            nodeInfo.startY =
                event.clientY;


            nodeInfo.originalX =
                nodeInfo.x;

            nodeInfo.originalY =
                nodeInfo.y;


            element.classList.add(
                "dragging"
            );

        }
    );


    element.addEventListener(
        "pointermove",
        event => {

            if (!nodeInfo.dragging) {
                return;
            }


            const dx =
                event.clientX -
                nodeInfo.startX;

            const dy =
                event.clientY -
                nodeInfo.startY;


            /*
             * 少しでも移動したら
             * タップではなくドラッグと判定
             */

            if (
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ) {
                nodeInfo.moved = true;
            }


            if (!nodeInfo.moved) {
                return;
            }


            let newX =
                nodeInfo.originalX +
                dx / getZoom();

            let newY =
                nodeInfo.originalY +
                dy / getZoom();


            /*
             * マップ外へ出ないよう制限
             */

            const radius = 75;

            newX =
                Math.max(
                    radius,
                    Math.min(
                        MAP_WIDTH - radius,
                        newX
                    )
                );

            newY =
                Math.max(
                    radius,
                    Math.min(
                        MAP_HEIGHT - radius,
                        newY
                    )
                );


            nodeInfo.x = newX;
            nodeInfo.y = newY;


            element.style.left =
                newX + "px";

            element.style.top =
                newY + "px";


            updateRelations();

        }
    );


    element.addEventListener(
        "pointerup",
        event => {

            if (!nodeInfo.dragging) {
                return;
            }


            nodeInfo.dragging =
                false;


            element.classList.remove(
                "dragging"
            );


            /*
             * 移動していなければ
             * タップとして状態変更
             */

            if (!nodeInfo.moved) {

                toggleNode(
                    nodeInfo
                );

            }

        }
    );


    element.addEventListener(
        "pointercancel",
        event => {

            nodeInfo.dragging =
                false;

            element.classList.remove(
                "dragging"
            );

        }
    );

});


/* =========================================================
   マップ移動
========================================================= */

let mapDragging = false;
let mapMoved = false;

let mapStartPointerX = 0;
let mapStartPointerY = 0;

let mapOriginalX = 0;
let mapOriginalY = 0;


/*
 * ノード上ではなく
 * 背景部分だけでマップ移動
 */

viewport.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(".node")
        ) {
            return;
        }


        viewport.setPointerCapture(
            event.pointerId
        );


        mapDragging = true;
        mapMoved = false;


        mapStartPointerX =
            event.clientX;

        mapStartPointerY =
            event.clientY;


        mapOriginalX =
            mapX;

        mapOriginalY =
            mapY;

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if (!mapDragging) {
            return;
        }


        const dx =
            event.clientX -
            mapStartPointerX;

        const dy =
            event.clientY -
            mapStartPointerY;


        if (
            Math.abs(dx) > 3 ||
            Math.abs(dy) > 3
        ) {
            mapMoved = true;
        }


        let newX =
            mapOriginalX + dx;

        let newY =
            mapOriginalY + dy;


        /*
         * マップの端が画面外に行き過ぎないよう制限
         */

        const viewportWidth =
            viewport.clientWidth;

        const viewportHeight =
            viewport.clientHeight;


        const minX =
            Math.min(
                0,
                viewportWidth - MAP_WIDTH
            );

        const minY =
            Math.min(
                0,
                viewportHeight - MAP_HEIGHT
            );


        const maxX = 0;
        const maxY = 0;


        newX =
            Math.max(
                minX,
                Math.min(
                    maxX,
                    newX
                )
            );

        newY =
            Math.max(
                minY,
                Math.min(
                    maxY,
                    newY
                )
            );


        mapX = newX;
        mapY = newY;


        applyMapTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    event => {

        mapDragging = false;

    }
);


viewport.addEventListener(
    "pointercancel",
    event => {

        mapDragging = false;

    }
);


/* =========================================================
   マップ位置適用
========================================================= */

function applyMapTransform() {

    map.style.transform =
        `translate(${mapX}px, ${mapY}px)`;

}


/* =========================================================
   ズーム関連
   現在は1倍固定。
   将来的な拡張用。
========================================================= */

let zoom = 1;

function getZoom() {
    return zoom;
}


/* =========================================================
   初期化
========================================================= */

createRelations();

updateRelations();

applyMapTransform();


/* =========================================================
   ウィンドウサイズ変更時
========================================================= */

window.addEventListener(
    "resize",
    () => {

        /*
         * 画面サイズが変わった場合、
         * マップが外へ飛び出さないよう再計算
         */

        const viewportWidth =
            viewport.clientWidth;

        const viewportHeight =
            viewport.clientHeight;


        const minX =
            Math.min(
                0,
                viewportWidth - MAP_WIDTH
            );

        const minY =
            Math.min(
                0,
                viewportHeight - MAP_HEIGHT
            );


        mapX =
            Math.max(
                minX,
                Math.min(
                    0,
                    mapX
                )
            );

        mapY =
            Math.max(
                minY,
                Math.min(
                    0,
                    mapY
                )
            );


        applyMapTransform();

        updateRelations();

    }
);

</script>

</body>
</html>
