<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Character Relation Map</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    background: #0b0e14;
    color: #fff;

    font-family:
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

body {
    touch-action: none;
    user-select: none;
}


/* =========================================================
   ビューポート
========================================================= */

#viewport {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(50, 70, 100, 0.12),
            transparent 55%
        ),
        #0b0e14;
}


/* =========================================================
   マップ
========================================================= */

#map {
    position: absolute;

    width: 3000px;
    height: 3000px;

    left: 0;
    top: 0;

    transform-origin: 0 0;

    background-color: #141821;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    box-shadow:
        inset 0 0 150px rgba(0,0,0,0.8);

    cursor: grab;
}

#map.dragging-map {
    cursor: grabbing;
}


/* =========================================================
   SVG
========================================================= */

#relations {
    position: absolute;

    left: 0;
    top: 0;

    width: 3000px;
    height: 3000px;

    overflow: visible;

    z-index: 10;

    pointer-events: none;
}

.relation-line {
    stroke-width: 4;
    stroke-linecap: round;

    filter:
        drop-shadow(
            0 0 5px currentColor
        );
}

.relation-marker {
    stroke: white;
    stroke-width: 2;

    filter:
        drop-shadow(
            0 0 5px currentColor
        );
}

.relation-label rect {
    rx: 6;
    ry: 6;

    fill: rgba(10,14,22,0.96);

    stroke-width: 2;
}

.relation-label text {
    font-size: 14px;
    font-weight: bold;

    fill: white;

    text-anchor: middle;
    dominant-baseline: middle;
}

.relation.hidden {
    opacity: 0;
}


/* =========================================================
   キャラクターノード
========================================================= */

.node {
    position: absolute;

    width: 150px;
    height: 150px;

    margin-left: -75px;
    margin-top: -75px;

    border-radius: 50%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    z-index: 20;

    cursor: grab;

    touch-action: none;

    border: 3px solid #00eaff;

    background:
        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,0.38),
            transparent 20%
        ),
        radial-gradient(
            circle at center,
            #304154,
            #121b28 60%,
            #080b10
        );

    box-shadow:
        0 0 12px rgba(0,234,255,0.9),
        0 0 30px rgba(0,234,255,0.3),
        inset 0 0 25px rgba(0,234,255,0.15);

    transition:
        box-shadow 0.15s,
        border-color 0.15s;
}

.node:hover {
    box-shadow:
        0 0 18px rgba(0,234,255,1),
        0 0 45px rgba(0,234,255,0.5),
        inset 0 0 30px rgba(0,234,255,0.25);
}

.node.dragging {
    cursor: grabbing;

    box-shadow:
        0 0 25px rgba(255,255,255,0.9),
        0 0 55px rgba(0,234,255,0.8);

    transform: scale(1.05);
}


/* ノード名 */

.node-name {
    max-width: 115px;

    text-align: center;

    font-size: 17px;
    font-weight: bold;

    line-height: 1.3;

    pointer-events: none;

    text-shadow:
        0 0 5px black,
        0 0 10px rgba(0,234,255,0.7);
}


/* 状態 */

.status {
    margin-top: 8px;

    padding: 3px 10px;

    min-width: 58px;

    border-radius: 20px;

    text-align: center;

    font-size: 11px;
    font-weight: bold;

    letter-spacing: 1px;

    pointer-events: none;
}


/* OPEN */

.node.open {
    border-color: #00eaff;
}

.node.open .status {
    color: #061014;

    background: #00eaff;

    box-shadow:
        0 0 10px rgba(0,234,255,0.9);
}


/* CLOSE */

.node.close {
    border-color: #ff416c;

    box-shadow:
        0 0 12px rgba(255,65,108,0.9),
        0 0 30px rgba(255,65,108,0.35),
        inset 0 0 25px rgba(255,65,108,0.15);
}

.node.close .status {
    color: white;

    background: #ff416c;

    box-shadow:
        0 0 10px rgba(255,65,108,0.8);
}


/* =========================================================
   上部UI
========================================================= */

#ui {
    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 100;

    padding: 12px 16px;

    border:
        1px solid
        rgba(0,234,255,0.35);

    border-radius: 10px;

    background:
        rgba(8,12,20,0.86);

    backdrop-filter: blur(8px);

    pointer-events: none;
}

#ui-title {
    color: #00eaff;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 1px;
}

#ui-help {
    margin-top: 5px;

    color: #aab4c5;

    font-size: 11px;

    line-height: 1.6;
}


/* =========================================================
   コンテキストメニュー
========================================================= */

#contextMenu {
    position: fixed;

    min-width: 230px;

    z-index: 1000;

    display: none;

    padding: 6px;

    border:
        1px solid
        rgba(0,234,255,0.45);

    border-radius: 10px;

    background:
        rgba(12,16,25,0.97);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.65),
        0 0 20px rgba(0,234,255,0.12);

    backdrop-filter: blur(12px);
}

.menu-title {
    padding: 9px 12px;

    color: #00eaff;

    font-size: 12px;
    font-weight: bold;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);
}

.menu-section {
    padding: 5px 0;
}

.menu-section-title {
    padding: 5px 12px;

    color: #6f7c91;

    font-size: 10px;
    font-weight: bold;

    letter-spacing: 1px;
}

.menu-item {
    padding: 9px 12px;

    border-radius: 6px;

    color: #e9edf5;

    font-size: 13px;

    cursor: pointer;
}

.menu-item:hover {
    background:
        rgba(0,234,255,0.13);

    color: #00eaff;
}

.menu-item.delete:hover {
    background:
        rgba(255,65,108,0.15);

    color: #ff587d;
}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 600px) {

    #ui {
        top: 8px;
        left: 8px;

        padding: 8px 10px;
    }

    #ui-title {
        font-size: 11px;
    }

    #ui-help {
        font-size: 9px;
    }

    .node {
        width: 130px;
        height: 130px;

        margin-left: -65px;
        margin-top: -65px;
    }

    .node-name {
        font-size: 14px;
    }

    #contextMenu {
        min-width: 220px;
    }
}
</style>

</head>

<body>

<div id="viewport">

```
<div id="map">

    <svg id="relations"
         viewBox="0 0 3000 3000"
         preserveAspectRatio="none">
    </svg>

</div>
```

</div>

<div id="ui">

```
<div id="ui-title">
    CHARACTER RELATION MAP
</div>

<div id="ui-help">
    背景ドラッグ：マップ移動<br>
    ノードドラッグ：キャラクター移動<br>
    クリック：OPEN / CLOSE<br>
    ホイール：拡大・縮小<br>
    右クリック：操作メニュー
</div>
```

</div>

<div id="contextMenu"></div>

<script>
/* =========================================================
   基本設定
========================================================= */

const MAP_WIDTH = 3000;
const MAP_HEIGHT = 3000;

const NODE_RADIUS = 75;

const MIN_ZOOM = 0.35;
const MAX_ZOOM = 2.5;


/* =========================================================
   キャラクターデータ
========================================================= */

let characterData = [

    {
        id: "hero",
        name: "主人公",
        x: 1050,
        y: 1100,
        status: "OPEN"
    },

    {
        id: "rival",
        name: "ライバル",
        x: 1450,
        y: 900,
        status: "OPEN"
    },

    {
        id: "childhood",
        name: "幼馴染",
        x: 700,
        y: 1450,
        status: "OPEN"
    },

    {
        id: "boss",
        name: "組織ボス",
        x: 1750,
        y: 1450,
        status: "OPEN"
    }

];


/* =========================================================
   関係データ
========================================================= */

let relationData = [

    {
        id: "r1",
        from: "hero",
        to: "rival",
        name: "ライバル",
        color: "#ff4d8d"
    },

    {
        id: "r2",
        from: "hero",
        to: "childhood",
        name: "幼馴染",
        color: "#00eaff"
    },

    {
        id: "r3",
        from: "rival",
        to: "boss",
        name: "敵対",
        color: "#ff416c"
    },

    {
        id: "r4",
        from: "hero",
        to: "boss",
        name: "因縁",
        color: "#ffc857"
    }

];


/* =========================================================
   DOM
========================================================= */

const viewport =
    document.getElementById("viewport");

const map =
    document.getElementById("map");

const svg =
    document.getElementById("relations");

const contextMenu =
    document.getElementById("contextMenu");


/* =========================================================
   状態
========================================================= */

const nodes = {};
const relationElements = {};

let mapX = 0;
let mapY = 0;

let zoom = 1;


/* =========================================================
   ID生成
========================================================= */

function createId(prefix) {

    return prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 7);

}


/* =========================================================
   ノード作成
========================================================= */

function createNode(data) {

    const element =
        document.createElement("div");

    element.className =
        "node " +
        (
            data.status === "OPEN"
                ? "open"
                : "close"
        );

    element.dataset.id =
        data.id;

    element.style.left =
        data.x + "px";

    element.style.top =
        data.y + "px";


    const name =
        document.createElement("div");

    name.className =
        "node-name";

    name.textContent =
        data.name;


    const status =
        document.createElement("div");

    status.className =
        "status";

    status.textContent =
        data.status;


    element.appendChild(name);
    element.appendChild(status);

    map.appendChild(element);


    const info = {

        data: data,

        element: element,

        x: data.x,

        y: data.y,

        dragging: false,

        moved: false,

        startX: 0,

        startY: 0,

        originalX: 0,

        originalY: 0

    };


    nodes[data.id] =
        info;


    setupNodePointerEvents(info);


    return info;
}


/* =========================================================
   全ノード再構築
========================================================= */

function rebuildNodes() {

    Object.values(nodes).forEach(info => {

        info.element.remove();

    });


    Object.keys(nodes).forEach(key => {

        delete nodes[key];

    });


    characterData.forEach(data => {

        createNode(data);

    });

}


/* =========================================================
   ノード Pointer Events
========================================================= */

function setupNodePointerEvents(info) {

    const element =
        info.element;


    element.addEventListener(
        "pointerdown",
        event => {

            /*
             * 右クリックはドラッグ開始しない
             */

            if (event.button === 2) {
                return;
            }


            event.stopPropagation();


            element.setPointerCapture(
                event.pointerId
            );


            info.dragging = true;
            info.moved = false;


            info.startX =
                event.clientX;

            info.startY =
                event.clientY;


            info.originalX =
                info.x;

            info.originalY =
                info.y;


            element.classList.add(
                "dragging"
            );

        }
    );


    element.addEventListener(
        "pointermove",
        event => {

            if (!info.dragging) {
                return;
            }


            const dx =
                event.clientX -
                info.startX;

            const dy =
                event.clientY -
                info.startY;


            if (
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ) {

                info.moved = true;

            }


            if (!info.moved) {
                return;
            }


            let newX =
                info.originalX +
                dx / zoom;

            let newY =
                info.originalY +
                dy / zoom;


            newX =
                Math.max(
                    NODE_RADIUS,
                    Math.min(
                        MAP_WIDTH - NODE_RADIUS,
                        newX
                    )
                );


            newY =
                Math.max(
                    NODE_RADIUS,
                    Math.min(
                        MAP_HEIGHT - NODE_RADIUS,
                        newY
                    )
                );


            info.x = newX;
            info.y = newY;

            info.data.x = newX;
            info.data.y = newY;


            element.style.left =
                newX + "px";

            element.style.top =
                newY + "px";


            updateRelations();

        }
    );


    element.addEventListener(
        "pointerup",
        event => {

            if (!info.dragging) {
                return;
            }


            info.dragging =
                false;


            element.classList.remove(
                "dragging"
            );


            /*
             * 移動していなければ
             * タップ / クリック
             */

            if (!info.moved) {

                toggleNode(info);

            }

        }
    );


    element.addEventListener(
        "pointercancel",
        () => {

            info.dragging =
                false;

            element.classList.remove(
                "dragging"
            );

        }
    );


    /*
     * ノード右クリック
     */

    element.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();
            event.stopPropagation();

            showNodeMenu(
                info,
                event.clientX,
                event.clientY
            );

        }
    );

}


/* =========================================================
   OPEN / CLOSE
========================================================= */

function toggleNode(info) {

    info.data.status =
        info.data.status === "OPEN"
            ? "CLOSE"
            : "OPEN";


    info.element.classList.toggle(
        "open",
        info.data.status === "OPEN"
    );

    info.element.classList.toggle(
        "close",
        info.data.status === "CLOSE"
    );


    info.element.querySelector(
        ".status"
    ).textContent =
        info.data.status;


    updateRelations();

}


/* =========================================================
   関係作成
========================================================= */

function createRelationElement(relation) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.classList.add("relation");


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.classList.add(
        "relation-line"
    );

    line.setAttribute(
        "stroke",
        relation.color
    );


    const marker =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    marker.classList.add(
        "relation-marker"
    );

    marker.setAttribute(
        "r",
        "7"
    );

    marker.setAttribute(
        "fill",
        relation.color
    );


    const label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    label.classList.add(
        "relation-label"
    );


    const rect =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
        );

    rect.setAttribute(
        "stroke",
        relation.color
    );


    const text =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    text.textContent =
        relation.name;


    label.appendChild(rect);
    label.appendChild(text);

    group.appendChild(line);
    group.appendChild(marker);
    group.appendChild(label);

    svg.appendChild(group);


    relationElements[relation.id] = {

        group,
        line,
        marker,
        label,
        rect,
        text

    };

}


/* =========================================================
   関係再構築
========================================================= */

function rebuildRelations() {

    Object.values(relationElements)
        .forEach(item => {

            item.group.remove();

        });


    Object.keys(relationElements)
        .forEach(key => {

            delete relationElements[key];

        });


    relationData.forEach(
        createRelationElement
    );


    updateRelations();

}


/* =========================================================
   関係更新
========================================================= */

function updateRelations() {

    relationData.forEach(
        relation => {

            const a =
                nodes[relation.from];

            const b =
                nodes[relation.to];

            const e =
                relationElements[
                    relation.id
                ];


            if (!a || !b || !e) {
                return;
            }


            const hidden =
                a.data.status === "CLOSE" ||
                b.data.status === "CLOSE";


            e.group.classList.toggle(
                "hidden",
                hidden
            );


            const x1 = a.x;
            const y1 = a.y;

            const x2 = b.x;
            const y2 = b.y;


            e.line.setAttribute(
                "x1",
                x1
            );

            e.line.setAttribute(
                "y1",
                y1
            );

            e.line.setAttribute(
                "x2",
                x2
            );

            e.line.setAttribute(
                "y2",
                y2
            );


            const cx =
                (x1 + x2) / 2;

            const cy =
                (y1 + y2) / 2;


            e.marker.setAttribute(
                "cx",
                cx
            );

            e.marker.setAttribute(
                "cy",
                cy
            );


            e.text.textContent =
                relation.name;

            e.text.setAttribute(
                "x",
                cx
            );

            e.text.setAttribute(
                "y",
                cy
            );


            let width;

            try {

                width =
                    e.text.getComputedTextLength();

            } catch {

                width =
                    relation.name.length * 14;

            }


            width += 20;

            const height = 27;


            e.rect.setAttribute(
                "x",
                cx - width / 2
            );

            e.rect.setAttribute(
                "y",
                cy - height / 2
            );

            e.rect.setAttribute(
                "width",
                width
            );

            e.rect.setAttribute(
                "height",
                height
            );

        }
    );

}


/* =========================================================
   ズーム
========================================================= */

viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        /*
         * マウス位置をマップ座標へ変換
         */

        const rect =
            viewport.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;

        const mouseY =
            event.clientY -
            rect.top;


        const mapPointX =
            (mouseX - mapX) / zoom;

        const mapPointY =
            (mouseY - mapY) / zoom;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 0.89;


        const newZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    zoom * factor
                )
            );


        /*
         * マウス位置を
         * 同じマップ座標に固定
         */

        mapX =
            mouseX -
            mapPointX * newZoom;

        mapY =
            mouseY -
            mapPointY * newZoom;


        zoom = newZoom;


        clampMapPosition();

        applyTransform();

    },
    {
        passive: false
    }
);


/* =========================================================
   マップ移動
========================================================= */

let mapDragging = false;

let mapStartX = 0;
let mapStartY = 0;

let mapOriginalX = 0;
let mapOriginalY = 0;


viewport.addEventListener(
    "pointerdown",
    event => {

        /*
         * ノード上ならマップ移動しない
         */

        if (
            event.target.closest(".node")
        ) {
            return;
        }


        /*
         * 右クリックでは動かさない
         */

        if (event.button === 2) {
            return;
        }


        viewport.setPointerCapture(
            event.pointerId
        );


        mapDragging = true;


        mapStartX =
            event.clientX;

        mapStartY =
            event.clientY;


        mapOriginalX =
            mapX;

        mapOriginalY =
            mapY;


        map.classList.add(
            "dragging-map"
        );

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if (!mapDragging) {
            return;
        }


        mapX =
            mapOriginalX +
            event.clientX -
            mapStartX;

        mapY =
            mapOriginalY +
            event.clientY -
            mapStartY;


        clampMapPosition();

        applyTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    () => {

        mapDragging = false;

        map.classList.remove(
            "dragging-map"
        );

    }
);


viewport.addEventListener(
    "pointercancel",
    () => {

        mapDragging = false;

        map.classList.remove(
            "dragging-map"
        );

    }
);


/* =========================================================
   マップ位置制限
========================================================= */

function clampMapPosition() {

    const viewportWidth =
        viewport.clientWidth;

    const viewportHeight =
        viewport.clientHeight;


    const scaledWidth =
        MAP_WIDTH * zoom;

    const scaledHeight =
        MAP_HEIGHT * zoom;


    let minX;

    let maxX;

    let minY;

    let maxY;


    /*
     * マップが画面より大きい場合
     */

    if (scaledWidth >= viewportWidth) {

        minX =
            viewportWidth -
            scaledWidth;

        maxX = 0;

    } else {

        /*
         * マップのほうが小さい場合は中央固定
         */

        minX =
            (viewportWidth -
             scaledWidth) / 2;

        maxX = minX;

    }


    if (scaledHeight >= viewportHeight) {

        minY =
            viewportHeight -
            scaledHeight;

        maxY = 0;

    } else {

        minY =
            (viewportHeight -
             scaledHeight) / 2;

        maxY = minY;

    }


    mapX =
        Math.max(
            minX,
            Math.min(
                maxX,
                mapX
            )
        );


    mapY =
        Math.max(
            minY,
            Math.min(
                maxY,
                mapY
            )
        );

}


/* =========================================================
   Transform
========================================================= */

function applyTransform() {

    map.style.transform =
        `translate(${mapX}px, ${mapY}px) scale(${zoom})`;

}


/* =========================================================
   初期位置をノード群の中央へ
========================================================= */

function centerOnCharacters() {

    if (
        characterData.length === 0
    ) {
        return;
    }


    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;


    characterData.forEach(data => {

        minX =
            Math.min(
                minX,
                data.x
            );

        maxX =
            Math.max(
                maxX,
                data.x
            );

        minY =
            Math.min(
                minY,
                data.y
            );

        maxY =
            Math.max(
                maxY,
                data.y
            );

    });


    const centerX =
        (minX + maxX) / 2;

    const centerY =
        (minY + maxY) / 2;


    const viewportWidth =
        viewport.clientWidth;

    const viewportHeight =
        viewport.clientHeight;


    /*
     * ノード群の中心を
     * 画面中央へ移動
     */

    mapX =
        viewportWidth / 2 -
        centerX * zoom;

    mapY =
        viewportHeight / 2 -
        centerY * zoom;


    clampMapPosition();

    applyTransform();

}


/* =========================================================
   コンテキストメニュー共通
========================================================= */

function showMenu(x, y, html) {

    contextMenu.innerHTML =
        html;


    contextMenu.style.display =
        "block";


    /*
     * 画面外へ出ないよう調整
     */

    const menuWidth =
        230;

    const menuHeight =
        contextMenu.offsetHeight || 250;


    x =
        Math.min(
            x,
            window.innerWidth -
            menuWidth -
            8
        );

    y =
        Math.min(
            y,
            window.innerHeight -
            menuHeight -
            8
        );


    x =
        Math.max(
            5,
            x
        );

    y =
        Math.max(
            5,
            y
        );


    contextMenu.style.left =
        x + "px";

    contextMenu.style.top =
        y + "px";

}


/* =========================================================
   背景右クリック
========================================================= */

viewport.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

        showBackgroundMenu(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   背景メニュー
========================================================= */

function showBackgroundMenu(x, y) {

    showMenu(
        x,
        y,

        `
        <div class="menu-title">
            マップ操作
        </div>

        <div class="menu-section">

            <div class="menu-section-title">
                キャラクタ操作
            </div>

            <div
                class="menu-item"
                onclick="addCharacterFromMenu()"
            >
                ＋ キャラクタを追加
            </div>

        </div>

        <div class="menu-section">

            <div class="menu-section-title">
                関係操作
            </div>

            <div
                class="menu-item"
                onclick="addRelationFromMenu()"
            >
                ＋ 関係を追加
            </div>

        </div>
        `
    );

}


/* =========================================================
   ノード右クリックメニュー
========================================================= */

function showNodeMenu(info, x, y) {

    const connectedRelations =
        relationData.filter(
            relation =>
                relation.from === info.data.id ||
                relation.to === info.data.id
        );


    let relationDeleteItems = "";


    if (
        connectedRelations.length === 0
    ) {

        relationDeleteItems =
            `
            <div
                class="menu-item"
                style="color:#667080"
            >
                接続中の関係なし
            </div>
            `;

    } else {

        connectedRelations.forEach(
            relation => {

                const a =
                    characterData.find(
                        c =>
                            c.id ===
                            relation.from
                    );

                const b =
                    characterData.find(
                        c =>
                            c.id ===
                            relation.to
                    );


                relationDeleteItems +=
                    `
                    <div
                        class="menu-item delete"
                        onclick="
                            deleteRelation('${relation.id}')
                        "
                    >
                        × ${a.name}
                        ─ ${relation.name} ─
                        ${b.name}
                    </div>
                    `;

            }
        );

    }


    showMenu(
        x,
        y,

        `
        <div class="menu-title">
            ${escapeHTML(info.data.name)}
        </div>

        <div class="menu-section">

            <div class="menu-section-title">
                キャラクタ操作
            </div>

            <div
                class="menu-item"
                onclick="
                    renameCharacter('${info.data.id}')
                "
            >
                ✎ 変更
            </div>

            <div
                class="menu-item"
                onclick="
                    addCharacterAtNode('${info.data.id}')
                "
            >
                ＋ 追加
            </div>

            <div
                class="menu-item delete"
                onclick="
                    deleteCharacter('${info.data.id}')
                "
            >
                × 削除
            </div>

        </div>

        <div class="menu-section">

            <div class="menu-section-title">
                関係操作
            </div>

            <div
                class="menu-item"
                onclick="
                    renameRelationPrompt('${info.data.id}')
                "
            >
                ✎ 変更
            </div>

            <div
                class="menu-item"
                onclick="
                    addRelationFromCharacter('${info.data.id}')
                "
            >
                ＋ 追加
            </div>

        </div>

        <div class="menu-section">

            <div class="menu-section-title">
                接続関係を削除
            </div>

            ${relationDeleteItems}

        </div>
        `
    );

}


/* =========================================================
   メニューを閉じる
========================================================= */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            contextMenu.style.display =
                "none";

        }

    }
);


/* =========================================================
   キャラクター変更
========================================================= */

function renameCharacter(id) {

    closeMenu();


    const character =
        characterData.find(
            c => c.id === id
        );


    if (!character) {
        return;
    }


    const newName =
        prompt(
            "キャラクター名を変更してください",
            character.name
        );


    if (
        newName === null ||
        newName.trim() === ""
    ) {
        return;
    }


    character.name =
        newName.trim();


    const info =
        nodes[id];


    if (info) {

        info.element.querySelector(
            ".node-name"
        ).textContent =
            character.name;

    }


    updateRelations();

}


/* =========================================================
   キャラクター追加
========================================================= */

function addCharacterFromMenu() {

    closeMenu();

    addCharacter();

}


function addCharacterAtNode(id) {

    closeMenu();

    const info =
        nodes[id];


    if (!info) {
        return;
    }


    addCharacter(
        info.x + 220,
        info.y + 120
    );

}


function addCharacter(x = 1500, y = 1500) {

    const name =
        prompt(
            "追加するキャラクター名を入力してください",
            "新キャラクター"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {
        return;
    }


    const data = {

        id:
            createId("character"),

        name:
            name.trim(),

        x:
            Math.max(
                NODE_RADIUS,
                Math.min(
                    MAP_WIDTH - NODE_RADIUS,
                    x
                )
            ),

        y:
            Math.max(
                NODE_RADIUS,
                Math.min(
                    MAP_HEIGHT - NODE_RADIUS,
                    y
                )
            ),

        status:
            "OPEN"

    };


    characterData.push(data);

    createNode(data);

    updateRelations();

}


/* =========================================================
   キャラクター削除
========================================================= */

function deleteCharacter(id) {

    closeMenu();


    const character =
        characterData.find(
            c => c.id === id
        );


    if (!character) {
        return;
    }


    const ok =
        confirm(
            `「${character.name}」を削除しますか？\n\n接続されている関係も削除されます。`
        );


    if (!ok) {
        return;
    }


    /*
     * 関係を先に削除
     */

    relationData =
        relationData.filter(
            relation =>
                relation.from !== id &&
                relation.to !== id
        );


    /*
     * キャラクター削除
     */

    characterData =
        characterData.filter(
            c => c.id !== id
        );


    if (nodes[id]) {

        nodes[id].element.remove();

        delete nodes[id];

    }


    rebuildRelations();

}


/* =========================================================
   関係変更
========================================================= */

function renameRelationPrompt(
    characterId
) {

    closeMenu();


    const connected =
        relationData.filter(
            r =>
                r.from === characterId ||
                r.to === characterId
        );


    if (
        connected.length === 0
    ) {

        alert(
            "このキャラクターには関係がありません。"
        );

        return;
    }


    /*
     * 複数ある場合は選択
     */

    let message =
        "変更する関係を選択してください。\n\n";


    connected.forEach(
        (relation, index) => {

            const a =
                characterData.find(
                    c =>
                        c.id ===
                        relation.from
                );

            const b =
                characterData.find(
                    c =>
                        c.id ===
                        relation.to
                );


            message +=
                `${index + 1}. ` +
                `${a.name} ─ ${relation.name} ─ ${b.name}\n`;

        }
    );


    const answer =
        prompt(
            message +
            "\n番号を入力してください。"
        );


    if (answer === null) {
        return;
    }


    const index =
        parseInt(answer, 10) - 1;


    if (
        index < 0 ||
        index >= connected.length
    ) {

        alert(
            "正しい番号を入力してください。"
        );

        return;
    }


    const relation =
        connected[index];


    const newName =
        prompt(
            "関係名を変更してください",
            relation.name
        );


    if (
        newName === null ||
        newName.trim() === ""
    ) {
        return;
    }


    relation.name =
        newName.trim();


    rebuildRelations();

}


/* =========================================================
   関係追加
========================================================= */

function addRelationFromMenu() {

    closeMenu();

    addRelation();

}


function addRelationFromCharacter(
    characterId
) {

    closeMenu();

    addRelation(characterId);

}


function addRelation(
    fixedCharacterId = null
) {

    if (
        characterData.length < 2
    ) {

        alert(
            "関係を作るには2人以上のキャラクターが必要です。"
        );

        return;
    }


    let fromId =
        fixedCharacterId;


    /*
     * 始点
     */

    if (!fromId) {

        fromId =
            chooseCharacter(
                "関係の始点となるキャラクター番号を入力してください"
            );

    }


    if (!fromId) {
        return;
    }


    /*
     * 終点
     */

    let toId =
        chooseCharacter(
            "関係の終点となるキャラクター番号を入力してください"
        );


    if (!toId) {
        return;
    }


    if (fromId === toId) {

        alert(
            "同じキャラクター同士には関係を作れません。"
        );

        return;
    }


    const name =
        prompt(
            "関係名を入力してください",
            "友人"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {
        return;
    }


    const color =
        prompt(
            "関係線の色を入力してください。\n例：#00eaff",
            "#00eaff"
        );


    if (
        color === null ||
        color.trim() === ""
    ) {
        return;
    }


    relationData.push({

        id:
            createId("relation"),

        from:
            fromId,

        to:
            toId,

        name:
            name.trim(),

        color:
            color.trim()

    });


    rebuildRelations();

}


/* =========================================================
   キャラクター選択
========================================================= */

function chooseCharacter(message) {

    let list =
        "キャラクター一覧\n\n";


    characterData.forEach(
        (character, index) => {

            list +=
                `${index + 1}. ` +
                `${character.name}\n`;

        }
    );


    const answer =
        prompt(
            list +
            "\n" +
            message
        );


    if (answer === null) {
        return null;
    }


    const index =
        parseInt(answer, 10) - 1;


    if (
        index < 0 ||
        index >= characterData.length
    ) {

        alert(
            "正しい番号を入力してください。"
        );

        return null;
    }


    return characterData[index].id;

}


/* =========================================================
   関係削除
========================================================= */

function deleteRelation(id) {

    closeMenu();


    const relation =
        relationData.find(
            r => r.id === id
        );


    if (!relation) {
        return;
    }


    const a =
        characterData.find(
            c => c.id === relation.from
        );

    const b =
        characterData.find(
            c => c.id === relation.to
        );


    const ok =
        confirm(
            `「${a.name}」と「${b.name}」の\n` +
            `関係「${relation.name}」を削除しますか？`
        );


    if (!ok) {
        return;
    }


    relationData =
        relationData.filter(
            r => r.id !== id
        );


    rebuildRelations();

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   メニュー閉じる
========================================================= */

function closeMenu() {

    contextMenu.style.display =
        "none";

}


/* =========================================================
   初期化
========================================================= */

function initialize() {

    rebuildNodes();

    rebuildRelations();

    /*
     * 最初は1倍で
     * キャラクター群の中央へ
     */

    zoom = 1;

    centerOnCharacters();

}


initialize();


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
    "resize",
    () => {

        clampMapPosition();

        applyTransform();

    }
);

</script>
