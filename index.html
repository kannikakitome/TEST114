<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                 initial-scale=1.0, 
                 user-scalable=no">
    <title>サイバーパンク キャラクター相関図</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --grid-color: rgba(0, 242, 254, 0.05);
            --node-open-color: #00f2fe;
            --node-close-color: #ff0055;
            --text-color: #ffffff;
            --panel-bg: rgba(20, 24, 33, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', 
                         Arial, sans-serif;
        }

        /* ビューポート（画面サイズ） */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* 広大なマップコンテナ */
        #map-container {
            width: 3000px;
            height: 3000px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(
                    var(--grid-color) 1px, 
                    transparent 1px
                ),
                linear-gradient(
                    90deg, 
                    var(--grid-color) 1px, 
                    transparent 1px
                );
            background-size: 40px 40px;
            transform-origin: 0 0;
        }

        /* SVGレイヤー（関係線用） */
        #svg-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .relation-line {
            stroke-width: 2;
            stroke-dasharray: 4 4;
            animation: dash 30s linear infinite;
            transition: opacity 0.3s ease;
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* 関係名テキストと座布団（SVG内） */
        .relation-label-bg {
            fill: #141821;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        
        .relation-label-text {
            fill: #ffffff;
            font-size: 11px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            letter-spacing: 1px;
        }

        .relation-point {
            stroke-width: 2;
        }

        /* キャラクターノードの配置エリア */
        #nodes-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* キャラクターノード単体 */
        .node {
            width: 100px;
            height: 100px;
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            transition: border 0.3s, 
                        box-shadow 0.3s, 
                        transform 0.1s;
            background: radial-gradient(
                circle, 
                rgba(25,32,45,0.9) 0%, 
                rgba(14,18,26,0.95) 100__
            );
            border: 2px solid transparent;
        }

        /* 状態別のネオンエフェクト */
        .node.state-open {
            border-color: var(--node-open-color);
            box-shadow: 
                0 0 15px rgba(0, 242, 254, 0.3), 
                inset 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .node.state-close {
            border-color: var(--node-close-color);
            box-shadow: 
                0 0 15px rgba(255, 0, 85, 0.3), 
                inset 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .node:active {
            transform: scale(0.96);
        }

        /* ノード内のテキスト */
        .node-name {
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
            padding: 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 状態バッジ */
        .node-badge {
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .state-open .node-badge {
            background-color: rgba(0, 242, 254, 0.15);
            color: var(--node-open-color);
        }

        .state-close .node-badge {
            background-color: rgba(250, 0, 85, 0.15);
            color: var(--node-close-color);
        }

        /* 説明用簡易ヘルプパネル */
        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border-left: 4px solid var(--node-open-color);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            color: var(--text-color);
            font-size: 12px;
            line-height: 1.6;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        #info-panel h1 { 
            font-size: 14px; 
            margin-bottom: 4px; 
            color: var(--node-open-color); 
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>RELATION MAP SYSTEM</h1>
        <p>・背景ドラッグ：マップのスクロール</p>
        <p>・ノードドラッグ：位置の移動</p>
        <p>・ノードタップ：OPEN / CLOSE の切り替え</p>
    </div>

    <div id="viewport">
        <div id="map-container">
            <svg id="svg-layer"></svg>
            <div id="nodes-layer"></div>
        </div>
    </div>

    <script>
        // --- 初期データ定義 ---
        const initialData = {
            nodes: [
                { id: "hero", name: "主人公", state: "OPEN", x: 400, y: 400 },
                { id: "rival", name: "ライバル", state: "OPEN", x: 750, y: 350 },
                { id: "childhood", name: "幼馴染", state: "OPEN", x: 350, y: 700 },
                { id: "boss", name: "組織ボス", state: "OPEN", x: 800, y: 750 }
            ],
            relations: [
                { from: "hero", to: "rival", name: "切磋琢磨", color: "#39ff14" },
                { from: "hero", to: "childhood", name: "好意・信頼", color: "#ff007f" },
                { from: "hero", to: "boss", name: "宿敵", color: "#ff0055" },
                { from: "rival", to: "boss", name: "利用関係", color: "#ffff00" }
            ]
        };

        // --- 定数・変数の初期化 ---
        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 3000;
        const NODE_RADIUS = 50;

        let nodes = [...initialData.nodes];
        let relations = [...initialData.relations];

        const viewport = document.getElementById('viewport');
        const mapContainer = document.getElementById('map-container');
        const svgLayer = document.getElementById('svg-layer');
        const nodesLayer = document.getElementById('nodes-layer');

        let mapX = 0;
        let mapY = 0;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };

        // --- 画面初期中央寄せ計算 ---
        function initMapPosition() {
            const vW = viewport.clientWidth;
            const vH = viewport.clientHeight;
            mapX = Math.max(
                Math.min(0, (vW / 2) - 550), 
                vW - MAP_WIDTH
            );
            mapY = Math.max(
                Math.min(0, (vH / 2) - 500), 
                vH - MAP_HEIGHT
            );
            updateMapTransform();
        }

        function updateMapTransform() {
            mapContainer.style.transform = 
                `translate(${mapX}px, ${mapY}px)`;
        }

        // --- 背景ドラッグ（マップスクロール）処理 ---
        viewport.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.node')) return;
            
            isPanning = true;
            viewport.setPointerCapture(e.pointerId);
            panStart.x = e.clientX - mapX;
            panStart.y = e.clientY - mapY;
        });

        viewport.addEventListener('pointermove', (e) => {
            if (!isPanning) return;
            
            let targetX = e.clientX - panStart.x;
            let targetY = e.clientY - panStart.y;

            const minX = viewport.clientWidth - MAP_WIDTH;
            const minY = viewport.clientHeight - MAP_HEIGHT;

            mapX = Math.min(0, Math.max(minX, targetX));
            mapY = Math.min(0, Math.max(minY, targetY));

            updateMapTransform();
        });

        viewport.addEventListener('pointerup', (e) => {
            if (isPanning) {
                viewport.releasePointerCapture(e.pointerId);
                isPanning = false;
            }
        });

        // --- ノード・関係線の生成と描画群 ---
        function createNodes() {
            nodesLayer.innerHTML = '';
            nodes.forEach(node => {
                const div = document.createElement('div');
                div.id = `node-${node.id}`;
                div.className = `node state-${node.state.toLowerCase()}`;
                div.style.left = `${node.x - NODE_RADIUS}px`;
                div.style.top = `${node.y - NODE_RADIUS}px`;

                div.innerHTML = `
                    <div class="node-name">${node.name}</div>
${node.state}
`;
setupNodeDragAndTap(div, node);
nodesLayer.appendChild(div);
});
}
function createRelations() {
svgLayer.innerHTML = '';
relations.forEach((rel, index) => {
const g = document.createElementNS(
'w3.org', 'g'
);
g.id = rel-group-${index};
const line = document.createElementNS(
'w3.org', 'line'
);
line.setAttribute('class', 'relation-line');
line.setAttribute('stroke', rel.color || '#00f2fe');
g.appendChild(line);
const circle = document.createElementNS(
'w3.org', 'circle'
);
circle.setAttribute('class', 'relation-point');
circle.setAttribute('r', '4');
circle.setAttribute('fill', '#141821');
circle.setAttribute('stroke', rel.color || '#00f2fe');
g.appendChild(circle);
const rect = document.createElementNS(
'w3.org', 'rect'
);
rect.setAttribute('class', 'relation-label-bg');
rect.setAttribute('stroke', rel.color || '#00f2fe');
g.appendChild(rect);
const text = document.createElementNS(
'w3.org', 'text'
);
text.setAttribute('class', 'relation-label-text');
text.textContent = rel.name;
g.appendChild(text);
svgLayer.appendChild(g);
});
updateRelationsPositions();
}
function updateRelationsPositions() {
relations.forEach((rel, index) => {
const g = document.getElementById(rel-group-${index});
if (!g) return;
const fromNode = nodes.find(n => n.id === rel.from);
const toNode = nodes.find(n => n.id === rel.to);
if (!fromNode || !toNode) return;
if (fromNode.state === 'CLOSE' ||
toNode.state === 'CLOSE') {
g.style.opacity = '0';
g.style.pointerEvents = 'none';
return;
} else {
g.style.opacity = '1';
}
const x1 = fromNode.x;
const y1 = fromNode.y;
const x2 = toNode.x;
const y2 = toNode.y;
const midX = (x1 + x2) / 2;
const midY = (y1 + y2) / 2;
const line = g.querySelector('.relation-line');
line.setAttribute('x1', x1);
line.setAttribute('y1', y1);
line.setAttribute('x2', x2);
line.setAttribute('y2', y2);
const circle = g.querySelector('.relation-point');
circle.setAttribute('cx', midX);
circle.setAttribute('cy', midY);
const text = g.querySelector('.relation-label-text');
text.setAttribute('x', midX);
text.setAttribute('y', midY);
const rect = g.querySelector('.relation-label-bg');
const bbox = text.getBBox();
const paddingW = 12;
const paddingH = 6;
const w = bbox.width > 0 ?
bbox.width + paddingW :
rel.name.length * 12 + paddingW;
const h = bbox.height > 0 ?
bbox.height + paddingH :
16 + paddingH;
rect.setAttribute('x', midX - w / 2);
rect.setAttribute('y', midY - h / 2);
rect.setAttribute('width', w);
rect.setAttribute('height', h);
});
}
// --- ノードのドラッグ＆タップ判定ロジック ---
function setupNodeDragAndTap(el, nodeData) {
let dragStart = { x: 0, y: 0 };
let isDragging = false;
let startTime = 0;
el.addEventListener('pointerdown', (e) => {
e.stopPropagation();
el.setPointerCapture(e.pointerId);
dragStart.x = e.clientX - nodeData.x;
dragStart.y = e.clientY - nodeData.y;
isDragging = true;
startTime = Date.now();
});
el.addEventListener('pointermove', (e) => {
if (!isDragging) return;
e.stopPropagation();
let newX = e.clientX - dragStart.x;
let newY = e.clientY - dragStart.y;
nodeData.x = Math.max(
NODE_RADIUS,
Math.min(MAP_WIDTH - NODE_RADIUS, newX)
);
nodeData.y = Math.max(
NODE_RADIUS,
Math.min(MAP_HEIGHT - NODE_RADIUS, newY)
);
el.style.left = ${nodeData.x - NODE_RADIUS}px;
el.style.top = ${nodeData.y - NODE_RADIUS}px;
updateRelationsPositions();
});
el.addEventListener('pointerup', (e) => {
if (!isDragging) return;
e.stopPropagation();
el.releasePointerCapture(e.pointerId);
isDragging = false;
const duration = Date.now() - startTime;
if (duration < 250) {
nodeData.state = nodeData.state === 'OPEN' ?
'CLOSE' : 'OPEN';
el.className =
node state-${nodeData.state.toLowerCase()};
el.querySelector('.node-badge')
.textContent = nodeData.state;
updateRelationsPositions();
}
});
}
// --- 初期化起動 ---
window.addEventListener('DOMContentLoaded', () => {
initMapPosition();
createNodes();
createRelations();
setTimeout(updateRelationsPositions, 50);
});
window.addEventListener('resize', () => {
const minX = viewport.clientWidth - MAP_WIDTH;
const minY = viewport.clientHeight - MAP_HEIGHT;
mapX = Math.min(0, Math.max(minX, mapX));
mapY = Math.min(0, Math.max(minY, mapY));
updateMapTransform();
});
