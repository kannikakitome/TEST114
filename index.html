/* =========================================================

const MAP_WIDTH = 3000;

const MAP_HEIGHT = 3000;

const NODE_RADIUS = 75;

const MIN_ZOOM = 0.35;

const MAX_ZOOM = 2.5;

let mapX = 0;

    }

];


/* =========================================================
   関係

   from → to

   「fromがtoに何を思っているか」
========================================================= */

let relationData = [

    {
        id: "r1",

        from: "hero",

        to: "rival",

        name: "憧れ",

        color: "#ff4d8d",

        /*
         * 関係名をドラッグした量。
         *
         * 関係点・線・関係名すべてに反映。
         */
        offsetX: 0,

        offsetY: 0
    },

    {

        from: "rival",

        to: "hero",

        color: "#ff9f43",

    },

    {
        id: "r3",

        from: "hero",

        to: "childhood",

        name: "信頼",

        color: "#00eaff",

        offsetX: 0,

        offsetY: 0
    },

    {
        id: "r4",

        from: "rival",

        to: "boss",

        name: "敵意",

        color: "#ff416c",

        offsetX: 0,

        offsetY: 0
    },

    {
        id: "r5",

        from: "hero",

        to: "boss",

        name: "警戒",

        color: "#ffc857",

        offsetX: 0,

        offsetY: 0
    }

];


/* =========================================================
   DOM
========================================================= */

const viewport =
    document.getElementById("viewport");

const map =
    document.getElementById("map");

const relationLayer =
    document.getElementById("relationLayer");

const contextMenu =
    document.getElementById("contextMenu");

const importFile =
    document.getElementById("importFile");

const modeIndicator =
    document.getElementById("modeIndicator");


/* =========================================================
   ID
========================================================= */

function createId(prefix) {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,7)
    );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   キャラ取得
========================================================= */

function getCharacter(id) {

    return characterData.find(
        character =>
            character.id === id
    );

}


/* =========================================================
   Transform
========================================================= */

function applyTransform() {

    map.style.transform =
        `translate(${mapX}px, ${mapY}px) scale(${zoom})`;

}


/* =========================================================
   マップ制限
========================================================= */

function clampMapPosition() {

    const width =
        viewport.clientWidth;

    const height =
        viewport.clientHeight;

    const scaledWidth =
        MAP_WIDTH * zoom;

    const scaledHeight =
        MAP_HEIGHT * zoom;


    if (scaledWidth <= width) {

        mapX =
            (width - scaledWidth) / 2;

    } else {

        const minX =
            width - scaledWidth;

        mapX =
            Math.min(
                0,
                Math.max(minX,mapX)
            );

    }


    if (scaledHeight <= height) {

        mapY =
            (height - scaledHeight) / 2;

    } else {

        const minY =
            height - scaledHeight;

        mapY =
            Math.min(
                0,
                Math.max(minY,mapY)
            );

    }

}


/* =========================================================
   キャラ描画
========================================================= */

function renderCharacters() {

    document
        .querySelectorAll(".node")
        .forEach(
            node => node.remove()
        );


    characterData.forEach(
        character => {

            const node =
                document.createElement("div");


            node.className =
                "node";


            if (
                character.status === "CLOSE"
            ) {

                node.classList.add("close");

            }


            node.dataset.id =
                character.id;


            node.innerHTML = `

                <div class="node-name">
                    ${escapeHtml(character.name)}
                </div>

                <div class="node-status">
                    ${character.status}
                </div>

            `;


            node.style.left =
                character.x + "px";

            node.style.top =
                character.y + "px";


            map.appendChild(node);


            setupNodePointer(node);

        }
    );

}


/* =========================================================
   キャラ操作
========================================================= */

function setupNodePointer(node) {

    let pointerId = null;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;

    let moved = false;


    node.addEventListener(
        "pointerdown",
        event => {

            /*
             * ★重要
             *
             * 右クリックでは
             * ドラッグ処理を開始しない。
             */
            if (event.button !== 0) {

                return;

            }


            event.stopPropagation();


            pointerId =
                event.pointerId;


            node.setPointerCapture(
                pointerId
            );


            const character =
                getCharacter(
                    node.dataset.id
                );


            if (!character) {

                return;

            }


            startX =
                event.clientX;

            startY =
                event.clientY;


            originalX =
                character.x;

            originalY =
                character.y;


            moved = false;


            node.classList.add(
                "dragging"
            );

        }
    );


    node.addEventListener(
        "pointermove",
        event => {

            if (
                pointerId !== event.pointerId
            ) {

                return;

            }


            const dx =
                (
                    event.clientX -
                    startX
                ) / zoom;


            const dy =
                (
                    event.clientY -
                    startY
                ) / zoom;


            if (
                Math.abs(dx) > 3 ||
                Math.abs(dy) > 3
            ) {

                moved = true;

            }


            const character =
                getCharacter(
                    node.dataset.id
                );


            if (!character) {

                return;

            }


            character.x =
                Math.max(
                    NODE_RADIUS,

                    Math.min(
                        MAP_WIDTH -
                        NODE_RADIUS,

                        originalX + dx
                    )
                );


            character.y =
                Math.max(
                    NODE_RADIUS,

                    Math.min(
                        MAP_HEIGHT -
                        NODE_RADIUS,

                        originalY + dy
                    )
                );


            node.style.left =
                character.x + "px";


            node.style.top =
                character.y + "px";


            updateRelations();

        }
    );


    node.addEventListener(
        "pointerup",
        event => {

            if (
                pointerId !== event.pointerId
            ) {

                return;

            }


            try {

                node.releasePointerCapture(
                    pointerId
                );

            } catch(e) {}


            node.classList.remove(
                "dragging"
            );


            /*
             * 関係追加モード
             */
            if (
                relationModeActive &&
                relationStartId &&
                !moved
            ) {

                handleRelationTarget(
                    node.dataset.id
                );


                pointerId = null;

                return;

            }


            /*
             * 通常左クリック
             *
             * 右クリックではここには来ない。
             */
            if (!moved) {

                const character =
                    getCharacter(
                        node.dataset.id
                    );


                if (!character) {

                    pointerId = null;

                    return;

                }


                character.status =
                    character.status === "OPEN"
                        ? "CLOSE"
                        : "OPEN";


                renderCharacters();

                updateRelations();

            }


            pointerId = null;

        }
    );


    node.addEventListener(
        "pointercancel",
        () => {

            pointerId = null;

            node.classList.remove(
                "dragging"
            );

        }
    );


    /*
     * ★右クリック
     *
     * ここではメニューを出すだけ。
     * OPEN/CLOSEは絶対に切り替えない。
     */
    node.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            event.stopPropagation();


            showNodeMenu(
                event.clientX,
                event.clientY,
                node.dataset.id
            );

        }
    );

}


/* =========================================================
   相互関係判定
========================================================= */

/*
 * A → B の関係があるか
 */
function findRelation(
    fromId,
    toId
) {

    return relationData.find(
        relation =>
            relation.from === fromId &&
            relation.to === toId
    );

}


/*
 * 相互関係がある場合、
 * 現在の関係から見て
 * 逆向きの関係を探す。
 */
function hasReverseRelation(
    relation
) {

    return relationData.some(
        other =>
            other.id !== relation.id &&
            other.from === relation.to &&
            other.to === relation.from
    );

}


/* =========================================================
   関係の並行オフセット
========================================================= */

/*
 * 相互関係の場合、
 *
 * A → B
 * B → A
 *
 * を同じ線に重ねない。
 *
 * 線に対して垂直方向へ
 * 少しずつずらす。
 */
function getParallelOffset(
    relation
) {

    const reverse =
        findRelation(
            relation.to,
            relation.from
        );


    if (
        !reverse ||
        reverse.id === relation.id
    ) {

        return {
            x: 0,
            y: 0
        };

    }


    /*
     * ID順でどちらを上側にするか
     */
    const first =
        relation.id <
        reverse.id;


    /*
     * 関係線に対して
     * 垂直方向へ30px
     */
    const amount =
        first
            ? 28
            : -28;


    const from =
        getCharacter(
            relation.from
        );

    const to =
        getCharacter(
            relation.to
        );


    if (!from || !to) {

        return {
            x: 0,
            y: 0
        };

    }


    const dx =
        to.x - from.x;

    const dy =
        to.y - from.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance === 0) {

        return {
            x: 0,
            y: 0
        };

    }


    /*
     * 線に対する垂直ベクトル
     */
    const px =
        -dy / distance;

    const py =
        dx / distance;


    return {

        x: px * amount,

        y: py * amount

    };

}


/* =========================================================
   関係描画
========================================================= */

function updateRelations() {

    relationLayer.innerHTML = "";


    relationData.forEach(
        relation => {

            const from =
                getCharacter(
                    relation.from
                );

            const to =
                getCharacter(
                    relation.to
                );


            if (!from || !to) {

                return;

            }


            /*
             * ★CLOSE仕様
             *
             * 「関係元」がCLOSEなら消す。
             *
             * 関係先がCLOSEでも、
             * 関係元がOPENなら表示する。
             *
             * 例：
             *
             * A OPEN → B CLOSE
             *      ↓
             *    表示
             *
             * A CLOSE → B OPEN
             *      ↓
             *    非表示
             */
            if (
                from.status === "CLOSE"
            ) {

                return;

            }


            const group =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            group.classList.add(
                "relation-group"
            );


            group.dataset.id =
                relation.id;


            const x1 =
                from.x;

            const y1 =
                from.y;

            const x2 =
                to.x;

            const y2 =
                to.y;


            const dx =
                x2 - x1;

            const dy =
                y2 - y1;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance === 0) {

                return;

            }


            const nx =
                dx / distance;

            const ny =
                dy / distance;


            /*
             * 通常の線の開始・終了
             */
            let startX =
                x1 + nx * NODE_RADIUS;

            let startY =
                y1 + ny * NODE_RADIUS;


            let endX =
                x2 - nx * NODE_RADIUS;

            let endY =
                y2 - ny * NODE_RADIUS;


            /*
             * 相互関係なら
             * 線そのものを並行移動
             */
            const parallel =
                getParallelOffset(
                    relation
                );


            startX += parallel.x;
            startY += parallel.y;

            endX += parallel.x;
            endY += parallel.y;


            /*
             * 線の中央
             */
            const centerX =
                (startX + endX) / 2;

            const centerY =
                (startY + endY) / 2;


            /*
             * ★関係名をドラッグした量
             *
             * 関係点そのものが移動する。
             */
            const pointX =
                centerX +
                parallel.x +
                (relation.offsetX || 0);

            const pointY =
                centerY +
                parallel.y +
                (relation.offsetY || 0);


            /*
             * 関係元 → 関係点
             */
            const line1 =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line1.setAttribute(
                "x1",
                startX
            );

            line1.setAttribute(
                "y1",
                startY
            );

            line1.setAttribute(
                "x2",
                pointX
            );

            line1.setAttribute(
                "y2",
                pointY
            );


            line1.setAttribute(
                "class",
                "relation-line"
            );


            line1.setAttribute(
                "stroke",
                relation.color
            );


            /*
             * 関係点 → 関係先
             *
             * 矢印付き
             */
            const line2 =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line2.setAttribute(
                "x1",
                pointX
            );

            line2.setAttribute(
                "y1",
                pointY
            );

            line2.setAttribute(
                "x2",
                endX
            );

            line2.setAttribute(
                "y2",
                endY
            );


            line2.setAttribute(
                "class",
                "relation-line"
            );


            line2.setAttribute(
                "stroke",
                relation.color
            );


            line2.setAttribute(
                "marker-end",
                "url(#arrow)"
            );


            /*
             * 矢印色
             */
            const marker =
                document.querySelector(
                    "#arrow path"
                );


            /*
             * markerは共有されるので
             * CSS currentColorを利用
             */
            line2.style.color =
                relation.color;


            /*
             * 関係点
             */
            const point =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            point.setAttribute(
                "cx",
                pointX
            );

            point.setAttribute(
                "cy",
                pointY
            );

            point.setAttribute(
                "r",
                9
            );

            point.setAttribute(
                "class",
                "relation-point"
            );

            point.setAttribute(
                "fill",
                relation.color
            );


            /*
             * 関係名
             */
            const labelGroup =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            labelGroup.classList.add(
                "relation-label"
            );


            labelGroup.dataset.id =
                relation.id;


            /*
             * 相互関係では
             * 関係名も少し離す。
             *
             * ただし offsetX/Y は
             * ユーザーがドラッグした分。
             */
            let labelX =
                pointX;

            let labelY =
                pointY;


            /*
             * 関係名背景
             */
            const labelWidth =
                Math.max(
                    80,
                    relation.name.length * 21 + 30
                );


            const labelHeight =
                42;


            const bg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "rect"
                );


            bg.setAttribute(
                "x",
                labelX -
                labelWidth / 2
            );


            bg.setAttribute(
                "y",
                labelY -
                labelHeight / 2
            );


            bg.setAttribute(
                "width",
                labelWidth
            );


            bg.setAttribute(
                "height",
                labelHeight
            );


            bg.setAttribute(
                "class",
                "relation-label-bg"
            );


            bg.setAttribute(
                "stroke",
                relation.color
            );


            /*
             * 関係名文字
             */
            const text =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );


            text.setAttribute(
                "x",
                labelX
            );


            text.setAttribute(
                "y",
                labelY
            );


            text.setAttribute(
                "class",
                "relation-label-text"
            );


            text.setAttribute(
                "fill",
                relation.color
            );


            text.textContent =
                relation.name;


            labelGroup.appendChild(bg);

            labelGroup.appendChild(text);


            /*
             * 関係名ドラッグ
             */
            setupRelationLabelPointer(
                labelGroup,
                relation.id
            );


            /*
             * 関係名右クリック
             */
            labelGroup.addEventListener(
                "contextmenu",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    showRelationMenu(
                        event.clientX,
                        event.clientY,
                        relation.id
                    );

                }
            );


            group.appendChild(line1);

            group.appendChild(line2);

            group.appendChild(point);

            group.appendChild(labelGroup);


            relationLayer.appendChild(group);

        }
    );

}


/* =========================================================
   関係名ドラッグ
========================================================= */

function setupRelationLabelPointer(
    label,
    relationId
) {

    let pointerId = null;

    let startX = 0;

    let startY = 0;

    let originalOffsetX = 0;

    let originalOffsetY = 0;


    label.addEventListener(
        "pointerdown",
        event => {

            /*
             * 左クリック・タッチだけ
             */
            if (
                event.button !== 0
            ) {

                return;

            }


            event.stopPropagation();


            pointerId =
                event.pointerId;


            label.setPointerCapture(
                pointerId
            );


            const relation =
                relationData.find(
                    r =>
                        r.id === relationId
                );


            if (!relation) {

                return;

            }


            startX =
                event.clientX;

            startY =
                event.clientY;


            originalOffsetX =
                relation.offsetX || 0;

            originalOffsetY =
                relation.offsetY || 0;

        }
    );


    label.addEventListener(
        "pointermove",
        event => {

            if (
                pointerId !==
                event.pointerId
            ) {

                return;

            }


            const relation =
                relationData.find(
                    r =>
                        r.id === relationId
                );


            if (!relation) {

                return;

            }


            const dx =
                (
                    event.clientX -
                    startX
                ) / zoom;


            const dy =
                (
                    event.clientY -
                    startY
                ) / zoom;


            relation.offsetX =
                originalOffsetX + dx;


            relation.offsetY =
                originalOffsetY + dy;


            /*
             * ★ここで全部追従
             *
             * ・関係名
             * ・関係点
             * ・関係元→関係点の線
             * ・関係点→関係先の線
             * ・矢印
             */
            updateRelations();

        }
    );


    label.addEventListener(
        "pointerup",
        event => {

            if (
                pointerId !==
                event.pointerId
            ) {

                return;

            }


            try {

                label.releasePointerCapture(
                    pointerId
                );

            } catch(e) {}


            pointerId = null;

        }
    );


    label.addEventListener(
        "pointercancel",
        () => {

            pointerId = null;

        }
    );

}


/* =========================================================
   背景パン
========================================================= */

let panPointerId = null;

let panStartX = 0;

let panStartY = 0;

let panOriginalX = 0;

let panOriginalY = 0;


viewport.addEventListener(
    "pointerdown",
    event => {

        /*
         * キャラ・関係名なら
         * 背景パンしない
         */
        if (
            event.target.closest(".node") ||
            event.target.closest(".relation-label")
        ) {

            return;

        }


        if (
            event.button !== 0
        ) {

            return;

        }


        panPointerId =
            event.pointerId;


        viewport.setPointerCapture(
            panPointerId
        );


        panStartX =
            event.clientX;

        panStartY =
            event.clientY;


        panOriginalX =
            mapX;

        panOriginalY =
            mapY;


        viewport.classList.add(
            "dragging"
        );

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if (
            panPointerId !==
            event.pointerId
        ) {

            return;

        }


        mapX =
            panOriginalX +
            event.clientX -
            panStartX;


        mapY =
            panOriginalY +
            event.clientY -
            panStartY;


        clampMapPosition();

        applyTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    event => {

        if (
            panPointerId !==
            event.pointerId
        ) {

            return;

        }


        try {

            viewport.releasePointerCapture(
                panPointerId
            );

        } catch(e) {}


        panPointerId = null;


        viewport.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   ホイールズーム
========================================================= */

viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        const oldZoom =
            zoom;


        const rect =
            viewport.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const worldX =
            (mouseX - mapX) /
            oldZoom;


        const worldY =
            (mouseY - mapY) /
            oldZoom;


        const factor =
            event.deltaY < 0
                ? 1.15
                : 0.87;


        zoom =
            Math.max(
                MIN_ZOOM,

                Math.min(
                    MAX_ZOOM,
                    zoom * factor
                )
            );


        mapX =
            mouseX -
            worldX * zoom;


        mapY =
            mouseY -
            worldY * zoom;


        clampMapPosition();

        applyTransform();

    },
    {
        passive: false
    }
);


/* =========================================================
   背景右クリック
========================================================= */

viewport.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();


        /*
         * キャラや関係名は
         * それぞれのメニューを使う
         */
        if (
            event.target.closest(".node") ||
            event.target.closest(".relation-label")
        ) {

            return;

        }


        showBackgroundMenu(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   メニュー
========================================================= */

function openMenu(
    x,
    y,
    html
) {

    contextMenu.innerHTML =
        html;


    contextMenu.style.display =
        "block";


    const menuWidth =
        contextMenu.offsetWidth;


    const menuHeight =
        contextMenu.offsetHeight;


    const px =
        Math.min(
            x,
            window.innerWidth -
            menuWidth -
            8
        );


    const py =
        Math.min(
            y,
            window.innerHeight -
            menuHeight -
            8
        );


    contextMenu.style.left =
        Math.max(5,px) + "px";


    contextMenu.style.top =
        Math.max(5,py) + "px";

}


function closeMenu() {

    contextMenu.style.display =
        "none";

}


document.addEventListener(
    "pointerdown",
    event => {

        if (
            !event.target.closest(
                "#contextMenu"
            )
        ) {

            closeMenu();

        }

    }
);


/* =========================================================
   キャラメニュー
========================================================= */

function showNodeMenu(

/* =========================================================
   背景メニュー
========================================================= */

let lastContextMapX = 0;

let lastContextMapY = 0;


function showBackgroundMenu(
    screenX,
    screenY
) {

    lastContextMapX =
        (
            screenX - mapX
        ) / zoom;


    lastContextMapY =
        (
            screenY - mapY
        ) / zoom;


    openMenu(

        screenX,

        screenY,

        `

        <div class="menu-title">
            マップ操作

            class="menu-item"

        </div>

        <div
            class="menu-item"
            onclick="exportMap()">

        </div>

        </div>

}


/* =========================================================
   キャラ追加
========================================================= */

function addCharacterAtContextPosition() {

    closeMenu();


    const name =
        prompt(
            "キャラクター名を入力してください"
        );


    if (
        !name ||
        !name.trim()
    ) {

        return;

    }


    const character = {

        id:
            createId("char"),

        name:
            name.trim(),

        x:
            Math.max(
                NODE_RADIUS,

                Math.min(
                    MAP_WIDTH -
                    NODE_RADIUS,

                    lastContextMapX
                )
            ),

        y:
            Math.max(
                NODE_RADIUS,

                Math.min(
                    MAP_HEIGHT -
                    NODE_RADIUS,

                    lastContextMapY
                )
            ),

        status:
            "OPEN"

    };


    characterData.push(
        character
    );


    renderCharacters();

    updateRelations();

}


/* =========================================================
   キャラ名変更
========================================================= */

function renameCharacter(
    characterId
) {

    closeMenu();


    const character =
        getCharacter(
            characterId
        );


    if (!character) {

        return;

    }


    const newName =
        prompt(
            "新しいキャラクター名",
            character.name
        );


    if (
        newName === null ||
        !newName.trim()
    ) {

        return;

    character.name =
        newName.trim();


    renderCharacters();

    updateRelations();

}


/* =========================================================
   キャラ削除
========================================================= */

function deleteCharacter(
    characterId
) {

    closeMenu();


    const character =
        getCharacter(
            characterId
        );


    if (!character) {

        return;

    }


    if (
        !confirm(
            `「${character.name}」を削除しますか？\n関連する関係も削除されます。`
        )
    ) {

        return;

    }


    characterData =
        characterData.filter(
            character =>
                character.id !==
                characterId
        );


    relationData =
        relationData.filter(
            relation =>
                relation.from !==
                characterId &&
                relation.to !==
                characterId
        );


    renderCharacters();

    updateRelations();

}


/* =========================================================
   関係追加モード
========================================================= */

let relationModeActive =
    false;

let relationStartId =
    null;


function startRelationMode(
    characterId
) {

    closeMenu();


    relationModeActive =
        true;


    relationStartId =
        characterId;


    modeIndicator.style.display =
        "block";

}


function cancelRelationMode() {

    relationModeActive =
        false;


    relationStartId =
        null;


    modeIndicator.style.display =
        "none";

}


/* =========================================================
   関係追加
========================================================= */

function handleRelationTarget(
    targetId
) {

    if (!relationStartId) {

        cancelRelationMode();

        return;

    }


    if (
        targetId === relationStartId
    ) {

        alert(
            "同じキャラクター同士は接続できません。"
        );

        return;

    }


    const from =
        getCharacter(
            relationStartId
        );


    const to =
        getCharacter(
            targetId
        );


    if (!from || !to) {

        cancelRelationMode();

        return;

    }


    const name =
        prompt(

            `${from.name} → ${to.name}\n\n` +
            `${from.name}が${to.name}に何を思っているかを入力してください。`,

            "信頼"

        );


    if (
        name === null ||
        !name.trim()
    ) {

        cancelRelationMode();

        return;

    }


    const color =
        prompt(
            "関係線の色を入力してください。\n例：#00eaff",
            "#00eaff"
        );


    relationData.push({

        id:
            createId("rel"),

        from:
            from.id,

        to:
            to.id,

        name:
            name.trim(),

        color:
            color && color.trim()
                ? color.trim()
                : "#00eaff",

        offsetX:
            0,

        offsetY:
            0

    });


    cancelRelationMode();

    updateRelations();

}


/* =========================================================
   関係メニュー
========================================================= */

function showRelationMenu(
    x,
    y,
    relationId
) {

    const relation =
        relationData.find(
            relation =>

        </div>

}


/* =========================================================
   関係名変更
========================================================= */

function renameRelation(
    relationId
) {

    closeMenu();


    const relation =
        relationData.find(
            relation =>
                relation.id ===
                relationId
        );


    if (!relation) {

        return;

    }


    const from =
        getCharacter(

        );


    const to =
        getCharacter(
            relation.to
        );


    const newName =
        prompt(

            `${from?.name || "?"} → ${to?.name || "?"}\n\n関係名`,

            relation.name

        );


    if (
        newName === null ||
        !newName.trim()
    ) {

        return;

    relation.name =
        newName.trim();

}


/* =========================================================
   関係色変更
========================================================= */

function changeRelationColor(

) {

    const relation =
        relationData.find(
            relation =>
                relation.id ===

        );

/* =========================================================
   関係削除
========================================================= */

function deleteRelation(
    relationId
) {

    if (
        !confirm(
            "この関係を削除しますか？"
        )
    ) {

        return;

    }

            relation =>
                relation.id !==

        );

/* =========================================================
   JSONエクスポート
========================================================= */

function exportMap() {

    closeMenu();


    const data = {

        version:
            3,

        map: {

            width:
                MAP_WIDTH,

            height:
                MAP_HEIGHT

        },

        characters:
            characterData,

        relations:
            relationData

    };


    const blob =
        new Blob(

            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "character_relation_map.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

}


/* =========================================================
   JSONインポート
========================================================= */

function importMap() {

    closeMenu();

    importFile.value = "";

    importFile.click();

}


importFile.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            () => {

                try {

                    const data =
                        JSON.parse(
                            reader.result
                        );


                    if (
                        !Array.isArray(
                            data.characters
                        ) ||
                        !Array.isArray(
                            data.relations
                        )
                    ) {

                        throw new Error(
                            "データ形式が違います"
                        );

                    }


                    characterData =
                        data.characters;


                    relationData =
                        data.relations;


                    /*
                     * 旧形式対応
                     */
                    relationData.forEach(
                        relation => {

                            if (
                                relation.offsetX ===
                                undefined
                            ) {

                                relation.offsetX =
                                    relation.labelOffsetX ||
                                    0;

                            }


                            if (
                                relation.offsetY ===
                                undefined
                            ) {

                                relation.offsetY =
                                    relation.labelOffsetY ||
                                    0;

                            }

                        }
                    );


                    renderCharacters();

                    updateRelations();

                    centerOnCharacters();


                    alert(
                        "マップを読み込みました。"
                    );

                }

                catch(error) {

                    alert(
                        "読み込みに失敗しました。\n" +
                        error.message
                    );

                }

            };


        reader.readAsText(file);

    }
);


/* =========================================================
   キャラ群を中央表示
========================================================= */

function centerOnCharacters() {

    if (
        characterData.length === 0
    ) {

        zoom = 1;

        mapX =
            (
                viewport.clientWidth -
                MAP_WIDTH
            ) / 2;


        mapY =
            (
                viewport.clientHeight -
                MAP_HEIGHT
            ) / 2;


        clampMapPosition();

        applyTransform();

        return;

    }


    let minX =
        Infinity;

    let minY =
        Infinity;

    let maxX =
        -Infinity;

    let maxY =
        -Infinity;


    characterData.forEach(
        character => {

            minX =
                Math.min(
                    minX,
                    character.x
                );


            minY =
                Math.min(
                    minY,
                    character.y
                );


            maxX =
                Math.max(
                    maxX,
                    character.x
                );


            maxY =
                Math.max(
                    maxY,
                    character.y
                );

        }
    );


    const centerX =
        (minX + maxX) / 2;


    const centerY =
        (minY + maxY) / 2;


    const clusterWidth =
        Math.max(
            500,
            maxX -
            minX +
            400
        );


    const clusterHeight =
        Math.max(
            500,
            maxY -
            minY +
            400
        );


    const viewportWidth =
        viewport.clientWidth;


    const viewportHeight =
        viewport.clientHeight;


    zoom =
        Math.min(
            1.4,

            viewportWidth /
            clusterWidth,

            viewportHeight /
            clusterHeight
        );


    zoom =
        Math.max(
            MIN_ZOOM,

            Math.min(
                MAX_ZOOM,
                zoom
            )
        );


    mapX =
        viewportWidth / 2 -
        centerX * zoom;


    mapY =
        viewportHeight / 2 -
        centerY * zoom;


    clampMapPosition();

    applyTransform();

}


/* =========================================================
   初期化
========================================================= */

function init() {

    renderCharacters();

    updateRelations();

    centerOnCharacters();

}


window.addEventListener(
    "resize",
    () => {

        clampMapPosition();

        applyTransform();

    }
);


init();

</script>
