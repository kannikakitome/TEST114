<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no">

<title>Character Relation Map</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #0b0e14;

    color: white;

    font-family:
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

}

body {

    touch-action: none;

    user-select: none;

}


/* =========================================================
   ビューポート
========================================================= */

#viewport {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        radial-gradient(
            circle at center,
            rgba(50,70,100,0.13),
            transparent 55%
        ),

        #0b0e14;

}


/* =========================================================
   マップ
========================================================= */

#map {

    position: absolute;

    left: 0;
    top: 0;

    width: 3000px;
    height: 3000px;

    transform-origin: 0 0;

    background-color: #141821;

    background-image:

        radial-gradient(
            circle,
            rgba(255,255,255,0.12) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    box-shadow:

        inset 0 0 150px rgba(0,0,0,0.8);

    cursor: grab;

}

#map.dragging-map {

    cursor: grabbing;

}


/* =========================================================
   SVG関係レイヤー
========================================================= */

#relations {

    position: absolute;

    left: 0;
    top: 0;

    width: 3000px;
    height: 3000px;

    overflow: visible;

    z-index: 10;

}


/* =========================================================
   関係線
========================================================= */

.relation-line {

    stroke-width: 4;

    stroke-linecap: round;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 5px currentColor
        );

}


/* =========================================================
   関係中央マーカー
========================================================= */

.relation-marker {

    stroke: white;

    stroke-width: 2;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 5px currentColor
        );

}


/* =========================================================
   関係名
========================================================= */

.relation-label {

    cursor: grab;

    pointer-events: all;

}

.relation-label.dragging {

    cursor: grabbing;

}

.relation-label rect {

    fill:
        rgba(10,14,22,0.96);

    stroke-width: 2;

    rx: 6;
    ry: 6;

}

.relation-label text {

    fill: white;

    font-size: 14px;

    font-weight: bold;

    text-anchor: middle;

    dominant-baseline: middle;

    pointer-events: none;

}

.relation.hidden {

    opacity: 0;

    pointer-events: none;

}


/* =========================================================
   キャラクターノード
========================================================= */

.node {

    position: absolute;

    width: 150px;
    height: 150px;

    margin-left: -75px;
    margin-top: -75px;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 20;

    cursor: grab;

    touch-action: none;

    border:
        3px solid #00eaff;

    background:

        radial-gradient(
            circle at 30% 20%,
            rgba(255,255,255,0.38),
            transparent 20%
        ),

        radial-gradient(
            circle at center,
            #304154,
            #121b28 60%,
            #080b10
        );

    box-shadow:

        0 0 12px rgba(0,234,255,0.9),

        0 0 30px rgba(0,234,255,0.3),

        inset 0 0 25px rgba(0,234,255,0.15);

    transition:

        box-shadow 0.15s,

        border-color 0.15s;

}

.node:hover {

    box-shadow:

        0 0 18px rgba(0,234,255,1),

        0 0 45px rgba(0,234,255,0.5),

        inset 0 0 30px rgba(0,234,255,0.25);

}

.node.dragging {

    cursor: grabbing;

    transform: scale(1.05);

    box-shadow:

        0 0 25px rgba(255,255,255,0.9),

        0 0 55px rgba(0,234,255,0.8);

}


/* =========================================================
   キャラクター名
========================================================= */

.node-name {

    max-width: 115px;

    text-align: center;

    font-size: 17px;

    font-weight: bold;

    line-height: 1.3;

    pointer-events: none;

    text-shadow:

        0 0 5px black,

        0 0 10px rgba(0,234,255,0.7);

}


/* =========================================================
   OPEN / CLOSE
========================================================= */

.status {

    margin-top: 8px;

    padding: 3px 10px;

    min-width: 58px;

    border-radius: 20px;

    text-align: center;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

    pointer-events: none;

}

.node.open {

    border-color: #00eaff;

}

.node.open .status {

    color: #061014;

    background: #00eaff;

    box-shadow:
        0 0 10px rgba(0,234,255,0.9);

}

.node.close {

    border-color: #ff416c;

    box-shadow:

        0 0 12px rgba(255,65,108,0.9),

        0 0 30px rgba(255,65,108,0.35),

        inset 0 0 25px rgba(255,65,108,0.15);

}

.node.close .status {

    color: white;

    background: #ff416c;

    box-shadow:
        0 0 10px rgba(255,65,108,0.8);

}


/* =========================================================
   上部UI
========================================================= */

#ui {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 100;

    padding: 12px 16px;

    border:
        1px solid
        rgba(0,234,255,0.35);

    border-radius: 10px;

    background:
        rgba(8,12,20,0.88);

    backdrop-filter: blur(8px);

    pointer-events: none;

}

#ui-title {

    color: #00eaff;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

}

#ui-help {

    margin-top: 5px;

    color: #aab4c5;

    font-size: 11px;

    line-height: 1.6;

}


/* =========================================================
   関係追加モード表示
========================================================= */

#relationMode {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    z-index: 200;

    display: none;

    padding: 10px 20px;

    border:
        1px solid #00eaff;

    border-radius: 30px;

    background:
        rgba(5,15,25,0.94);

    color: #00eaff;

    font-size: 13px;

    box-shadow:

        0 0 20px rgba(0,234,255,0.35);

}

#relationMode button {

    margin-left: 15px;

    padding: 5px 12px;

    border: 1px solid #526174;

    border-radius: 15px;

    background: #18202d;

    color: white;

    cursor: pointer;

}


/* =========================================================
   コンテキストメニュー
========================================================= */

#contextMenu {

    position: fixed;

    min-width: 230px;

    z-index: 1000;

    display: none;

    padding: 6px;

    border:
        1px solid
        rgba(0,234,255,0.45);

    border-radius: 10px;

    background:
        rgba(12,16,25,0.97);

    box-shadow:

        0 10px 40px rgba(0,0,0,0.65),

        0 0 20px rgba(0,234,255,0.12);

    backdrop-filter: blur(12px);

}

.menu-title {

    padding: 9px 12px;

    color: #00eaff;

    font-size: 12px;

    font-weight: bold;

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

}

.menu-section {

    padding: 5px 0;

}

.menu-section-title {

    padding: 5px 12px;

    color: #6f7c91;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;

}

.menu-item {

    padding: 9px 12px;

    border-radius: 6px;

    color: #e9edf5;

    font-size: 13px;

    cursor: pointer;

}

.menu-item:hover {

    background:
        rgba(0,234,255,0.13);

    color: #00eaff;

}

.menu-item.delete:hover {

    background:
        rgba(255,65,108,0.15);

    color: #ff587d;

}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 600px) {

    #ui {

        top: 8px;
        left: 8px;

        padding: 8px 10px;

    }

    #ui-title {

        font-size: 11px;

    }

    #ui-help {

        font-size: 9px;

    }

    .node {

        width: 130px;
        height: 130px;

        margin-left: -65px;
        margin-top: -65px;

    }

    .node-name {

        font-size: 14px;

    }

}

</style>

</head>

<body>

<!-- =======================================================
     マップ
======================================================== -->

<div id="viewport">

```
<div id="map">

    <svg
        id="relations"
        viewBox="0 0 3000 3000"
        preserveAspectRatio="none">
    </svg>

</div>
```

</div>

<!-- =======================================================
     UI
======================================================== -->

<div id="ui">

```
<div id="ui-title">
    CHARACTER RELATION MAP
</div>

<div id="ui-help">

    背景ドラッグ：マップ移動<br>

    ノードドラッグ：キャラクター移動<br>

    関係名ドラッグ：関係名移動<br>

    クリック：OPEN / CLOSE<br>

    ホイール：拡大・縮小<br>

    右クリック：操作メニュー

</div>
```

</div>

<!-- =======================================================
     関係追加モード
======================================================== -->

<div id="relationMode">

```
関係追加モード：
接続先のキャラクターをクリックしてください。

<button onclick="cancelRelationMode()">
    キャンセル
</button>
```

</div>

<!-- =======================================================
     コンテキストメニュー
======================================================== -->

<div id="contextMenu"></div>

<!-- =======================================================
     ファイル入力
======================================================== -->

<input
 type="file"
 id="fileInput"
 accept=".json,application/json"
 style="display:none">

<script>

/* =========================================================
   基本設定
========================================================= */

const MAP_WIDTH = 3000;

const MAP_HEIGHT = 3000;

const NODE_RADIUS = 75;

const MIN_ZOOM = 0.35;

const MAX_ZOOM = 2.5;


/* =========================================================
   初期キャラクター
========================================================= */

let characterData = [

    {
        id: "hero",
        name: "主人公",
        x: 1050,
        y: 1100,
        status: "OPEN"
    },

    {
        id: "rival",
        name: "ライバル",
        x: 1450,
        y: 900,
        status: "OPEN"
    },

    {
        id: "childhood",
        name: "幼馴染",
        x: 700,
        y: 1450,
        status: "OPEN"
    },

    {
        id: "boss",
        name: "組織ボス",
        x: 1750,
        y: 1450,
        status: "OPEN"
    }

];


/* =========================================================
   初期関係
========================================================= */

let relationData = [

    {
        id: "r1",

        from: "hero",

        to: "rival",

        name: "ライバル",

        color: "#ff4d8d",

        labelOffsetX: 0,

        labelOffsetY: 0
    },

    {
        id: "r2",

        from: "hero",

        to: "childhood",

        name: "幼馴染",

        color: "#00eaff",

        labelOffsetX: 0,

        labelOffsetY: 0
    },

    {
        id: "r3",

        from: "rival",

        to: "boss",

        name: "敵対",

        color: "#ff416c",

        labelOffsetX: 0,

        labelOffsetY: 0
    },

    {
        id: "r4",

        from: "hero",

        to: "boss",

        name: "因縁",

        color: "#ffc857",

        labelOffsetX: 0,

        labelOffsetY: 0
    }

];


/* =========================================================
   DOM
========================================================= */

const viewport =
    document.getElementById(
        "viewport"
    );

const map =
    document.getElementById(
        "map"
    );

const svg =
    document.getElementById(
        "relations"
    );

const contextMenu =
    document.getElementById(
        "contextMenu"
    );

const relationMode =
    document.getElementById(
        "relationMode"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );


/* =========================================================
   状態
========================================================= */

const nodes = {};

const relationElements = {};

let mapX = 0;

let mapY = 0;

let zoom = 1;


/*
 * 関係追加モード
 */

let relationModeActive = false;

let relationStartId = null;


/* =========================================================
   ID生成
========================================================= */

function createId(prefix) {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 7)
    );

}


/* =========================================================
   キャラクターノード作成
========================================================= */

function createNode(data) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "node " +
        (
            data.status === "OPEN"
                ? "open"
                : "close"
        );

    element.dataset.id =
        data.id;

    element.style.left =
        data.x + "px";

    element.style.top =
        data.y + "px";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "node-name";

    name.textContent =
        data.name;


    const status =
        document.createElement(
            "div"
        );

    status.className =
        "status";

    status.textContent =
        data.status;


    element.appendChild(name);

    element.appendChild(status);

    map.appendChild(element);


    const info = {

        data: data,

        element: element,

        x: data.x,

        y: data.y,

        dragging: false,

        moved: false,

        startX: 0,

        startY: 0,

        originalX: 0,

        originalY: 0

    };


    nodes[data.id] =
        info;


    setupNodePointerEvents(
        info
    );


    return info;

}


/* =========================================================
   ノード再構築
========================================================= */

function rebuildNodes() {

    Object.values(nodes)
        .forEach(info => {

            info.element.remove();

        });


    Object.keys(nodes)
        .forEach(key => {

            delete nodes[key];

        });


    characterData.forEach(
        createNode
    );

}


/* =========================================================
   ノード操作
========================================================= */

function setupNodePointerEvents(
    info
) {

    const element =
        info.element;


    element.addEventListener(
        "pointerdown",
        event => {

            /*
             * 関係追加モード
             */

            if (
                relationModeActive
            ) {

                event.preventDefault();

                event.stopPropagation();

                handleRelationTarget(
                    info.data.id
                );

                return;
            }


            /*
             * 右クリック
             */

            if (
                event.button === 2
            ) {

                return;

            }


            event.stopPropagation();


            element.setPointerCapture(
                event.pointerId
            );


            info.dragging = true;

            info.moved = false;


            info.startX =
                event.clientX;

            info.startY =
                event.clientY;


            info.originalX =
                info.x;

            info.originalY =
                info.y;


            element.classList.add(
                "dragging"
            );

        }
    );


    element.addEventListener(
        "pointermove",
        event => {

            if (
                !info.dragging
            ) {

                return;

            }


            const dx =
                event.clientX -
                info.startX;

            const dy =
                event.clientY -
                info.startY;


            if (
                Math.abs(dx) > 5 ||
                Math.abs(dy) > 5
            ) {

                info.moved = true;

            }


            if (
                !info.moved
            ) {

                return;

            }


            let newX =
                info.originalX +
                dx / zoom;


            let newY =
                info.originalY +
                dy / zoom;


            newX =
                Math.max(
                    NODE_RADIUS,
                    Math.min(
                        MAP_WIDTH -
                        NODE_RADIUS,
                        newX
                    )
                );


            newY =
                Math.max(
                    NODE_RADIUS,
                    Math.min(
                        MAP_HEIGHT -
                        NODE_RADIUS,
                        newY
                    )
                );


            info.x = newX;

            info.y = newY;

            info.data.x = newX;

            info.data.y = newY;


            element.style.left =
                newX + "px";

            element.style.top =
                newY + "px";


            updateRelations();

        }
    );


    element.addEventListener(
        "pointerup",
        event => {

            if (
                !info.dragging
            ) {

                return;

            }


            info.dragging =
                false;


            element.classList.remove(
                "dragging"
            );


            if (
                !info.moved
            ) {

                toggleNode(
                    info
                );

            }

        }
    );


    element.addEventListener(
        "pointercancel",
        () => {

            info.dragging =
                false;

            element.classList.remove(
                "dragging"
            );

        }
    );


    /*
     * ノード右クリック
     */

    element.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            event.stopPropagation();


            showNodeMenu(
                info,
                event.clientX,
                event.clientY
            );

        }
    );

}


/* =========================================================
   OPEN / CLOSE
========================================================= */

function toggleNode(info) {

    info.data.status =
        info.data.status === "OPEN"
            ? "CLOSE"
            : "OPEN";


    info.element.classList.toggle(
        "open",
        info.data.status === "OPEN"
    );


    info.element.classList.toggle(
        "close",
        info.data.status === "CLOSE"
    );


    info.element.querySelector(
        ".status"
    ).textContent =
        info.data.status;


    updateRelations();

}


/* =========================================================
   関係SVG作成
========================================================= */

function createRelationElement(
    relation
) {

    const group =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    group.classList.add(
        "relation"
    );


    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.classList.add(
        "relation-line"
    );

    line.setAttribute(
        "stroke",
        relation.color
    );


    const marker =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    marker.classList.add(
        "relation-marker"
    );

    marker.setAttribute(
        "r",
        "7"
    );

    marker.setAttribute(
        "fill",
        relation.color
    );


    /*
     * 関係名グループ
     */

    const label =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    label.classList.add(
        "relation-label"
    );


    const rect =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
        );

    rect.setAttribute(
        "stroke",
        relation.color
    );


    const text =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    text.textContent =
        relation.name;


    label.appendChild(rect);

    label.appendChild(text);

    group.appendChild(line);

    group.appendChild(marker);

    group.appendChild(label);

    svg.appendChild(group);


    relationElements[
        relation.id
    ] = {

        group,

        line,

        marker,

        label,

        rect,

        text

    };


    setupRelationLabelEvents(
        relation,
        label
    );

}


/* =========================================================
   関係ラベルのドラッグ・右クリック
========================================================= */

function setupRelationLabelEvents(
    relation,
    label
) {

    let dragging = false;

    let moved = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    label.addEventListener(
        "pointerdown",
        event => {

            /*
             * 右クリックは
             * ドラッグ開始しない
             */

            if (
                event.button === 2
            ) {

                return;

            }


            /*
             * 関係追加モード中なら
             * ラベルを触っても開始しない
             */

            if (
                relationModeActive
            ) {

                return;

            }


            event.stopPropagation();

            event.preventDefault();


            label.setPointerCapture(
                event.pointerId
            );


            dragging = true;

            moved = false;


            startX =
                event.clientX;

            startY =
                event.clientY;


            originalX =
                relation.labelOffsetX || 0;

            originalY =
                relation.labelOffsetY || 0;


            label.classList.add(
                "dragging"
            );

        }
    );


    label.addEventListener(
        "pointermove",
        event => {

            if (
                !dragging
            ) {

                return;

            }


            const dx =
                (
                    event.clientX -
                    startX
                ) / zoom;


            const dy =
                (
                    event.clientY -
                    startY
                ) / zoom;


            if (
                Math.abs(dx) > 4 ||
                Math.abs(dy) > 4
            ) {

                moved = true;

            }


            relation.labelOffsetX =
                originalX + dx;

            relation.labelOffsetY =
                originalY + dy;


            updateRelations();

        }
    );


    label.addEventListener(
        "pointerup",
        event => {

            if (
                !dragging
            ) {

                return;

            }


            dragging = false;

            label.classList.remove(
                "dragging"
            );

        }
    );


    label.addEventListener(
        "pointercancel",
        () => {

            dragging = false;

            label.classList.remove(
                "dragging"
            );

        }
    );


    /*
     * 関係名右クリック
     */

    label.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            event.stopPropagation();


            showRelationMenu(
                relation,
                event.clientX,
                event.clientY
            );

        }
    );

}


/* =========================================================
   関係再構築
========================================================= */

function rebuildRelations() {

    Object.values(
        relationElements
    ).forEach(
        item => {

            item.group.remove();

        }
    );


    Object.keys(
        relationElements
    ).forEach(
        key => {

            delete relationElements[key];

        }
    );


    relationData.forEach(
        createRelationElement
    );


    updateRelations();

}


/* =========================================================
   関係位置更新
========================================================= */

function updateRelations() {

    relationData.forEach(
        relation => {

            const a =
                nodes[
                    relation.from
                ];

            const b =
                nodes[
                    relation.to
                ];

            const e =
                relationElements[
                    relation.id
                ];


            if (
                !a ||
                !b ||
                !e
            ) {

                return;

            }


            /*
             * CLOSEなら非表示
             */

            const hidden =
                a.data.status === "CLOSE" ||
                b.data.status === "CLOSE";


            e.group.classList.toggle(
                "hidden",
                hidden
            );


            /*
             * 線
             */

            const x1 = a.x;

            const y1 = a.y;

            const x2 = b.x;

            const y2 = b.y;


            e.line.setAttribute(
                "x1",
                x1
            );

            e.line.setAttribute(
                "y1",
                y1
            );

            e.line.setAttribute(
                "x2",
                x2
            );

            e.line.setAttribute(
                "y2",
                y2
            );


            /*
             * 線の中央
             */

            const centerX =
                (x1 + x2) / 2;

            const centerY =
                (y1 + y2) / 2;


            e.marker.setAttribute(
                "cx",
                centerX
            );

            e.marker.setAttribute(
                "cy",
                centerY
            );


            /*
             * 関係名の位置
             *
             * 中央 + ユーザーによる移動量
             */

            const labelX =
                centerX +
                (
                    relation.labelOffsetX ||
                    0
                );

            const labelY =
                centerY +
                (
                    relation.labelOffsetY ||
                    0
                );


            e.text.textContent =
                relation.name;


            e.text.setAttribute(
                "x",
                labelX
            );

            e.text.setAttribute(
                "y",
                labelY
            );


            let width;

            try {

                width =
                    e.text.getComputedTextLength();

            } catch {

                width =
                    relation.name.length * 14;

            }


            width += 20;

            const height = 27;


            e.rect.setAttribute(
                "x",
                labelX - width / 2
            );

            e.rect.setAttribute(
                "y",
                labelY - height / 2
            );

            e.rect.setAttribute(
                "width",
                width
            );

            e.rect.setAttribute(
                "height",
                height
            );

        }
    );

}


/* =========================================================
   マップ移動
========================================================= */

let mapDragging = false;

let mapStartX = 0;

let mapStartY = 0;

let mapOriginalX = 0;

let mapOriginalY = 0;


viewport.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                ".node"
            )
        ) {

            return;

        }


        if (
            event.target.closest(
                ".relation-label"
            )
        ) {

            return;

        }


        if (
            event.button === 2
        ) {

            return;

        }


        viewport.setPointerCapture(
            event.pointerId
        );


        mapDragging = true;


        mapStartX =
            event.clientX;

        mapStartY =
            event.clientY;


        mapOriginalX =
            mapX;

        mapOriginalY =
            mapY;


        map.classList.add(
            "dragging-map"
        );

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if (
            !mapDragging
        ) {

            return;

        }


        mapX =
            mapOriginalX +
            event.clientX -
            mapStartX;


        mapY =
            mapOriginalY +
            event.clientY -
            mapStartY;


        clampMapPosition();

        applyTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    () => {

        mapDragging = false;

        map.classList.remove(
            "dragging-map"
        );

    }
);


viewport.addEventListener(
    "pointercancel",
    () => {

        mapDragging = false;

        map.classList.remove(
            "dragging-map"
        );

    }
);


/* =========================================================
   ホイールズーム
========================================================= */

viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        const rect =
            viewport.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        const mapPointX =
            (
                mouseX -
                mapX
            ) / zoom;


        const mapPointY =
            (
                mouseY -
                mapY
            ) / zoom;


        const factor =
            event.deltaY < 0
                ? 1.12
                : 0.89;


        const newZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    zoom * factor
                )
            );


        mapX =
            mouseX -
            mapPointX *
            newZoom;


        mapY =
            mouseY -
            mapPointY *
            newZoom;


        zoom = newZoom;


        clampMapPosition();

        applyTransform();

    },
    {
        passive: false
    }
);


/* =========================================================
   マップ範囲制限
========================================================= */

function clampMapPosition() {

    const width =
        viewport.clientWidth;

    const height =
        viewport.clientHeight;


    const scaledWidth =
        MAP_WIDTH * zoom;

    const scaledHeight =
        MAP_HEIGHT * zoom;


    if (
        scaledWidth >= width
    ) {

        mapX =
            Math.max(
                width -
                scaledWidth,

                Math.min(
                    0,
                    mapX
                )
            );

    } else {

        mapX =
            (
                width -
                scaledWidth
            ) / 2;

    }


    if (
        scaledHeight >= height
    ) {

        mapY =
            Math.max(
                height -
                scaledHeight,

                Math.min(
                    0,
                    mapY
                )
            );

    } else {

        mapY =
            (
                height -
                scaledHeight
            ) / 2;

    }

}


/* =========================================================
   Transform
========================================================= */

function applyTransform() {

    map.style.transform =
        `translate(${mapX}px,${mapY}px) scale(${zoom})`;

}


/* =========================================================
   初期表示位置
========================================================= */

function centerOnCharacters() {

    if (
        characterData.length === 0
    ) {

        return;

    }


    let minX = Infinity;

    let maxX = -Infinity;

    let minY = Infinity;

    let maxY = -Infinity;


    characterData.forEach(
        character => {

            minX =
                Math.min(
                    minX,
                    character.x
                );

            maxX =
                Math.max(
                    maxX,
                    character.x
                );

            minY =
                Math.min(
                    minY,
                    character.y
                );

            maxY =
                Math.max(
                    maxY,
                    character.y
                );

        }
    );


    const centerX =
        (minX + maxX) / 2;

    const centerY =
        (minY + maxY) / 2;


    mapX =
        viewport.clientWidth / 2 -
        centerX * zoom;


    mapY =
        viewport.clientHeight / 2 -
        centerY * zoom;


    clampMapPosition();

    applyTransform();

}

   右クリック：背景

        /*

);

/* =========================================================
   メニュー表示
========================================================= */

function showMenu(
    x,
    y,
    html
) {

    contextMenu.innerHTML =
        html;


    contextMenu.style.display =
        "block";


    /*
     * 一旦表示して高さ取得
     */

    const width =
        contextMenu.offsetWidth;

    const height =
        contextMenu.offsetHeight;


    x =
        Math.min(
            x,
            window.innerWidth -
            width -
            8
        );


    y =
        Math.min(
            y,
            window.innerHeight -
            height -
            8
        );


    x =
        Math.max(
            5,
            x
        );


    y =
        Math.max(
            5,
            y
        );


    contextMenu.style.left =
        x + "px";

    contextMenu.style.top =
        y + "px";

}


/* =========================================================
   メニューを閉じる
========================================================= */

function closeMenu() {

    contextMenu.style.display =
        "none";

}


/* =========================================================
   外側クリック
========================================================= */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            !contextMenu.contains(
                event.target
            )
        ) {

            closeMenu();

        }

    }
);


/* =========================================================
   キャラクター名前変更
========================================================= */

function renameCharacter(id) {

    closeMenu();


    const character =
        characterData.find(
            c => c.id === id
        );


    if (!character) {
        return;
    }


    const name =
        prompt(
            "キャラクター名",
            character.name
        );


    if (
        name === null ||
        name.trim() === ""
    ) {

        return;

    }


    character.name =
        name.trim();


    if (nodes[id]) {

        nodes[id]
            .element
            .querySelector(
                ".node-name"
            )
            .textContent =
                character.name;

    }


    updateRelations();

}


/* =========================================================
   背景クリック位置へキャラクター追加
========================================================= */

function addCharacterAtScreen(
    screenX,
    screenY
) {

    closeMenu();


    const rect =
        viewport.getBoundingClientRect();


    /*
     * 画面座標
     * ↓
     * マップ座標
     */

    const x =
        (
            screenX -
            rect.left -
            mapX
        ) / zoom;


    const y =
        (
            screenY -
            rect.top -
            mapY
        ) / zoom;


    addCharacter(
        x,
        y
    );

}


/* =========================================================
   ノード付近へキャラクター追加
========================================================= */

function addCharacterAtNode(
    id
) {

    closeMenu();


    const info =
        nodes[id];


    if (!info) {
        return;
    }


    addCharacter(
        info.x + 220,
        info.y + 120
    );

}


/* =========================================================
   キャラクター追加本体
========================================================= */

function addCharacter(
    x,
    y
) {

    const name =
        prompt(
            "キャラクター名",
            "新キャラクター"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {

        return;

    }


    x =
        Math.max(
            NODE_RADIUS,
            Math.min(
                MAP_WIDTH -
                NODE_RADIUS,
                x
            )
        );


    y =
        Math.max(
            NODE_RADIUS,
            Math.min(
                MAP_HEIGHT -
                NODE_RADIUS,
                y
            )
        );


    const data = {

        id:
            createId(
                "character"
            ),

        name:
            name.trim(),

        x: x,

        y: y,

        status:
            "OPEN"

    };


    characterData.push(
        data
    );


    createNode(
        data
    );


    updateRelations();

}


/* =========================================================
   キャラクター削除
========================================================= */

function deleteCharacter(id) {

    closeMenu();


    const character =
        characterData.find(
            c => c.id === id
        );


    if (!character) {
        return;
    }


    if (
        !confirm(
            `「${character.name}」を削除しますか？\n\n接続されている関係も削除されます。`
        )
    ) {

        return;

    }


    relationData =
        relationData.filter(
            relation =>
                relation.from !== id &&
                relation.to !== id
        );


    characterData =
        characterData.filter(
            c => c.id !== id
        );


    if (nodes[id]) {

        nodes[id]
            .element
            .remove();

        delete nodes[id];

    }


    rebuildRelations();

}


/* =========================================================
   関係追加モード開始
========================================================= */

function startRelationMode(
    characterId
) {

    closeMenu();


    relationModeActive =
        true;


    relationStartId =
        characterId;


    relationMode.style.display =
        "block";

}


/* =========================================================
   関係追加モード終了
========================================================= */

function cancelRelationMode() {

    relationModeActive =
        false;

    relationStartId =
        null;

    relationMode.style.display =
        "none";

}


/* =========================================================
   関係追加：次のキャラクター
========================================================= */

function handleRelationTarget(
    targetId
) {

    if (
        targetId ===
        relationStartId
    ) {

        alert(
            "同じキャラクター同士には関係を作れません。"
        );

        return;

    }


    const from =
        characterData.find(
            c =>
                c.id ===
                relationStartId
        );


    const to =
        characterData.find(
            c =>
                c.id ===
                targetId
        );


    if (
        !from ||
        !to
    ) {

        cancelRelationMode();

        return;

    }


    const name =
        prompt(
            `${from.name} と ${to.name} の関係名`,
            "友人"
        );


    if (
        name === null ||
        name.trim() === ""
    ) {

        cancelRelationMode();

        return;

    }


    const color =
        prompt(
            "関係線の色",
            "#00eaff"
        );


    if (
        color === null ||
        color.trim() === ""
    ) {

        cancelRelationMode();

        return;

    }


    relationData.push({

        id:
            createId(
                "relation"
            ),

        from:
            from.id,

        to:
            to.id,

        name:
            name.trim(),

        color:
            color.trim(),

        labelOffsetX:
            0,

        labelOffsetY:
            0

    });


    rebuildRelations();

    cancelRelationMode();

}


/* =========================================================
   関係名前変更
========================================================= */

function renameRelation(
    id
) {

    closeMenu();


    const relation =
        relationData.find(
            r => r.id === id
        );


    if (!relation) {
        return;
    }


    const name =
        prompt(
            "関係名",
            relation.name
        );


    if (
        name === null ||
        name.trim() === ""
    ) {

        return;

    }


    relation.name =
        name.trim();


    rebuildRelations();

}


/* =========================================================
   関係削除
========================================================= */

function deleteRelation(
    id
) {

    closeMenu();


    const relation =
        relationData.find(
            r => r.id === id
        );


    if (!relation) {
        return;
    }


    if (
        !confirm(
            `関係「${relation.name}」を削除しますか？`
        )
    ) {

        return;

    }


    relationData =
        relationData.filter(
            r => r.id !== id
        );


    rebuildRelations();

}


/* =========================================================
   JSONファイル出力
========================================================= */

function exportMap() {

    closeMenu();


    const saveData = {

        version: 1,

        map: {

            width:
                MAP_WIDTH,

            height:
                MAP_HEIGHT

        },

        characters:
            characterData,

        relations:
            relationData

    };


    const json =
        JSON.stringify(
            saveData,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "character-relation-map.json";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   JSONファイル入力
========================================================= */

function importMap() {

    closeMenu();

    fileInput.value = "";

    fileInput.click();

}


/* =========================================================
   JSON読み込み
========================================================= */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            event => {

                try {

                    const data =
                        JSON.parse(
                            event.target.result
                        );


                    /*
                     * 簡易チェック
                     */

                    if (
                        !Array.isArray(
                            data.characters
                        ) ||
                        !Array.isArray(
                            data.relations
                        )
                    ) {

                        throw new Error(
                            "データ形式が正しくありません。"
                        );

                    }


                    /*
                     * データを反映
                     */

                    characterData =
                        data.characters.map(
                            character => ({

                                id:
                                    character.id,

                                name:
                                    character.name,

                                x:
                                    Number(
                                        character.x
                                    ),

                                y:
                                    Number(
                                        character.y
                                    ),

                                status:
                                    character.status ===
                                    "CLOSE"
                                        ? "CLOSE"
                                        : "OPEN"

                            })
                        );


                    relationData =
                        data.relations.map(
                            relation => ({

                                id:
                                    relation.id,

                                from:
                                    relation.from,

                                to:
                                    relation.to,

                                name:
                                    relation.name,

                                color:
                                    relation.color ||
                                    "#00eaff",

                                labelOffsetX:
                                    Number(
                                        relation.labelOffsetX ||
                                        0
                                    ),

                                labelOffsetY:
                                    Number(
                                        relation.labelOffsetY ||
                                        0
                                    )

                            })
                        );


                    /*
                     * 存在しないキャラクターを
                     * 参照する関係を除外
                     */

                    const ids =
                        new Set(
                            characterData.map(
                                c => c.id
                            )
                        );


                    relationData =
                        relationData.filter(
                            relation =>
                                ids.has(
                                    relation.from
                                ) &&
                                ids.has(
                                    relation.to
                                )
                        );


                    rebuildNodes();

                    rebuildRelations();


                    /*
                     * 読み込んだデータの
                     * キャラクター中央へ移動
                     */

                    centerOnCharacters();


                    alert(
                        "相関図を読み込みました。"
                    );


                } catch (error) {

                    alert(
                        "ファイルを読み込めませんでした。\n\n" +
                        error.message
                    );

                }

            };


        reader.readAsText(
            file
        );

    }
);


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   初期化
========================================================= */

function initialize() {

    rebuildNodes();

    rebuildRelations();

    zoom = 1;

    centerOnCharacters();

}


initialize();


/* =========================================================
   リサイズ
========================================================= */

window.addEventListener(
    "resize",
    () => {

        clampMapPosition();

        applyTransform();

    }
);

</script>
