<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>キャラクター相関図（ドラッグ移動版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #1e1e24; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
        #canvas-container { width: 100%; height: 100%; position: relative; cursor: grab; overflow: hidden; }
        #canvas-container:active { cursor: grabbing; }
        #workspace { width: 3000px; height: 3000px; position: absolute; top: 0; left: 0; background-image: radial-gradient(#333 1px, transparent 1px); background-size: 20px 20px; }
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* キャラクターノード */
        .character { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: #2a2a35; border: 3px solid #00ffff; box-shadow: 0 0 15px rgba(0,255,255,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: move; user-select: none; z-index: 10; font-size: 14px; font-weight: bold; text-align: center; padding: 5px; }
        .character.close { border-color: #ff4757; box-shadow: 0 0 15px rgba(255,71,87,0.4); background: #3a2226; }
        .character .status-badge { font-size: 9px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 10px; margin-top: 4px; color: #00ffff; }
        .character.close .status-badge { color: #ff4757; }
        
        #info-panel { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; font-size: 12px; z-index: 100; pointer-events: none; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="info-panel">
        <strong>【操作方法】</strong><br>
        ・背景をドラッグ/スライド：画面のスクロール<br>
        ・アイコンを短くタップ：Open/Close（線の表示切替）<br>
        ・アイコンを長押し/ドラッグ：キャラクターの移動
    </div>
    <div id="canvas-container"><div id="workspace"><svg id="svg-layer"></svg><div id="character-container"></div></div></div>
    <script>
        // データ定義
        const characters = [
            { id: 'ch1', name: '主人公', x: 400, y: 300, state: 'open' },
            { id: 'ch2', name: 'ライバル', x: 200, y: 150, state: 'open' },
            { id: 'ch3', name: '幼馴染', x: 600, y: 200, state: 'open' },
            { id: 'ch4', name: '組織ボス', x: 300, y: 550, state: 'open' }
        ];
        const relations = [
            { from: 'ch1', to: 'ch2', type: 'ライバル', color: '#ff9f43' },
            { from: 'ch1', to: 'ch3', type: '友人', color: '#1dd1a1' },
            { from: 'ch1', to: 'ch4', type: '敵対', color: '#ff4757' },
            { from: 'ch2', to: 'ch4', type: '裏取引？', color: '#fece57' }
        ];

        const container = document.getElementById('canvas-container');
        const workspace = document.getElementById('workspace');
        const charContainer = document.getElementById('character-container');
        const svgLayer = document.getElementById('svg-layer');

        // 画面スクロール用の変数
        let isWorkspaceDragging = false;
        let wsStartX, wsStartY;
        let scrollLeft = 100, scrollTop = 100;
        workspace.style.transform = `translate(${-scrollLeft}px, ${-scrollTop}px)`;

        // キャラクター移動用の変数
        let activeNode = null;
        let nodeOffsetX = 0;
        let nodeOffsetY = 0;
        let isNodeMoved = false; // タップとドラッグを判定するフラグ

        // 全体のマウス・タッチイベント管理
        function startDrag(e) {
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const targetNode = e.target.closest('.character');

            if (targetNode) {
                // キャラクターノードのドラッグ開始
                activeNode = characters.find(c => c.id === targetNode.id);
                nodeOffsetX = clientX - activeNode.x;
                nodeOffsetY = clientY - activeNode.y;
                isNodeMoved = false;
                e.stopPropagation();
            } else {
                // 背景のスクロール開始
                isWorkspaceDragging = true;
                const pageX = e.pageX || (e.touches && e.touches[0].pageX);
                const pageY = e.pageY || (e.touches && e.touches[0].pageY);
                wsStartX = pageX + scrollLeft;
                wsStartY = pageY + scrollTop;
            }
        }

        function moveDrag(e) {
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (activeNode) {
                // キャラクターノードを動かす
                isNodeMoved = true;
                activeNode.x = clientX - nodeOffsetX;
                activeNode.y = clientY - nodeOffsetY;

                // ワークスペースからはみ出さない制限（0〜2900px）
                activeNode.x = Math.max(0, Math.min(activeNode.x, 2900));
                activeNode.y = Math.max(0, Math.min(activeNode.y, 2900));

                const el = document.getElementById(activeNode.id);
                el.style.left = `${activeNode.x}px`;
                el.style.top = `${activeNode.y}px`;
                drawLines(); // 線をリアルタイムに書き直す
            } else if (isWorkspaceDragging) {
                // 背景スクロール
                const pageX = e.pageX || (e.touches && e.touches[0].pageX);
                const pageY = e.pageY || (e.touches && e.touches[0].pageY);
                scrollLeft = wsStartX - pageX;
                scrollTop = wsStartY - pageY;
                scrollLeft = Math.max(0, Math.min(scrollLeft, 3000 - window.innerWidth));
                scrollTop = Math.max(0, Math.min(scrollTop, 3000 - window.innerHeight));
                workspace.style.transform = `translate(${-scrollLeft}px, ${-scrollTop}px)`;
            }
        }

        function stopDrag(e) {
            if (activeNode) {
                // 移動させずにその場で指を離した（＝タップした）ならOpen/Closeを切り替える
                if (!isNodeMoved) {
                    toggleNodeState(activeNode);
                }
                activeNode = null;
            }
            isWorkspaceDragging = false;
        }

        function toggleNodeState(node) {
            const div = document.getElementById(node.id);
            if (node.state === 'open') {
                node.state = 'close';
                div.classList.add('close');
                document.getElementById(`badge-${node.id}`).innerText = 'CLOSE';
            } else {
                node.state = 'open';
                div.classList.remove('close');
                document.getElementById(`badge-${node.id}`).innerText = 'OPEN';
            }
            drawLines();
        }

        // イベント設定
        container.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', stopDrag);
        container.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', moveDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);

        // キャラクター初期配置
        function init() {
            characters.forEach(char => {
                const div = document.createElement('div');
                div.className = `character ${char.state}`;
                div.id = char.id;
                div.style.left = `${char.x}px`;
                div.style.top = `${char.y}px`;
                div.innerHTML = `<div>${char.name}</div><div class="status-badge" id="badge-${char.id}">${char.state.toUpperCase()}</div>`;
                charContainer.appendChild(div);
            });
            drawLines();
        }

        // 関係線と「中心の小さな点＆関係名」を描画
        function drawLines() {
            svgLayer.innerHTML = '';
            relations.forEach(rel => {
                const fromChar = characters.find(c => c.id === rel.from);
                const toChar = characters.find(c => c.id === rel.to);

                // どちらかがcloseなら描画しない
                if (fromChar.state === 'close' || toChar.state === 'close') return;

                const x1 = fromChar.x + 50; const y1 = fromChar.y + 50;
                const x2 = toChar.x + 50; const y2 = toChar.y + 50;

                // 1. ノード間を結ぶ直線
                const line = document.createElementNS('http://w3.org', 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('stroke', rel.color); line.setAttribute('stroke-width', '3');
                line.setAttribute('opacity', '0.6');
                svgLayer.appendChild(line);

                // 中間点の計算
                const mx = (x1 + x2) / 2;
                const my = (y1 + y2) / 2;

                // 2. 線の中心につける「小さな点（サークル）」
                const circle = document.createElementNS('http://w3.org', 'circle');
                circle.setAttribute('cx', mx);
                circle.setAttribute('cy', my);
                circle.setAttribute('r', '5'); // 点の半径
                circle.setAttribute('fill', rel.color);
                svgLayer.appendChild(circle);

                // 3. 関係名を表示するテキスト
                const text = document.createElementNS('http://w3.org', 'text');
                text.setAttribute('x', mx);
                text.setAttribute('y', my - 12); // 点の少し上に表示
                text.setAttribute('fill', '#fff');
                text.setAttribute('font-size', '12px');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('text-anchor', 'middle');
                // 文字の視認性を上げるための黒い影
                text.setAttribute('style', 'paint-order: stroke; stroke: #1e1e24; stroke-width: 4px; stroke-linejoin: round;');
                text.textContent = rel.type;
                svgLayer.appendChild(text);
