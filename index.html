<script>

/* =====================================================

const MAP_WIDTH = 6000;

const NODE_RADIUS = 75;

const MIN_ZOOM = 0.25;

const AUTO_SAVE_KEY =

/* =====================================================

  },

  {

  {

  }
];


/* =====================================================
   DOM
===================================================== */

const viewport =
  document.getElementById("viewport");

const map =
  document.getElementById("map");

const relationLayer =
  document.getElementById("relationLayer");

const contextMenu =
  document.getElementById("contextMenu");

const relationMode =
  document.getElementById("relationMode");

const saveStatus =
  document.getElementById("saveStatus");

const dialogOverlay =
  document.getElementById("dialogOverlay");

  document.getElementById("dialogTitle");

  document.getElementById("dialogInput");

  document.getElementById("dialogOK");

  document.getElementById("dialogCancel");


/* =====================================================
   表示状態
===================================================== */

let zoom = 1;

let panX = 0;
let panY = 0;


/* =====================================================
   マップパン
===================================================== */

let isPanning = false;

let panPointerId = null;

let panStartX = 0;
let panStartY = 0;

let panStartPanX = 0;
let panStartPanY = 0;


/* =====================================================
   キャラドラッグ
===================================================== */

let draggingCharacter = null;

let dragPointerId = null;

let dragStartWorldX = 0;
let dragStartWorldY = 0;

let dragStartCharacterX = 0;
let dragStartCharacterY = 0;

/*
  ★重要

  ドラッグしたかどうかを
  OPEN/CLOSE切替とは別に管理する。
*/

let characterWasDragged = false;


/* =====================================================
   長押し
===================================================== */

let longPressTimer = null;

let longPressTarget = null;

let longPressStartX = 0;
let longPressStartY = 0;

let longPressTriggered = false;


/* =====================================================
   タッチ
===================================================== */

let touchPointers = new Map();

let pinchStartDistance = 0;

let pinchStartZoom = 1;

let pinchCenterX = 0;
let pinchCenterY = 0;

let pinchWorldX = 0;
let pinchWorldY = 0;


/* =====================================================
   関係追加
===================================================== */

let relationModeSourceId = null;


/* =====================================================
   ダイアログ
===================================================== */

let dialogResolver = null;


/* =====================================================
   関係名ドラッグ
===================================================== */

let draggingRelation = null;

let relationDragPointerId = null;

let relationWasDragged = false;


/* =====================================================
   共通
===================================================== */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function generateId(prefix) {

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2, 8)
  );
}


function getCharacter(id) {

  return characters.find(
    character =>
      character.id === id
  );
}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =====================================================
   座標変換
===================================================== */

function screenToWorld(
  screenX,
  screenY
) {

  const rect =
    viewport.getBoundingClientRect();

  return {

    x:
      (
        screenX -
        rect.left -
        panX
      ) / zoom,

    y:
      (
        screenY -
        rect.top -
        panY
      ) / zoom
  };
}


/* =====================================================
   Transform
===================================================== */

function applyTransform() {

  map.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
}


/* =====================================================
   パン範囲
===================================================== */

function constrainPan() {

  const rect =
    viewport.getBoundingClientRect();

  const scaledWidth =
    MAP_WIDTH * zoom;

  const scaledHeight =
    MAP_HEIGHT * zoom;

  const minX =
    Math.min(
      0,
      rect.width - scaledWidth
    );

  const minY =
    Math.min(
      0,
      rect.height - scaledHeight
    );

  panX =
    clamp(
      panX,
      minX,
      Math.max(
        0,
        rect.width - scaledWidth
      )
    );

  panY =
    clamp(
      panY,
      minY,
      Math.max(
        0,
        rect.height - scaledHeight
      )
    );
}


/* =====================================================
   ノード更新
===================================================== */

function updateNodes() {

  document
    .querySelectorAll(
      ".character-node"
    )
    .forEach(
      node =>
        node.remove()
    );


  for (
    const character
    of characters
  ) {

    const node =
      document.createElement("div");

    node.className =
      "character-node " +
      (
        character.status === "OPEN"
          ? "open"
          : "close"
      );

    node.dataset.id =
      character.id;

    node.style.left =
      character.x + "px";

    node.style.top =
      character.y + "px";


    node.innerHTML = `

      <div class="character-name">
        ${escapeHtml(character.name)}
      </div>

      <div class="character-status">
        ${character.status}
      </div>

    `;


    node.addEventListener(
      "pointerdown",
      handleCharacterPointerDown
    );


    node.addEventListener(
      "contextmenu",
      event => {

        event.preventDefault();
        event.stopPropagation();

        showCharacterContextMenu(
          event.clientX,
          event.clientY,
          character
        );
      }
    );


    map.appendChild(node);
  }
}


/* =====================================================
   関係更新
===================================================== */

function updateRelations() {

  relationLayer
    .querySelectorAll(
      ".relation-group"
    )
    .forEach(
      element =>
        element.remove()
    );


  const pairMap =
    new Map();


  for (
    const relation
    of relationData
  ) {

    const key =
      [relation.from, relation.to]
        .sort()
        .join("|");

    if (
      !pairMap.has(key)
    ) {

      pairMap.set(
        key,
        []
      );
    }

    pairMap
      .get(key)
      .push(relation);
  }


  for (
    const relation
    of relationData
  ) {

    const from =
      getCharacter(
        relation.from
      );

    const to =
      getCharacter(
        relation.to
      );

    if (
      !from ||
      !to
    ) {
      continue;
    }


    /*
      CLOSEキャラから出る関係は非表示。
      CLOSEキャラへ向かう関係は表示。
    */

    if (
      from.status === "CLOSE"
    ) {
      continue;
    }


    const pairKey =
      [relation.from, relation.to]
        .sort()
        .join("|");

    const pair =
      pairMap.get(pairKey) || [];


    let perpendicularOffset = 0;


    if (
      pair.length >= 2
    ) {

      const reverse =
        pair.find(
          item =>
            item.from === relation.to &&
            item.to === relation.from
        );

      if (reverse) {

        perpendicularOffset =
          relation.from === pair[0].from
            ? -28
            : 28;
      }
    }


    drawRelation(
      relation,
      from,
      to,
      perpendicularOffset
    );
  }
}


/* =====================================================
   関係描画
===================================================== */

function drawRelation(
  relation,
  from,
  to,
  perpendicularOffset
) {

  let dx =
    to.x - from.x;

  let dy =
    to.y - from.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (
    distance < 1
  ) {
    return;
  }


  dx /= distance;
  dy /= distance;


  const px = -dy;
  const py = dx;


  const startX =
    from.x +
    dx * NODE_RADIUS +
    px * perpendicularOffset;

  const startY =
    from.y +
    dy * NODE_RADIUS +
    py * perpendicularOffset;


  const endX =
    to.x -
    dx * NODE_RADIUS +
    px * perpendicularOffset;

  const endY =
    to.y -
    dy * NODE_RADIUS +
    py * perpendicularOffset;


  const centerX =
    (startX + endX) / 2;

  const centerY =
    (startY + endY) / 2;


  const offsetX =
    Number.isFinite(
      relation.offsetX
    )
      ? relation.offsetX
      : 0;

  const offsetY =
    Number.isFinite(
      relation.offsetY
    )
      ? relation.offsetY
      : 0;


  const labelX =
    centerX + offsetX;

  const labelY =
    centerY + offsetY;


  const group =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "g"
    );

  group.classList.add(
    "relation-group"
  );

  group.dataset.id =
    relation.id;


  /*
    線1
  */

  const line1 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  line1.classList.add(
    "relation-line"
  );


  /*
    線2
  */

  const line2 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  line2.classList.add(
    "relation-line"
  );


  line1.setAttribute(
    "x1",
    startX
  );

  line1.setAttribute(
    "y1",
    startY
  );

  line1.setAttribute(
    "x2",
    labelX
  );

  line1.setAttribute(
    "y2",
    labelY
  );


  line2.setAttribute(
    "x1",
    labelX
  );

  line2.setAttribute(
    "y1",
    labelY
  );

  line2.setAttribute(
    "x2",
    endX
  );

  line2.setAttribute(
    "y2",
    endY
  );


  line2.setAttribute(
    "marker-end",
    "url(#arrow)"
  );


  const relationColor =
    relation.color ||
    "#00eaff";


  line1.style.stroke =
    relationColor;

  line2.style.stroke =
    relationColor;


  /*
    中央マーカー
  */

  const circle =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  circle.setAttribute(
    "cx",
    labelX
  );

  circle.setAttribute(
    "cy",
    labelY
  );

  circle.setAttribute(
    "r",
    7
  );

  circle.setAttribute(
    "fill",
    relationColor
  );


  /*
    関係名
  */

  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  text.classList.add(
    "relation-label-text"
  );

  text.setAttribute(
    "x",
    labelX
  );

  text.setAttribute(
    "y",
    labelY
  );

  text.textContent =
    relation.name;


  /*
    ラベル幅
  */

  const estimatedWidth =
    Math.max(
      90,
      relation.name.length * 25 + 34
    );


  const rect =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

  rect.classList.add(
    "relation-label-bg"
  );


  rect.setAttribute(
    "x",
    labelX -
    estimatedWidth / 2
  );

  rect.setAttribute(
    "y",
    labelY - 21
  );

  rect.setAttribute(
    "width",
    estimatedWidth
  );

  rect.setAttribute(
    "height",
    42
  );

  rect.setAttribute(
    "stroke",
    relationColor
  );


  /*
    関係名のドラッグ
  */

  rect.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();
      event.stopPropagation();

      startRelationLabelDrag(
        event,
        relation
      );
    }
  );


  /*
    関係名の右クリックメニュー
  */

  rect.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();

      showRelationContextMenu(
        event.clientX,
        event.clientY,
        relation
      );
    }
  );


  /*
    関係名のダブルクリックでも
    名前変更
  */

  rect.addEventListener(
    "dblclick",
    event => {

      event.preventDefault();
      event.stopPropagation();

      renameRelation(
        relation
      );
    }
  );


  group.appendChild(line1);
  group.appendChild(line2);
  group.appendChild(circle);
  group.appendChild(rect);
  group.appendChild(text);


  relationLayer.appendChild(
    group
  );
}


/* =====================================================
   関係名ドラッグ
===================================================== */

function startRelationLabelDrag(
  event,
  relation
) {

  draggingRelation =
    relation;

  relationDragPointerId =
    event.pointerId;

  relationWasDragged =
    false;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  relation.__dragStartX =
    world.x;

  relation.__dragStartY =
    world.y;


  relation.__originalOffsetX =
    relation.offsetX || 0;

  relation.__originalOffsetY =
    relation.offsetY || 0;


  document.addEventListener(
    "pointermove",
    handleRelationLabelMove
  );

  document.addEventListener(
    "pointerup",
    handleRelationLabelUp
  );

  document.addEventListener(
    "pointercancel",
    handleRelationLabelUp
  );
}


function handleRelationLabelMove(
  event
) {

  if (
    !draggingRelation ||
    event.pointerId !==
      relationDragPointerId
  ) {
    return;
  }


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    draggingRelation.__dragStartX;

  const dy =
    world.y -
    draggingRelation.__dragStartY;


  if (
    Math.sqrt(
      dx * dx +
      dy * dy
    ) > 8
  ) {

    relationWasDragged =
      true;
  }


  draggingRelation.offsetX =
    draggingRelation.__originalOffsetX +
    dx;

  draggingRelation.offsetY =
    draggingRelation.__originalOffsetY +
    dy;


  updateRelations();
}


function handleRelationLabelUp(
  event
) {

  if (
    event.pointerId !==
      relationDragPointerId
  ) {
    return;
  }


  if (
    draggingRelation
  ) {

    delete
      draggingRelation.__dragStartX;

    delete
      draggingRelation.__dragStartY;

    delete
      draggingRelation.__originalOffsetX;

    delete
      draggingRelation.__originalOffsetY;
  }


  draggingRelation = null;

  relationDragPointerId = null;


  document.removeEventListener(
    "pointermove",
    handleRelationLabelMove
  );

  document.removeEventListener(
    "pointerup",
    handleRelationLabelUp
  );

  document.removeEventListener(
    "pointercancel",
    handleRelationLabelUp
  );


  scheduleAutoSave();
}


/* =====================================================
   キャラ PointerDown
===================================================== */

function handleCharacterPointerDown(
  event
) {

  if (
    event.pointerType === "touch"
  ) {

    registerTouchPointer(event);
  }


  /*
    関係追加モード
  */

  if (
    relationModeSourceId
  ) {

    if (
      event.pointerType === "mouse" &&
      event.button === 2
    ) {
      return;
    }


    const target =
      getCharacter(
        event.currentTarget.dataset.id
      );


    if (
      target
    ) {

      event.preventDefault();
      event.stopPropagation();

      addRelation(
        relationModeSourceId,
        target.id
      );

      return;
    }
  }


  /*
    PC右クリック
  */

  if (
    event.pointerType === "mouse" &&
    event.button !== 0
  ) {

    return;
  }


  /*
    スマホ2本指
  */

  if (
    event.pointerType === "touch" &&
    touchPointers.size >= 2
  ) {

    return;
  }


  draggingCharacter =
    getCharacter(
      event.currentTarget.dataset.id
    );


  if (
    !draggingCharacter
  ) {
    return;
  }


  dragPointerId =
    event.pointerId;


  characterWasDragged =
    false;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  dragStartWorldX =
    world.x;

  dragStartWorldY =
    world.y;


  dragStartCharacterX =
    draggingCharacter.x;

  dragStartCharacterY =
    draggingCharacter.y;


  /*
    スマホ長押し
  */

  if (
    event.pointerType === "touch"
  ) {

    startLongPress(
      event,
      event.currentTarget
    );
  }


  document.addEventListener(
    "pointermove",
    handleCharacterDrag
  );

  document.addEventListener(
    "pointerup",
    handleCharacterDragEnd
  );

  document.addEventListener(
    "pointercancel",
    handleCharacterDragEnd
  );


  event.preventDefault();
  event.stopPropagation();
}


/* =====================================================
   キャラドラッグ
===================================================== */

function handleCharacterDrag(
  event
) {

  if (
    !draggingCharacter ||
    event.pointerId !==
      dragPointerId
  ) {

    return;
  }


  if (
    event.pointerType === "touch" &&
    touchPointers.size >= 2
  ) {

    cancelLongPress();

    return;
  }


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    dragStartWorldX;

  const dy =
    world.y -
    dragStartWorldY;


  /*
    ★一定距離動いたら
    「これはクリックではなくドラッグ」
    と確定する。
  */

  if (
    Math.sqrt(
      dx * dx +
      dy * dy
    ) > 12
  ) {

    characterWasDragged =
      true;

    cancelLongPress();
  }


  draggingCharacter.x =
    clamp(
      dragStartCharacterX + dx,
      NODE_RADIUS + 20,
      MAP_WIDTH -
        NODE_RADIUS -
        20
    );


  draggingCharacter.y =
    clamp(
      dragStartCharacterY + dy,
      NODE_RADIUS + 20,
      MAP_HEIGHT -
        NODE_RADIUS -
        20
    );


  updateNodes();

  updateRelations();
}


/* =====================================================
   キャラドラッグ終了
===================================================== */

function handleCharacterDragEnd(
  event
) {

  if (
    !draggingCharacter ||
    event.pointerId !==
      dragPointerId
  ) {

    return;
  }


  const character =
    draggingCharacter;


  const wasDragged =
    characterWasDragged;


  const wasLongPress =
    longPressTriggered;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    dragStartWorldX;

  const dy =
    world.y -
    dragStartWorldY;


  /*
    ★まずドラッグ状態を解除
  */

  draggingCharacter = null;

  dragPointerId = null;

  characterWasDragged =
    false;


  cancelLongPress();


  document.removeEventListener(
    "pointermove",
    handleCharacterDrag
  );

  document.removeEventListener(
    "pointerup",
    handleCharacterDragEnd
  );

  document.removeEventListener(
    "pointercancel",
    handleCharacterDragEnd
  );


  /*
    ★ドラッグした場合は
    絶対にOPEN/CLOSEを切り替えない
  */

  if (
    wasDragged
  ) {

    scheduleAutoSave();

    return;
  }


  /*
    ★長押しした場合も
    OPEN/CLOSEを切り替えない
  */

  if (
    wasLongPress
  ) {

    longPressTriggered =
      false;

    return;
  }


  /*
    PC左クリック
  */

  if (
    event.pointerType === "mouse" &&
    event.button === 0
  ) {

    toggleCharacterStatus(
      character.id
    );

    return;
  }


  /*
    スマホ短タップ
  */

  if (
    event.pointerType === "touch"
  ) {

    if (
      Math.sqrt(
        dx * dx +
        dy * dy
      ) < 15
    ) {

      toggleCharacterStatus(
        character.id
      );
    }
  }
}


/* =====================================================
   OPEN / CLOSE
===================================================== */

function toggleCharacterStatus(
  id
) {

  const character =
    getCharacter(id);

  if (
    !character
  ) {
    return;
  }


  character.status =
    character.status === "OPEN"
      ? "CLOSE"
      : "OPEN";


  updateNodes();

  updateRelations();

  scheduleAutoSave();
}


/* =====================================================
   長押し
===================================================== */

function startLongPress(
  event,
  node
) {

  cancelLongPress();


  longPressStartX =
    event.clientX;

  longPressStartY =
    event.clientY;

  longPressTarget =
    node;

  longPressTriggered =
    false;


  longPressTimer =
    setTimeout(
      () => {

        if (
          !longPressTarget
        ) {
          return;
        }


        /*
          ドラッグ中なら
          長押しにはしない
        */

        if (
          characterWasDragged
        ) {
          return;
        }


        longPressTriggered =
          true;


        const character =
          getCharacter(
            longPressTarget.dataset.id
          );


        if (
          character
        ) {

          draggingCharacter =
            null;

          dragPointerId =
            null;


          showCharacterContextMenu(
            longPressStartX,
            longPressStartY,
            character
          );
        }

      },
      600
    );
}


function cancelLongPress() {

  if (
    longPressTimer
  ) {

    clearTimeout(
      longPressTimer
    );

    longPressTimer = null;
  }

  longPressTarget = null;
}


/* =====================================================
   Touch登録
===================================================== */

function registerTouchPointer(
  event
) {

  touchPointers.set(
    event.pointerId,
    {
      x: event.clientX,
      y: event.clientY
    }
  );


  /*
    2本指になった瞬間
  */

  if (
    touchPointers.size === 2
  ) {

    cancelLongPress();

    draggingCharacter = null;

    dragPointerId = null;


    const points =
      [...touchPointers.values()];


    pinchStartDistance =
      getTouchDistance();


    pinchStartZoom =
      zoom;


    pinchCenterX =
      (
        points[0].x +
        points[1].x
      ) / 2;


    pinchCenterY =
      (
        points[0].y +
        points[1].y
      ) / 2;


    const world =
      screenToWorld(
        pinchCenterX,
        pinchCenterY
      );


    pinchWorldX =
      world.x;

    pinchWorldY =
      world.y;
  }
}


function getTouchDistance() {

  const points =
    [...touchPointers.values()];


  if (
    points.length < 2
  ) {

    return 0;
  }


  const dx =
    points[1].x -
    points[0].x;

  const dy =
    points[1].y -
    points[0].y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =====================================================
   VIEWPORT POINTER DOWN
===================================================== */

viewport.addEventListener(
  "pointerdown",
  event => {

    /*
      タッチ
    */

    if (
      event.pointerType === "touch"
    ) {

      registerTouchPointer(event);


      /*
        2本指
      */

      if (
        touchPointers.size >= 2
      ) {

        return;
      }


      /*
        キャラ上なら
        キャラ側で処理
      */

      if (
        event.target.closest(
          ".character-node"
        )
      ) {

        return;
      }


      /*
        関係名上なら
        関係名側で処理
      */

      if (
        event.target.closest(
          ".relation-label-bg"
        )
      ) {

        return;
      }


      /*
        背景長押し開始
      */

      startLongPress(
        event,
        null
      );


      /*
        背景パン開始
      */

      isPanning = true;

      panPointerId =
        event.pointerId;

      panStartX =
        event.clientX;

      panStartY =
        event.clientY;

      panStartPanX =
        panX;

      panStartPanY =
        panY;

      return;
    }


    /*
      PC
    */

    if (
      event.pointerType === "mouse"
    ) {

      if (
        event.button !== 0
      ) {

        return;
      }


      if (
        event.target.closest(
          ".character-node"
        )
      ) {

        return;
      }


      if (
        event.target.closest(
          ".relation-label-bg"
        )
      ) {

        return;
      }


      isPanning = true;

      panPointerId =
        event.pointerId;

      panStartX =
        event.clientX;

      panStartY =
        event.clientY;

      panStartPanX =
        panX;

      panStartPanY =
        panY;
    }

  },
  {
    passive: false
  }
);


/* =====================================================
   VIEWPORT POINTER MOVE
===================================================== */

viewport.addEventListener(
  "pointermove",
  event => {

    /*
      タッチ位置更新
    */

    if (
      event.pointerType === "touch" &&
      touchPointers.has(
        event.pointerId
      )
    ) {

      touchPointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );


      /*
        ピンチ
      */

      if (
        touchPointers.size >= 2
      ) {

        event.preventDefault();

        cancelLongPress();

        isPanning = false;


        const distance =
          getTouchDistance();


        if (
          pinchStartDistance > 0 &&
          distance > 0
        ) {

          const newZoom =
            clamp(
              pinchStartZoom *
              (
                distance /
                pinchStartDistance
              ),
              MIN_ZOOM,
              MAX_ZOOM
            );


          panX =
            pinchCenterX -
            pinchWorldX *
            newZoom;


          panY =
            pinchCenterY -
            pinchWorldY *
            newZoom;


          zoom =
            newZoom;


          constrainPan();

          applyTransform();
        }


        return;
      }


      /*
        1本指
      */

      const dx =
        event.clientX -
        longPressStartX;

      const dy =
        event.clientY -
        longPressStartY;


      if (
        Math.sqrt(
          dx * dx +
          dy * dy
        ) > 12
      ) {

        cancelLongPress();
      }


      /*
        背景パン
      */

      if (
        isPanning &&
        event.pointerId ===
          panPointerId
      ) {

        const moveX =
          event.clientX -
          panStartX;

        const moveY =
          event.clientY -
          panStartY;


        panX =
          panStartPanX +
          moveX;

        panY =
          panStartPanY +
          moveY;


        constrainPan();

        applyTransform();
      }


      return;
    }


    /*
      PCパン
    */

    if (
      event.pointerType === "mouse" &&
      isPanning &&
      event.pointerId ===
        panPointerId
    ) {

      const moveX =
        event.clientX -
        panStartX;

      const moveY =
        event.clientY -
        panStartY;


      panX =
        panStartPanX +
        moveX;

      panY =
        panStartPanY +
        moveY;


      constrainPan();

      applyTransform();
    }

  },
  {
    passive: false
  }
);


/* =====================================================
   Pointer UP
===================================================== */

document.addEventListener(
  "pointerup",
  event => {

    if (
      event.pointerType === "touch"
    ) {

      touchPointers.delete(
        event.pointerId
      );


      if (
        touchPointers.size < 2
      ) {

        pinchStartDistance = 0;
      }
    }


    if (
      event.pointerId ===
      panPointerId
    ) {

      isPanning = false;

      panPointerId = null;
    }

  }
);


/* =====================================================
   PC右クリック
===================================================== */

viewport.addEventListener(
  "contextmenu",
  event => {

    event.preventDefault();


    const characterNode =
      event.target.closest(
        ".character-node"
      );


    if (
      characterNode
    ) {

      const character =
        getCharacter(
          characterNode.dataset.id
        );


      if (
        character
      ) {

        showCharacterContextMenu(
          event.clientX,
          event.clientY,
          character
        );
      }

      return;
    }


    const relationLabel =
      event.target.closest(
        ".relation-label-bg"
      );


    if (
      relationLabel
    ) {

      const group =
        relationLabel.closest(
          ".relation-group"
        );


      if (
        group
      ) {

        const relation =
          relationData.find(
            item =>
              item.id ===
              group.dataset.id
          );


        if (
          relation
        ) {

          showRelationContextMenu(
            event.clientX,
            event.clientY,
            relation
          );
        }
      }

      return;
    }


    const world =
      screenToWorld(
        event.clientX,
        event.clientY
      );


    showBackgroundContextMenu(
      event.clientX,
      event.clientY,
      world.x,
      world.y
    );
  }
);


/* =====================================================
   ホイールズーム
===================================================== */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const oldZoom =
      zoom;


    const factor =
      event.deltaY < 0
        ? 1.12
        : 0.89;


    const newZoom =
      clamp(
        oldZoom * factor,
        MIN_ZOOM,
        MAX_ZOOM
      );


    const world =
      screenToWorld(
        event.clientX,
        event.clientY
      );


    zoom =
      newZoom;


    panX =
      event.clientX -
      world.x * zoom;


    panY =
      event.clientY -
      world.y * zoom;


    constrainPan();

    applyTransform();

  },
  {
    passive: false
  }
);

   キャラメニュー
===================================================== */

function showCharacterContextMenu(
  screenX,
  screenY,
  character
) {

  cancelRelationMode();

  hideContextMenu();


  const renameButton =
    createContextButton(
      "名前を変更",
      () => {

        hideContextMenu();

        showTextDialog(
          "キャラクター名を変更",
          character.name
        ).then(
          value => {

            if (
              value === null
            ) {
              return;
            }


            const name =
              value.trim();


            if (
              !name
            ) {
              return;
            }


            character.name =
              name;


            updateNodes();

            updateRelations();

            scheduleAutoSave();
          }
        );
      }
    );


  const relationButton =
    createContextButton(
      "＋ 関係追加",
      () => {

        hideContextMenu();

        startRelationMode(
          character.id
        );
      }
    );


  const deleteButton =
    createContextButton(
      "キャラ削除",
      () => {

        hideContextMenu();

        deleteCharacter(
          character.id
        );
      }
    );


  contextMenu.appendChild(
    renameButton
  );

  contextMenu.appendChild(
    relationButton
  );

  contextMenu.appendChild(
    deleteButton
  );


  showContextMenuAt(
    screenX,
    screenY
  );
}

/* =====================================================
   関係名変更
===================================================== */

function renameRelation(
  relation
) {

  showTextDialog(
    "関係名を変更",
    relation.name
  ).then(
    value => {

      if (
        value === null
      ) {
        return;
      }


      const name =
        value.trim();


      if (
        !name
      ) {
        return;
      }


      relation.name =
        name;


      updateRelations();

      scheduleAutoSave();
    }
  );
}


/* =====================================================
   関係削除
===================================================== */

function deleteRelation(
  relation
) {

  const from =
    getCharacter(
      relation.from
    );

  const to =
    getCharacter(
      relation.to
    );


  const fromName =
    from
      ? from.name
      : "";

  const toName =
    to
      ? to.name
      : "";


  const ok =
    confirm(
      `${fromName} → ${toName}\n「${relation.name}」を削除しますか？`
    );


  if (
    !ok
  ) {
    return;
  }


  relationData =
    relationData.filter(
      item =>
        item.id !==
        relation.id
    );


  updateRelations();

  scheduleAutoSave();
}

/* =====================================================
   メニュー共通
===================================================== */

function createContextButton(
  label,
  callback
) {

    return;

  const source =
    getCharacter(

    getCharacter(

  if (

  ) {

    cancelRelationMode();

    return;
  }


  const name =
    await showTextDialog(
      `${source.name} → ${target.name}`,
      "このキャラをどう思っている？"
    );


  cancelRelationMode();


  if (
    name === null ||

  ) {

    return;

  relationData.push({

    id:
      generateId(
        "relation"
      ),

    from:
      sourceId,

    to:
      targetId,

    name:
      name.trim(),

    color:

  });

}

/* =====================================================
   ★ 整列
===================================================== */

function arrangeCharacters() {

  const count =
    characters.length;


  if (
    count === 0
  ) {
    return;
  }


  const centerX =
    MAP_WIDTH / 2;

  const centerY =
    MAP_HEIGHT / 2;


  /*
    接続数を計算
  */

  const connectionCount =
    new Map();


  for (
    const character
    of characters
  ) {

    connectionCount.set(
      character.id,
      0
    );
  }


  for (
    const relation
    of relationData
  ) {

    if (
      connectionCount.has(
        relation.from
      )
    ) {

      connectionCount.set(
        relation.from,
        connectionCount.get(
          relation.from
        ) + 1
      );
    }


    if (
      connectionCount.has(
        relation.to
      )
    ) {

      connectionCount.set(
        relation.to,
        connectionCount.get(
          relation.to
        ) + 1
      );
    }
  }


  /*
    接続数が多い順
  */

  const sorted =
    [...characters].sort(
      (a, b) =>
        connectionCount.get(b.id) -
        connectionCount.get(a.id)
    );


  /*
    ★整列の基本配置

    1人 → 中央

    2～7人 →
    中央＋円形

    8人以上 →
    2重リング
  */

  if (
    sorted.length === 1
  ) {

    sorted[0].x =
      centerX;

    sorted[0].y =
      centerY;

  } else {

    /*
      中心キャラ
    */

    sorted[0].x =
      centerX;

    sorted[0].y =
      centerY;


    const rest =
      sorted.slice(1);


    /*
      5ノード程度なら
      半径500前後。

      画面内に関係名まで
      まとめて入りやすい。
    */

    const radius =
      rest.length <= 4
        ? 500
        : rest.length <= 7
          ? 600
          : 720;


    rest.forEach(
      (character, index) => {

        const angle =
          (
            index /
            rest.length
          ) *
          Math.PI *
          2 -
          Math.PI / 2;


        character.x =
          centerX +
          Math.cos(angle) *
          radius;


        character.y =
          centerY +
          Math.sin(angle) *
          radius;
      }
    );
  }


  /*
    ★重なり防止

    ただし「離れすぎない」
    ことを優先する。
  */

  for (
    let iteration = 0;
    iteration < 30;
    iteration++
  ) {

    for (
      let i = 0;
      i < characters.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < characters.length;
        j++
      ) {

        const a =
          characters[i];

        const b =
          characters[j];


        let dx =
          b.x - a.x;

        let dy =
          b.y - a.y;


        let distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (
          distance < 1
        ) {

          distance = 1;

          dx = 1;
          dy = 0;
        }


        const minimumDistance =
          210;


        if (
          distance <
          minimumDistance
        ) {

          const push =
            (
              minimumDistance -
              distance
            ) * .035;


          const ux =
            dx / distance;

          const uy =
            dy / distance;


          a.x -=
            ux * push;

          a.y -=
            uy * push;


          b.x +=
            ux * push;

          b.y +=
            uy * push;
        }
      }
    }
  }


  /*
    マップ範囲内へ
  */

  for (
    const character
    of characters
  ) {

    character.x =
      clamp(
        character.x,
        NODE_RADIUS + 50,
        MAP_WIDTH -
          NODE_RADIUS -
          50
      );


    character.y =
      clamp(
        character.y,
        NODE_RADIUS + 50,
        MAP_HEIGHT -
          NODE_RADIUS -
          50
      );
  }


  updateNodes();

  updateRelations();


  /*
    ★整列後に必ず
    キャラクター全体を表示
  */

  centerOnCharacters();


  scheduleAutoSave();
}

/* =====================================================
   中央表示
===================================================== */

function centerOnCharacters() {

  if (
    characters.length === 0
  ) {

    zoom = 1;

    panX =
      (
        viewport.clientWidth -
        MAP_WIDTH
      ) / 2;

    panY =
      (
        viewport.clientHeight -
        MAP_HEIGHT
      ) / 2;


    applyTransform();

    return;
  }


  let minX =
    Infinity;

  let maxX =
    -Infinity;

  let minY =
    Infinity;

  let maxY =
    -Infinity;


  for (
    const character
    of characters
  ) {

    minX =
      Math.min(
        minX,
        character.x -
        NODE_RADIUS
      );


    maxX =
      Math.max(
        maxX,
        character.x +
        NODE_RADIUS
      );


    minY =
      Math.min(
        minY,
        character.y -
        NODE_RADIUS
      );


    maxY =
      Math.max(
        maxY,
        character.y +
        NODE_RADIUS
      );
  }


  /*
    関係名が線の外へ出ても
    見えるよう余白を確保
  */

  const padding =
    260;


  const worldWidth =
    Math.max(
      800,
      maxX -
      minX +
      padding * 2
    );


  const worldHeight =
    Math.max(
      800,
      maxY -
      minY +
      padding * 2
    );


  /*
    画面の約75%に収める
  */

  const targetZoom =
    Math.min(
      viewport.clientWidth /
        worldWidth *
        .78,

      viewport.clientHeight /
        worldHeight *
        .78
    );


  zoom =
    clamp(
      targetZoom,
      0.65,
      1.25
    );


  const centerWorldX =
    (
      minX +
      maxX
    ) / 2;


  const centerWorldY =
    (
      minY +
      maxY
    ) / 2;


  panX =
    viewport.clientWidth / 2 -
    centerWorldX * zoom;


  panY =
    viewport.clientHeight / 2 -
    centerWorldY * zoom;


  constrainPan();

  applyTransform();
}

let autoSaveTimer = null;


function getSaveData() {

  return {

function saveAutoMap() {

  try {

    const data =
      getSaveData();


    localStorage.setItem(
      AUTO_SAVE_KEY,
      JSON.stringify(data)
    );


    showSaveStatus(
      "自動保存：保存済み",

    );

  } catch (error) {

    console.error(
      "自動保存に失敗しました",
      error
    );


    showSaveStatus(
      "自動保存：失敗",
      false
    );
  }
}


function scheduleAutoSave() {

  clearTimeout(
    autoSaveTimer

  showSaveStatus(

  autoSaveTimer =
    setTimeout(

/* =====================================================

function loadAutoMap() {

  try {

    const raw =
      localStorage.getItem(
        AUTO_SAVE_KEY
      );


    if (
      !raw
    ) {

      return false;
    }


    const data =
      JSON.parse(raw);


    if (
      !data ||
      !Array.isArray(
        data.characters
      ) ||
      !Array.isArray(
        data.relations
      )
    ) {

      return false;
    }


    characters =
      data.characters.map(
        character => ({

          id:
            character.id ||
            generateId(
              "character"
            ),

          name:
            character.name ||
            "名称未設定",

          x:
            Number.isFinite(
              character.x
            )
              ? character.x
              : MAP_WIDTH / 2,

          y:
            Number.isFinite(
              character.y
            )
              ? character.y
              : MAP_HEIGHT / 2,

          status:
            character.status ===
            "CLOSE"
              ? "CLOSE"
              : "OPEN"
        })
      );


    relationData =
      data.relations.map(
        relation => ({

          id:
            relation.id ||
            generateId(
              "relation"
            ),

          from:
            relation.from,

          to:
            relation.to,

          name:
            relation.name ||
            "",

          color:
            relation.color ||
            "#00eaff",

          offsetX:
            Number.isFinite(
              relation.offsetX
            )
              ? relation.offsetX
              : (
                  Number.isFinite(
                    relation.labelOffsetX
                  )
                    ? relation.labelOffsetX
                    : 0
                ),

          offsetY:
            Number.isFinite(
              relation.offsetY
            )
              ? relation.offsetY
              : (
                  Number.isFinite(
                    relation.labelOffsetY
                  )
                    ? relation.labelOffsetY
                    : 0
                )
        })
      );


    showSaveStatus(
      "自動保存：前回のマップを復元",
      true
    );


    return true;

  } catch (error) {

    console.error(
      "自動読み込みに失敗しました",
      error
    );


    return false;
  }
}
