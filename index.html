/* =====================================================
   関係削除
===================================================== */

function deleteRelation(
  relation
) {

  const from = getRelationEntity(relation.from);
  const to = getRelationEntity(relation.to);


  const fromName =
    from
      ? from.name
      : "";

  const toName =
    to
      ? to.name
      : "";


  const ok =
    confirm(
      `${fromName} → ${toName}\n「${relation.name}」を削除しますか？`
    );


  if (
    !ok
  ) {
    return;
  }


  relationData =
    relationData.filter(
      item =>
        item.id !==
        relation.id
    );


  updateRelations();

  scheduleAutoSave();
}

===================================================== */

function createContextButton(
  label,
  callback
) {

  const button =
    document.createElement("button");


  button.className =
    "context-item";


  button.textContent =
    label;


  button.addEventListener(
    "click",
    event => {

      event.preventDefault();

      event.stopPropagation();

      callback();
    }
  );


  return button;
}


function showContextMenuAt(
  x,
  y
) {

  contextMenu.style.display =
    "block";


  const width =
    contextMenu.offsetWidth;

  const height =
    contextMenu.offsetHeight;


  const margin = 8;


  x =
    clamp(
      x,
      margin,
      window.innerWidth -
        width -
        margin
    );


  y =
    clamp(
      y,
      margin,
      window.innerHeight -
        height -
        margin
    );


  contextMenu.style.left =
    x + "px";

  contextMenu.style.top =
    y + "px";
}


function hideContextMenu() {
  contextMenu.style.display = "none";

  // メニュー項目を毎回完全に破棄する
  // 非表示にするだけだと、開くたびに古い項目が残って増殖する
  contextMenu.replaceChildren();
}

/* =====================================================
   RANDOM GENERATION
===================================================== */

function pick(list, fallback) {
  const arr = Array.isArray(list) && list.length ? list : [fallback];
  return arr[Math.floor(Math.random()*arr.length)];
}

function createRandomCharacterAt(x,y) {
  const name = pick(generatorLists.surnames,"名無し") + pick(generatorLists.names,"太郎");
  const character = normalizeCharacter({
    id: generateId("character"),
    name,
    x: clamp(x, NODE_RADIUS+20, MAP_WIDTH-NODE_RADIUS-20),
    y: clamp(y, NODE_RADIUS+20, MAP_HEIGHT-NODE_RADIUS-20),
    status: "OPEN",
    organizationId: null,
    details: { notes: "ランダム生成" },
    stats: {
      "体力": Math.floor(Math.random()*101),
      "知力": Math.floor(Math.random()*101),
      "精神力": Math.floor(Math.random()*101),
      "戦闘力": Math.floor(Math.random()*101),
      "運": Math.floor(Math.random()*101)
    }
  });
  characters.push(character);
  updateNodes();
  updateRelations();
  scheduleAutoSave();
}

function randomGenerate() {
  const mode = prompt("生成対象を入力してください：\\n1 = キャラクター\\n2 = 関係\\n3 = 組織");
  if (mode === "1") {
    createRandomCharacterAt(MAP_WIDTH/2 + (Math.random()-.5)*500, MAP_HEIGHT/2 + (Math.random()-.5)*500);
  } else if (mode === "2") {
    const candidates = characters.filter(c => c.id);
    if (candidates.length < 2) return alert("キャラクターが2人以上必要です。");
    const from = pick(candidates, candidates[0]);
    let to = pick(candidates, candidates[1]);
    let guard=0;
    while (to.id===from.id && guard++<20) to=pick(candidates,candidates[1]);
    if (from.id===to.id) return;
    addRandomRelation(from.id,to.id);
  } else if (mode === "3") {
    createOrganization();
  }
}

function addRandomRelation(sourceId,targetId) {
  if (relationData.some(r=>r.from===sourceId && r.to===targetId)) return;
  relationData.push(normalizeRelation({
    id: generateId("relation"),
    from: sourceId,
    to: targetId,
    name: pick(generatorLists.relations,"関係"),
    color: randomRelationColor(),
    offsetX:0, offsetY:0,
    emotions: Object.fromEntries(DEFAULT_EMOTIONS.map(k=>[k,Math.floor(Math.random()*101)-50]))
  }));
  updateRelations();
  scheduleAutoSave();
}

function startRelationMode(

) {

    sourceId;

  relationMode.style.display =

}

  relationModeSourceId = null;
  relationMode.style.display = "none";

function startRelationModeTarget(targetId) {
  if (!relationModeSourceId || relationModeSourceId === targetId) { cancelRelationMode(); return; }
  addRelation(relationModeSourceId, targetId);
}


/* =====================================================
   関係追加
===================================================== */

async function addRelation(
  sourceId,
  targetId
) {

  if (
    sourceId === targetId
  ) {

    cancelRelationMode();

    return;
  }


  const source = getRelationEntity(sourceId);
  const target = getRelationEntity(targetId);

  if (!source || !target) {

    cancelRelationMode();

    return;
  }


  // 同じ方向の関係は1本だけ。
  // 逆方向（A→B と B→A）は相互関係として許可する。
  const alreadyExists = relationData.some(
    relation =>
      relation.from === sourceId &&
      relation.to === targetId
  );

  if (alreadyExists) {
    cancelRelationMode();
    return;
  }


  const name =
    await showTextDialog(
      `${source.name} → ${target.name}`,
      "このキャラをどう思っている？"
    );


  cancelRelationMode();


  if (
    name === null ||
    !name.trim()
  ) {

    return;
  }


  relationData.push({

    id:
      generateId(
        "relation"
      ),

    from:
      sourceId,

    to:
      targetId,

    name:
      name.trim(),

    color:
      randomRelationColor(),

    offsetX:
      0,

    offsetY:
      0
  });


  updateRelations();

  scheduleAutoSave();
}

  const colors = [

    "#ff4d8d",
    "#ff9f43",
    "#ffc857",
    "#61dafb",
    "#b967ff",
    "#5dffc7",
    "#ff416c"

  ];


  return colors[

      Math.random() *
      colors.length
    )
  ];
}

/* =====================================================
   ★ 整列
===================================================== */

function arrangeCharacters() {

  const count =
    characters.length;


  if (
    count === 0
  ) {
    return;
  }


  const centerX =
    MAP_WIDTH / 2;

  const centerY =
    MAP_HEIGHT / 2;


  /*
    接続数を計算
  */

  const connectionCount =
    new Map();


  for (
    const character
    of characters
  ) {

    connectionCount.set(
      character.id,
      0
    );
  }


  for (
    const relation
    of relationData
  ) {

    if (
      connectionCount.has(
        relation.from
      )
    ) {

      connectionCount.set(
        relation.from,
        connectionCount.get(
          relation.from
        ) + 1
      );
    }


    if (
      connectionCount.has(
        relation.to
      )
    ) {

      connectionCount.set(
        relation.to,
        connectionCount.get(
          relation.to
        ) + 1
      );
    }
  }


  /*
    接続数が多い順
  */

  const sorted =
    [...characters].sort(
      (a, b) =>
        connectionCount.get(b.id) -
        connectionCount.get(a.id)
    );


  /*
    ★整列の基本配置

    1人 → 中央

    2～7人 →
    中央＋円形

    8人以上 →
    2重リング
  */

  if (
    sorted.length === 1
  ) {

    sorted[0].x =
      centerX;

    sorted[0].y =
      centerY;

  } else {

    /*
      中心キャラ
    */

    sorted[0].x =
      centerX;

    sorted[0].y =
      centerY;


    const rest =
      sorted.slice(1);


    /*
      5ノード程度なら
      半径500前後。

      画面内に関係名まで
      まとめて入りやすい。
    */

    const radius =
      rest.length <= 4
        ? 500
        : rest.length <= 7
          ? 600
          : 720;


    rest.forEach(
      (character, index) => {

        const angle =
          (
            index /
            rest.length
          ) *
          Math.PI *
          2 -
          Math.PI / 2;


        character.x =
          centerX +
          Math.cos(angle) *
          radius;


        character.y =
          centerY +
          Math.sin(angle) *
          radius;
      }
    );
  }


  /*
    ★重なり防止

    ただし「離れすぎない」
    ことを優先する。
  */

  for (
    let iteration = 0;
    iteration < 30;
    iteration++
  ) {

    for (
      let i = 0;
      i < characters.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < characters.length;
        j++
      ) {

        const a =
          characters[i];

        const b =
          characters[j];


        let dx =
          b.x - a.x;

        let dy =
          b.y - a.y;


        let distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (
          distance < 1
        ) {

          distance = 1;

          dx = 1;
          dy = 0;
        }


        const minimumDistance =
          210;


        if (
          distance <
          minimumDistance
        ) {

          const push =
            (
              minimumDistance -
              distance
            ) * .035;


          const ux =
            dx / distance;

          const uy =
            dy / distance;


          a.x -=
            ux * push;

          a.y -=
            uy * push;


          b.x +=
            ux * push;

          b.y +=
            uy * push;
        }
      }
    }
  }


  /*
    マップ範囲内へ
  */

  for (
    const character
    of characters
  ) {

    character.x =
      clamp(
        character.x,
        NODE_RADIUS + 50,
        MAP_WIDTH -
          NODE_RADIUS -
          50
      );


    character.y =
      clamp(
        character.y,
        NODE_RADIUS + 50,
        MAP_HEIGHT -
          NODE_RADIUS -
          50
      );
  }


  updateNodes();

  updateRelations();


  /*
    ★整列後に必ず
    キャラクター全体を表示
  */

  centerOnCharacters();


  scheduleAutoSave();
}


/* =====================================================
   整列ボタン
===================================================== */

document
  .getElementById(
    "arrangeButton"
  )
  .addEventListener(
    "click",
    event => {

      event.preventDefault();

      event.stopPropagation();


      hideContextMenu();

      cancelRelationMode();
      cancelOrganizationCreation();

      arrangeCharacters();
      for (const group of organizationData) {
        if (!group.collapsed) arrangeOrganization(group);
      }
      updateNodes();
      updateRelations();
      scheduleAutoSave();
    }
  );


/* =====================================================
   中央表示
===================================================== */

function centerOnCharacters() {

  if (
    characters.length === 0
  ) {

    zoom = 1;

    panX =
      (
        viewport.clientWidth -
        MAP_WIDTH
      ) / 2;

    panY =
      (
        viewport.clientHeight -
        MAP_HEIGHT
      ) / 2;


    applyTransform();

    return;
  }


  let minX =
    Infinity;

  let maxX =
    -Infinity;

  let minY =
    Infinity;

  let maxY =
    -Infinity;


  for (
    const character
    of characters
  ) {

    minX =
      Math.min(
        minX,
        character.x -
        NODE_RADIUS
      );


    maxX =
      Math.max(
        maxX,
        character.x +
        NODE_RADIUS
      );


    minY =
      Math.min(
        minY,
        character.y -
        NODE_RADIUS
      );


    maxY =
      Math.max(
        maxY,
        character.y +
        NODE_RADIUS
      );
  }


  /*
    関係名が線の外へ出ても
    見えるよう余白を確保
  */

  const padding =
    260;


  const worldWidth =
    Math.max(
      800,
      maxX -
      minX +
      padding * 2
    );


  const worldHeight =
    Math.max(
      800,
      maxY -
      minY +
      padding * 2
    );


  /*
    画面の約75%に収める
  */

  const targetZoom =
    Math.min(
      viewport.clientWidth /
        worldWidth *
        .78,

      viewport.clientHeight /
        worldHeight *
        .78
    );


  zoom =
    clamp(
      targetZoom,
      0.65,
      1.25
    );


  const centerWorldX =
    (
      minX +
      maxX
    ) / 2;


  const centerWorldY =
    (
      minY +
      maxY
    ) / 2;


  panX =
    viewport.clientWidth / 2 -
    centerWorldX * zoom;


  panY =
    viewport.clientHeight / 2 -
    centerWorldY * zoom;


  constrainPan();

  applyTransform();
}


/* =====================================================
   自動保存
===================================================== */

let autoSaveTimer = null;


function getSaveData() {

  return {

    version: 5,

    mapWidth:
      MAP_WIDTH,

    mapHeight:
      MAP_HEIGHT,

    characters:
      JSON.parse(
        JSON.stringify(
          characters
        )
      ),

    relations:
      JSON.parse(
        JSON.stringify(
          relationData
        )
      ),

    organizations:
      JSON.parse(
        JSON.stringify(
          organizationData
        )
      ),

    eventHistory:
      JSON.parse(
        JSON.stringify(
          eventHistory
        )
      ),

    eventLibrary:
      JSON.parse(
        JSON.stringify(
          eventLibrary
        )
      )
  };
}


function saveAutoMap() {

  try {

    const data =
      getSaveData();


    localStorage.setItem(
      AUTO_SAVE_KEY,
      JSON.stringify(data)
    );


    showSaveStatus(
      "自動保存：保存済み",
      true
    );

  } catch (error) {

    console.error(
      "自動保存に失敗しました",
      error
    );


    showSaveStatus(
      "自動保存：失敗",
      false
    );
  }
}


function scheduleAutoSave() {

  clearTimeout(
    autoSaveTimer
  );


  showSaveStatus(
    "自動保存：変更あり",
    false
  );


  autoSaveTimer =
    setTimeout(
      saveAutoMap,
      400
    );
}


let saveStatusTimer = null;
function showSaveStatus(
  text,
  success
) {
  saveStatus.textContent = text;
  saveStatus.style.color = success ? "#5dffc7" : "#aebbd0";
  saveStatus.classList.add("visible");
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(() => saveStatus.classList.remove("visible"), 1800);
}


/* =====================================================
   自動読み込み
===================================================== */

function loadAutoMap() {

  try {

    const raw = localStorage.getItem(AUTO_SAVE_KEY);

    if (!raw) return false;

    const data = JSON.parse(raw);

    if (!data || !Array.isArray(data.characters) || !Array.isArray(data.relations)) {
      return false;
    }

    characters = data.characters.map(normalizeCharacter);
    relationData = data.relations.map(normalizeRelation);
    organizationData = Array.isArray(data.organizations)
      ? data.organizations.map(normalizeOrganization)
      : [];
    eventHistory = Array.isArray(data.eventHistory) ? data.eventHistory : [];
    if (Array.isArray(data.eventLibrary) && data.eventLibrary.length) {
      eventLibrary = data.eventLibrary;
    }

    normalizeAllExtendedData();

    showSaveStatus("自動保存：前回のマップを復元", true);
    return true;

  } catch (error) {

    console.error("自動読み込みに失敗しました", error);
    return false;

  }
}

/* =====================================================
   JSON EXPORT
===================================================== */

function exportMap() {

  const data =
    getSaveData();


  const json =
    JSON.stringify(
      data,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    "character_relationship_map.json";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );
}


/* =====================================================
   JSON IMPORT
===================================================== */

function importMap() {

  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";

  input.addEventListener("change", async () => {

    const file = input.files[0];
    if (!file) return;

    try {

      const text = await file.text();
      const data = JSON.parse(text);

      if (!data || !Array.isArray(data.characters) || !Array.isArray(data.relations)) {
        throw new Error("JSON形式が正しくありません");
      }

      characters = data.characters.map(normalizeCharacter);
      relationData = data.relations.map(normalizeRelation);
      organizationData = Array.isArray(data.organizations)
        ? data.organizations.map(normalizeOrganization)
        : [];
      eventHistory = Array.isArray(data.eventHistory) ? data.eventHistory : [];
      if (Array.isArray(data.eventLibrary) && data.eventLibrary.length) {
        eventLibrary = data.eventLibrary;
      }

      normalizeAllExtendedData();
      updateOrganizationBoxes();
      updateNodes();
      updateRelations();
      centerOnCharacters();
      saveAutoMap();

      alert("マップを読み込みました。");

    } catch (error) {

      console.error(error);
      alert("マップの読み込みに失敗しました。\n" + error.message);

    }

  });

  input.click();
}

/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      hideContextMenu();

      cancelRelationMode();
      cancelOrganizationCreation();

      cancelLongPress();


      if (
        dialogOverlay.style.display ===
        "flex"
      ) {

        closeDialog(null);
      }
    }
  }
);


/* =====================================================
   Resize
===================================================== */

window.addEventListener(
  "resize",
  () => {

    constrainPan();

    applyTransform();
  }
);


/* =====================================================
   初期化
===================================================== */

function initialize() {

  normalizeAllExtendedData();

  const restored =
    loadAutoMap();


  updateNodes();

  updateRelations();


  if (
    !restored
  ) {

    /*
      初期状態は整列
    */

    arrangeCharacters();


    showSaveStatus(
      "自動保存：初期状態",
      false
    );

  } else {

    centerOnCharacters();
  }


  applyTransform();
}


initialize();

</script>
