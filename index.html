<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>キャラクター関係図</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #080b12;
  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  touch-action: none;
}

body {
  position: relative;
}

/* =====================================================
   UI
===================================================== */

#ui {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1000;

  display: flex;
  flex-wrap: wrap;
  gap: 6px;

  max-width: calc(100vw - 24px);
}

.ui-button {
  border:
    1px solid rgba(255,255,255,.22);

  background:
    rgba(12,17,28,.94);

  color: #fff;

  padding: 8px 12px;

  border-radius: 8px;

  font-size: 13px;

  cursor: pointer;

  box-shadow:
    0 4px 16px rgba(0,0,0,.35);

  -webkit-tap-highlight-color: transparent;
}

.ui-button:hover {
  background:
    rgba(30,40,60,.95);
}

.ui-button:active {
  transform: translateY(1px);
}


/* =====================================================
   保存表示
===================================================== */

#saveStatus {
  position: fixed;

  left: 12px;
  top: 12px;

  z-index: 1000;

  padding: 6px 10px;

  border-radius: 7px;

  background:
    rgba(8,12,20,.82);

  border:
    1px solid rgba(255,255,255,.12);

  color: #aebbd0;

  font-size: 11px;

  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
}
#saveStatus.visible { opacity: 1; }


/* =====================================================
   VIEWPORT
===================================================== */

#viewport {
  position: fixed;

  inset: 0;

  overflow: hidden;

  touch-action: none;
}


/* =====================================================
   MAP
===================================================== */

#map {
  position: absolute;

  width: 6000px;
  height: 6000px;

  transform-origin: 0 0;

  background-color: #0b101a;

  background-image:
    radial-gradient(
      circle,
      rgba(120,170,255,.20) 1px,
      transparent 1px
    ),
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:
    40px 40px,
    200px 200px,
    200px 200px;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}


/* =====================================================
   SVG
===================================================== */

#relationLayer {
  position: absolute;

  z-index: 10;

  left: 0;
  top: 0;

  width: 6000px;
  height: 6000px;

  overflow: visible;

  pointer-events: none;
}

.relation-group {
  pointer-events: none;
}

.relation-line {
  fill: none;

  stroke-width: 5;

  opacity: .88;

  pointer-events: none;
}

.relation-line.organization-relation {
  stroke-width: 9;
  stroke-dasharray: 18 8;
  opacity: .96;
}

.relation-label-bg {
  fill:
    rgba(8,12,20,.96);

  stroke-width: 2;

  rx: 5;
  ry: 5;

  pointer-events: all;

  cursor: grab;

  touch-action: none;
}

.relation-label-bg:hover {
  fill:
    rgba(30,40,55,.98);
}

.relation-label-bg:active {
  cursor: grabbing;
}

.relation-label-text {
  fill: #fff;

  font-size: 24px;
  font-weight: 600;

  text-anchor: middle;
  dominant-baseline: middle;

  pointer-events: none;

  paint-order: stroke;

  stroke: #080b12;
  stroke-width: 4;
}


/* =====================================================
   CHARACTER NODE
===================================================== */

.character-node {
  position: absolute;

  width: 150px;
  height: 150px;

  margin-left: -75px;
  margin-top: -75px;

  border-radius: 50%;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #273954,
      #101827 65%,
      #090d15
    );

  border:
    4px solid #4d82ff;

  box-shadow:
    0 0 0 5px rgba(77,130,255,.10),
    0 0 30px rgba(40,100,255,.20);

  cursor: grab;

  z-index: 20;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  -webkit-tap-highlight-color: transparent;
}

.character-node:active {
  cursor: grabbing;
}

.character-node.close {
  opacity: .48;

  border-color: #687080;

  box-shadow:
    0 0 0 4px rgba(120,130,145,.08);
}

.character-name {
  max-width: 125px;

  font-size: 17px;

  font-weight: 700;

  line-height: 1.25;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  pointer-events: none;
}

.character-status {
  margin-top: 7px;

  padding: 3px 7px;

  border-radius: 999px;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .05em;

  pointer-events: none;
}

.character-node.open .character-status {
  color: #0b2019;

  background: #5dffc7;
}

.character-node.close .character-status {
  color: #fff;

  background: #555e6c;
}


/* =====================================================
   CONTEXT MENU
===================================================== */

#contextMenu {
  position: fixed;

  z-index: 3000;

  min-width: 190px;

  padding: 6px;

  background:
    rgba(12,17,28,.98);

  border:
    1px solid rgba(255,255,255,.18);

  border-radius: 10px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.55);

  display: none;
}

.context-item {
  width: 100%;

  padding: 10px 12px;

  border: 0;

  border-radius: 7px;

  background: transparent;

  color: #fff;

  text-align: left;

  font-size: 13px;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.context-item:hover {
  background:
    rgba(255,255,255,.09);
}


/* =====================================================
   RELATION MODE
===================================================== */

#relationMode {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 1500;

  display: none;

  padding: 10px 16px;

  border-radius: 999px;

  background:
    rgba(18,27,45,.96);

  border:
    1px solid rgba(0,234,255,.45);

  color: #fff;

  font-size: 13px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.4);
}

#relationMode strong {
  color: #00eaff;
}


/* =====================================================
   DIALOG
===================================================== */

#dialogOverlay {
  position: fixed;

  inset: 0;

  z-index: 4000;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(0,0,0,.58);
}

#dialog {
  width:
    min(420px, calc(100vw - 32px));

  padding: 20px;

  background:
    #111827;

  border:
    1px solid rgba(255,255,255,.16);

  border-radius: 12px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.6);
}

#dialogTitle {
  margin-bottom: 14px;

  font-size: 17px;

  font-weight: 700;
}

#dialogInput {
  width: 100%;

  padding: 11px 12px;

  border:
    1px solid rgba(255,255,255,.2);

  border-radius: 7px;

  background:
    #080d16;

  color: #fff;

  outline: none;
}

.dialog-buttons {
  margin-top: 14px;

  display: flex;

  justify-content: flex-end;

  gap: 8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

  #ui {
    top: auto;

    right: 8px;
    bottom: 8px;
    left: 8px;

    justify-content: flex-end;
  }

  .ui-button {
    padding: 8px 10px;

    font-size: 12px;
  }

  #saveStatus {
    top: 8px;
    left: 8px;
  }

  .character-node {
    width: 130px;
    height: 130px;

    margin-left: -65px;
    margin-top: -65px;
  }

  .character-name {
    max-width: 108px;

    font-size: 15px;
  }

  .relation-label-text {
    font-size: 20px;
  }

  #relationMode {
    bottom: 72px;

    max-width:
      calc(100vw - 24px);

    text-align: center;
  }
}


/* =====================================================
   EXTENDED FEATURES
===================================================== */

#eventButton {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 1800;
  padding: 12px 18px;
  border: 1px solid rgba(255,110,160,.55);
  border-radius: 12px;
  background: rgba(48,18,36,.96);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(0,0,0,.45);
}
#eventButton:hover { background: rgba(78,25,52,.98); }

.group-box {
  position: absolute;
  border: 2px solid rgba(120,170,255,.45);
  border-radius: 18px;
  background: rgba(40,65,105,.12);
  z-index: 5;
  pointer-events: all;
  box-sizing: border-box;
}
.group-header {
  position: absolute;
  left: 10px;
  top: 8px;
  padding: 5px 10px;
  border-radius: 8px;
  background: rgba(12,17,28,.88);
  border: 1px solid rgba(255,255,255,.12);
  color: #dbe7ff;
  font-size: 14px;
  font-weight: 800;
  pointer-events: all;
  cursor: grab;
  user-select: none;
}
.group-header:active { cursor: grabbing; }
.group-box.selected { box-shadow: 0 0 0 3px rgba(120,170,255,.35); }
.group-resize-handle { position:absolute; width:16px; height:16px; border:2px solid #fff; background:rgba(20,30,48,.95); border-radius:4px; z-index:30; display:none; box-sizing:border-box; }
.group-box.selected .group-resize-handle { display:block; }
.group-resize-nw { left:-8px; top:-8px; cursor:nwse-resize; }
.group-resize-ne { right:-8px; top:-8px; cursor:nesw-resize; }
.group-resize-sw { left:-8px; bottom:-8px; cursor:nesw-resize; }
.group-resize-se { right:-8px; bottom:-8px; cursor:nwse-resize; }
#organizationCreateMode {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  z-index: 1500; display: none; padding: 10px 16px; border-radius: 999px;
  background: rgba(18,27,45,.96); border: 1px solid rgba(120,170,255,.55);
  color: #fff; font-size: 13px; box-shadow: 0 5px 25px rgba(0,0,0,.4);
}
.group-box.collapsed { width: 190px !important; height: 48px !important; background: rgba(40,65,105,.22); }
.group-box.collapsed .group-header { right: 10px; }

#detailOverlay, #libraryOverlay, #eventOverlay {
  position: fixed;
  inset: 0;
  z-index: 5000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.62);
}
.feature-panel {
  width: min(720px, calc(100vw - 24px));
  max-height: min(820px, calc(100vh - 24px));
  overflow: auto;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 14px;
  background: #111827;
  box-shadow: 0 20px 80px rgba(0,0,0,.65);
}
.feature-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 14px;
}
.feature-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}
.feature-field label {
  display:block;
  margin-bottom:4px;
  color:#9fb0c8;
  font-size:11px;
}
.feature-field input, .feature-field textarea, .feature-field select {
  width:100%;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:7px;
  background:#080d16;
  color:#fff;
  outline:none;
}
.feature-field textarea { min-height:90px; resize:vertical; }
.feature-section {
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.10);
}
.param-row {
  display:grid;
  grid-template-columns: 1fr 90px;
  gap:8px;
  align-items:center;
  margin:6px 0;
}
.param-row input { width:100%; }
.feature-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}
.mini-button {
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:7px;
  background:#172235;
  color:#fff;
  cursor:pointer;
}
.emotion-meter {
  display:grid;
  grid-template-columns: 1fr 100px;
  gap:8px;
  align-items:center;
  margin:7px 0;
}
.emotion-meter input[type=range] { width:100%; }
.event-history {
  max-height:360px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.event-card {
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:9px;
  background:rgba(255,255,255,.035);
}
.event-card strong { color:#ffd36a; }
.small-note { color:#8fa0b8; font-size:11px; line-height:1.5; }

@media (max-width:700px) {
  #eventButton { right:10px; bottom:78px; }
  .feature-grid { grid-template-columns:1fr; }
}

</style>
</head>


<body>


<!-- =====================================================
     UI
===================================================== -->

<div id="ui">

  <button

  </button>

  </button>

  <button
    class="ui-button"
    id="arrangeButton">
    整列
  </button>

  <button class="ui-button" id="dataLoadButton">

  </button>

  </button>

<!-- =====================================================

<div id="viewport">

  <div id="map">

    <svg
      id="relationLayer"
      viewBox="0 0 6000 6000"
      preserveAspectRatio="none">

      <defs>

        <marker
          id="arrow"
          markerWidth="10"
          markerHeight="10"
          refX="9"
          refY="5"
          orient="auto"

          <path
            d="M 0 0 L 10 5 L 0 10 z"
            fill="context-stroke">
          </path>

        </marker>

        <marker
          id="organizationArrow"
          markerWidth="15"
          markerHeight="15"
          refX="13"
          refY="7.5"
          orient="auto"
          markerUnits="strokeWidth">
          <path d="M 0 0 L 15 7.5 L 0 15 z" fill="context-stroke"></path>
        </marker>

      </defs>

    </svg>

  </div>

</div>


<!-- =====================================================
     CONTEXT MENU
===================================================== -->

<div id="contextMenu"></div>


<!-- =====================================================
     RELATION MODE
===================================================== -->

<div id="organizationCreateMode"><strong>組織枠作成モード</strong>　始点を押して、離したところを終点にしてください　<span>ESCでキャンセル</span></div>

<div id="relationMode">

  <strong>
    関係追加モード
  </strong>

 　関係先のキャラをクリックしてください　

  <span>
    ESCでキャンセル
  </span>

</div>


<!-- =====================================================
     DIALOG
===================================================== -->


<!-- =====================================================
     EXTENDED DETAIL / EVENT UI
===================================================== -->

<div id="detailOverlay">

</div>

<div id="libraryOverlay">
  <div class="feature-panel" id="libraryPanel"></div>

<script>

/* =====================================================
   基本設定
===================================================== */

const MAP_WIDTH = 6000;
const MAP_HEIGHT = 6000;

const NODE_RADIUS = 75;
// 見た目の円（150px）＋境界線4pxを含めた衝突半径
const CHARACTER_COLLISION_RADIUS = NODE_RADIUS + 4;

const MIN_ZOOM = 0.25;
const MAX_ZOOM = 2.5;

const AUTO_SAVE_KEY =
  "character_relationship_map_v4";


/* =====================================================
   データ
===================================================== */

let characters = [

  {
    id: "hero",
    name: "主人公",
    x: 2500,
    y: 2500,
    status: "OPEN"
  },

  {
    id: "rival",
    name: "ライバル",
    x: 3300,
    y: 2100,
    status: "OPEN"
  },

  {
    id: "childhood",
    name: "幼馴染",
    x: 1900,
    y: 3300,
    status: "OPEN"
  },

  {
    id: "boss",
    name: "組織ボス",
    x: 3900,
    y: 3500,
    status: "OPEN"
  },

  {
    id: "friend",
    name: "親友",
    x: 3100,
    y: 3300,
    status: "OPEN"
  }
];


let relationData = [

  {
    id: "r1",
    from: "hero",
    to: "rival",
    name: "憧れ",
    color: "#ff4d8d",
    offsetX: 0,
    offsetY: 0
  },

  {
    id: "r2",
    from: "rival",
    to: "hero",
    name: "対抗心",
    color: "#ff9f43",
    offsetX: 0,
    offsetY: 0
  },

  {
    id: "r3",
    from: "hero",
    to: "childhood",
    name: "信頼",
    color: "#00eaff",
    offsetX: 0,
    offsetY: 0
  },

  {
    id: "r4",
    from: "rival",
    to: "boss",
    name: "敵意",
    color: "#ff416c",
    offsetX: 0,
    offsetY: 0
  },

  {
    id: "r5",
    from: "hero",
    to: "boss",
    name: "警戒",
    color: "#ffc857",
    offsetX: 0,
    offsetY: 0
  },

  {
    id: "r6",
    from: "friend",
    to: "hero",
    name: "友情",
    color: "#61dafb",
    offsetX: 0,
    offsetY: 0
  }
];



/* =====================================================
   EXTENDED DATA
===================================================== */

let organizationData = [];

let eventHistory = [];

let eventLibrary = [
  {
    id: "worst-meeting",
    name: "最悪な出会い",
    description: "まだ関係のない2人が最悪の第一印象を残す。",
    conditions: { relationship: "none" },
    effects: {
      relationName: "険悪",
      emotions: { "敵意": 35, "信頼": -20, "好意": -30, "警戒": 20 }
    }
  }
];

let generatorLists = {
  surnames: ["天羽","火々里","藍堂","白鐘","玻璃","黒鉄","水城","神代"],
  names: ["ルリ","ミカ","ミオ","アリア","ノクス","ユウ","シオン","レイ"],
  relations: ["信頼","友情","憧れ","好意","警戒","敵意","対抗心","尊敬","嫌悪","依存","険悪"],
  organizations: ["天羽家","SDA","禁書庫","七宝","無所属"]
};

const DEFAULT_EMOTIONS = [
  "好意","信頼","尊敬","親近感","依存","嫉妬","警戒","恐怖","敵意","嫌悪"
];

function normalizeCharacter(character) {
  return {
    id: character.id || generateId("character"),
    name: character.name || "名称未設定",
    x: Number.isFinite(character.x) ? character.x : MAP_WIDTH/2,
    y: Number.isFinite(character.y) ? character.y : MAP_HEIGHT/2,
    status: character.status === "CLOSE" ? "CLOSE" : "OPEN",
    organizationId: character.organizationId || null,
    details: character.details && typeof character.details === "object" ? character.details : {},
    stats: character.stats && typeof character.stats === "object" ? character.stats : {},
    memories: Array.isArray(character.memories) ? character.memories : []
  };
}

function normalizeRelation(relation) {
  return {
    id: relation.id || generateId("relation"),
    from: relation.from,
    to: relation.to,
    name: relation.name || "",
    color: relation.color || "#00eaff",
    offsetX: Number.isFinite(relation.offsetX) ? relation.offsetX : 0,
    offsetY: Number.isFinite(relation.offsetY) ? relation.offsetY : 0,
    emotions: relation.emotions && typeof relation.emotions === "object"
      ? relation.emotions
      : Object.fromEntries(DEFAULT_EMOTIONS.map(name => [name, 0]))
  };
}

function normalizeOrganization(group) {
  return {
    id: group.id || generateId("org"),
    name: group.name || "組織",
    x: Number.isFinite(group.x) ? group.x : 2200,
    y: Number.isFinite(group.y) ? group.y : 2200,
    width: Number.isFinite(group.width) ? group.width : 700,
    height: Number.isFinite(group.height) ? group.height : 500,
    color: group.color || "#78aaff",
    collapsed: !!group.collapsed
  };
}

function normalizeAllExtendedData() {
  characters = characters.map(normalizeCharacter);
  relationData = relationData.map(normalizeRelation);
  organizationData = organizationData.map(normalizeOrganization);
}

/* =====================================================
   DOM
===================================================== */

const viewport =
  document.getElementById("viewport");

const map =
  document.getElementById("map");

const relationLayer =
  document.getElementById("relationLayer");

const contextMenu =
  document.getElementById("contextMenu");

const relationMode =
  document.getElementById("relationMode");

const organizationCreateMode =
  document.getElementById("organizationCreateMode");

const saveStatus =

function getRelation(fromId,toId) {
  return relationData.find(r => r.from===fromId && r.to===toId);
}

function applyRelationEmotionDelta(relation, deltas) {
  relation.emotions = relation.emotions || {};
  for (const [name,delta] of Object.entries(deltas || {})) {
    relation.emotions[name] = clamp((Number(relation.emotions[name])||0) + Number(delta||0), -100, 100);
  }
}

function createRelationForEvent(fromId,toId,name,emotions) {
  let relation = getRelation(fromId,toId);
  if (!relation) {
    relation = normalizeRelation({
      id: generateId("relation"), from:fromId, to:toId, name,
      color: randomRelationColor(), offsetX:0, offsetY:0,
      emotions: Object.fromEntries(DEFAULT_EMOTIONS.map(k=>[k,0]))
    });
    relationData.push(relation);
  } else {
    relation.name = name || relation.name;
  }
  applyRelationEmotionDelta(relation, emotions);
  return relation;
}

function compareCondition(value, expression) {
  if (expression === undefined || expression === null || expression === "") return true;
  if (typeof expression === "number") return Number(value) === expression;
  const text = String(expression).trim();
  const m = text.match(/^(>=|<=|>|<|==|=)\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return String(value) === text;
  const n = Number(value);
  const target = Number(m[2]);
  switch (m[1]) {
    case ">=": return n >= target;
    case "<=": return n <= target;
    case ">": return n > target;
    case "<": return n < target;
    case "==":
    case "=": return n === target;
  }
  return false;
}

function matchesCharacterConditions(character, conditions, prefix) {
  if (!character || !conditions) return true;
  const statsKey = prefix + "Stats";
  const emotionsKey = prefix + "Emotions";

  for (const [name,expr] of Object.entries(conditions[statsKey] || {})) {
    if (!compareCondition(character.stats?.[name] ?? 0, expr)) return false;
  }

  for (const [name,expr] of Object.entries(conditions[emotionsKey] || {})) {
    // Character-level emotion conditions use the strongest outgoing relation.
    const values = relationData
      .filter(r => r.from === character.id)
      .map(r => Number(r.emotions?.[name] ?? 0));
    const value = values.length ? Math.max(...values) : 0;
    if (!compareCondition(value, expr)) return false;
  }

  return true;
}

function eventEligible(event) {
  const chars = characters.filter(c => c.status !== "CLOSE");
  if (chars.length < 2) return [];

  const conditions = event.conditions || {};
  const pairs = [];

  for (const a of chars) {
    for (const b of chars) {
      if (a.id === b.id) continue;

      const relation = getRelation(a.id,b.id);

      if (conditions.relationship === "none" && relation) continue;
      if (conditions.relationship && !["none","any"].includes(conditions.relationship)) {
        if (!relation || relation.name !== conditions.relationship) continue;
      }
      if (conditions.relationship !== "none" && !conditions.relationship && conditions.requireRelation && !relation) {
        continue;
      }

      if (!matchesCharacterConditions(a, conditions, "source")) continue;
      if (!matchesCharacterConditions(b, conditions, "target")) continue;

      if (conditions.sourceStatus && a.status !== conditions.sourceStatus) continue;
      if (conditions.targetStatus && b.status !== conditions.targetStatus) continue;

      pairs.push([a,b]);
    }
  }

  return pairs;
}

function weightedPick(items) {
  if (!items.length) return null;
  const total = items.reduce((sum,item) => sum + Math.max(0, Number(item.weight) || 1), 0);
  let roll = Math.random() * total;
  for (const item of items) {
    roll -= Math.max(0, Number(item.weight) || 1);
    if (roll <= 0) return item;
  }
  return items[items.length-1];
}

function applyStatDelta(character, deltas) {
  if (!character || !deltas) return;
  character.stats = character.stats || {};
  for (const [name,delta] of Object.entries(deltas)) {
    character.stats[name] = clamp((Number(character.stats[name])||0) + Number(delta||0), 0, 100);
  }
}

function applyEventEffects(source, target, effects) {
  const relationName = effects.relationName || pick(generatorLists.relations,"関係");
  const relation = createRelationForEvent(
    source.id,
    target.id,
    relationName,
    effects.emotions || {}
  );

  applyStatDelta(source, effects.sourceStats);
  applyStatDelta(target, effects.targetStats);

  return relation;
}

function triggerEvent() {
  const available = [];

  for (const event of eventLibrary) {
    const pairs = eventEligible(event);
    for (const pair of pairs) available.push({event,pair});
  }

  if (!available.length) {
    alert("現在の状態で発生条件を満たすイベントがありません。");
    return;
  }

  const selected = pick(available, available[0]);
  const {event,pair} = selected;
  const [a,b] = pair;

  let effects = event.effects || {};
  let outcome = null;

  if (Array.isArray(event.outcomes) && event.outcomes.length) {
    outcome = weightedPick(event.outcomes);
    effects = {
      ...effects,
      ...(outcome.effects || {})
    };
  }

  const relation = applyEventEffects(a,b,effects);
  const resultText =
    outcome?.text ||
    effects.result ||
    `${a.name} → ${b.name} に「${relation.name}」が発生。`;

  const record = {
    id: generateId("event"),
    time: new Date().toISOString(),
    eventId: event.id,
    eventName: event.name,
    description: event.description || "",
    characters: [a.id,b.id],
    result: resultText,
    changes: {
      relation: relation.name,
      emotions: effects.emotions || {},
      sourceStats: effects.sourceStats || {},
      targetStats: effects.targetStats || {}
    }
  };

  eventHistory.unshift(record);

  a.memories = Array.isArray(a.memories) ? a.memories : [];
  b.memories = Array.isArray(b.memories) ? b.memories : [];
  a.memories.unshift(record.id);
  b.memories.unshift(record.id);

  updateNodes();
  updateRelations();
  scheduleAutoSave();
  showEventResult(record);
}

async function loadExternalDataFiles() {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.accept = ".txt,.csv,.json,application/json,text/plain,text/csv";
  input.onchange = async () => {
    for (const file of [...input.files]) {
      const text = await file.text();
      const lower = file.name.toLowerCase();
      let data;
      try { data = JSON.parse(text); } catch { data = null; }

      if (data && typeof data === "object") {
        if (Array.isArray(data.surnames)) generatorLists.surnames.push(...data.surnames);
        if (Array.isArray(data.names)) generatorLists.names.push(...data.names);
        if (Array.isArray(data.relations)) generatorLists.relations.push(...data.relations);
        if (Array.isArray(data.organizations)) generatorLists.organizations.push(...data.organizations);
      } else {
        const values = text.split(/[\r\n,]+/).map(v=>v.trim()).filter(Boolean);
        if (lower.includes("苗字") || lower.includes("surname")) generatorLists.surnames.push(...values);
        else if (lower.includes("名前") || lower.includes("name")) generatorLists.names.push(...values);
        else if (lower.includes("関係") || lower.includes("relation")) generatorLists.relations.push(...values);
        else if (lower.includes("組織") || lower.includes("organization")) generatorLists.organizations.push(...values);
      }
    }
    alert("外部生成データを読み込みました。");
  };
  input.click();
}

async function loadEventFiles() {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.accept = ".json,.txt,application/json,text/plain";
  input.onchange = async () => {
    let loaded = 0;
    for (const file of [...input.files]) {
      const text = await file.text();
      try {
        const data = JSON.parse(text);
        const events = Array.isArray(data) ? data : (Array.isArray(data.events) ? data.events : [data]);
        for (const event of events) {
          if (!event || !event.name) continue;
          eventLibrary.push({
            id: event.id || generateId("eventdef"),
            name: event.name,
            description: event.description || "",
            conditions: event.conditions || {relationship:"none"},
            effects: event.effects || {relationName:"関係",emotions:{}}
          });
          loaded++;
        }
      } catch (e) {
        console.warn("イベントファイルを読み込めませんでした", file.name, e);
      }
    }
    alert(`${loaded}件のイベントを読み込みました。`);
  };
  input.click();
}

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function generateId(prefix) {

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2, 8)
  );
}


function getCharacter(id) {

  return characters.find(
    character =>
      character.id === id
  );
}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =====================================================
   座標変換
===================================================== */

function screenToWorld(
  screenX,
  screenY
) {

  const rect =
    viewport.getBoundingClientRect();

  return {

    x:
      (
        screenX -
        rect.left -
        panX
      ) / zoom,

    y:
      (
        screenY -
        rect.top -
        panY
      ) / zoom
  };
}


/* =====================================================
   Transform
===================================================== */

function applyTransform() {

  map.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
}


/* =====================================================
   パン範囲
===================================================== */

function constrainPan() {

  const rect =
    viewport.getBoundingClientRect();

  const scaledWidth =
    MAP_WIDTH * zoom;

  const scaledHeight =
    MAP_HEIGHT * zoom;

  const minX =
    Math.min(
      0,
      rect.width - scaledWidth
    );

  const minY =
    Math.min(
      0,
      rect.height - scaledHeight
    );

  panX =
    clamp(
      panX,
      minX,
      Math.max(
        0,
        rect.width - scaledWidth
      )
    );

  panY =
    clamp(
      panY,
      minY,
      Math.max(
        0,
        rect.height - scaledHeight
      )
    );
}

function rectsOverlap(a, b, padding = 0) {
  return a.x < b.x + b.width - padding &&
         a.x + a.width > b.x + padding &&
         a.y < b.y + b.height - padding &&
         a.y + a.height > b.y + padding;
}

function charactersOverlapAt(character, x, y) {
  return characters.some(other => {
    if (other.id === character.id) return false;
    // キャラの丸い枠全体が重ならないように判定する。
    return Math.hypot(other.x - x, other.y - y) < CHARACTER_COLLISION_RADIUS * 2;
  });
}

function organizationMembersOverlap(group, projectedPositions = null) {
  const positions = projectedPositions || getOrganizationCharacters(group.id).map(c => ({id:c.id, x:c.x, y:c.y}));
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      if (Math.hypot(positions[i].x - positions[j].x, positions[i].y - positions[j].y) < CHARACTER_COLLISION_RADIUS * 2) return true;
    }
  }
  return false;
}

function getProjectedMemberPositions(group, x, y, width, height) {
  const pad = NODE_RADIUS + 12;
  return getOrganizationCharacters(group.id).map(c => ({
    id:c.id,
    x:clamp(c.x, x + pad, x + width - pad),
    y:clamp(c.y, y + pad, y + height - pad)
  }));
}

function pointInsideOrganization(x, y, group, margin = 0) {
  return x >= group.x + margin &&
         x <= group.x + group.width - margin &&
         y >= group.y + margin &&
         y <= group.y + group.height - margin;
}

function getCharacterOrganizationAt(x, y, excludeId=null) {
  // ドラッグ終了時はキャラの中心が組織枠の内側なら所属対象。
  // 枠線ぎりぎりでも判定できるよう、判定対象を少しだけ外側へ広げる。
  const tolerance = Math.max(4, Math.min(NODE_RADIUS * 0.18, 12));
  return organizationData.find(g =>
    !g.collapsed &&
    g.id !== excludeId &&
    x >= g.x - tolerance &&
    x <= g.x + g.width + tolerance &&
    y >= g.y - tolerance &&
    y <= g.y + g.height + tolerance
  ) || null;
}

function getVisibleOrganization(group) {
  return !group.collapsed;
}

function isCharacterHiddenByOrganization(character) {
  if (!character.organizationId) return false;
  const group = organizationData.find(g => g.id === character.organizationId);
  return !!(group && group.collapsed);
}

function getRelationEntity(id) {
  return getCharacter(id) || organizationData.find(g => g.id === id) || null;
}

function isRelationHiddenByOrganization(relation) {
  const from = getRelationEntity(relation.from);
  const to = getRelationEntity(relation.to);
  if (!from || !to) return true;
  if (from.id && organizationData.some(g => g.id === from.id) && from.collapsed) return true;
  if (to.id && organizationData.some(g => g.id === to.id) && to.collapsed) return true;
  return !!((from.id && getCharacter(from.id) && isCharacterHiddenByOrganization(from)) ||
            (to.id && getCharacter(to.id) && isCharacterHiddenByOrganization(to)));
}

function assignCharactersToOrganization(group) {
  for (const character of characters) {
    // 中心点が枠の内側にあるキャラだけ所属させる。
    if (pointInsideOrganization(character.x, character.y, group, NODE_RADIUS + 8)) {
      character.organizationId = group.id;
    }
  }
}

function keepOrganizationMembersInside(group) {
  const pad = NODE_RADIUS + 12;
  for (const character of getOrganizationCharacters(group.id)) {
    character.x = clamp(character.x, group.x + pad, group.x + group.width - pad);
    character.y = clamp(character.y, group.y + pad, group.y + group.height - pad);
  }
}

function removeCharacterFromOrganizationIfOutside(character) {
  if (!character.organizationId) return;
  const group = organizationData.find(g => g.id === character.organizationId);
  if (!group || !pointInsideOrganization(character.x, character.y, group, NODE_RADIUS + 8)) {
    character.organizationId = null;
  }
}

function updateOrganizationBoxes() {

  for (const group of organizationData) {
    const box = document.createElement('div');

    header.textContent = `${group.name} ${group.collapsed ? 'CLOSE' : 'OPEN'}`;

    header.addEventListener('pointerdown', event => {
      if (organizationCreateActive) {

        startRelationModeTarget(group.id);

    });

      event.preventDefault();
      event.stopPropagation();

    });

    box.addEventListener('pointerdown', event => {
      if (organizationCreateActive) {
        handleOrganizationCreationStart(event);

      }
      // 関係名・リサイズハンドル・キャラは、それぞれ自身の操作を優先する。
      if (event.target.closest && (event.target.closest('.relation-label-bg') || event.target.closest('.group-resize-handle') || event.target.closest('.character-node'))) return;
      event.preventDefault();
      event.stopPropagation();
      selectedOrganizationId = group.id;
      startOrganizationDrag(event, group);
    });

    box.addEventListener('contextmenu', event => {
      if (event.target !== box) return;
      event.preventDefault();
      event.stopPropagation();
      showOrganizationContextMenu(event.clientX, event.clientY, group);
    });

    box.appendChild(header);

    if (!group.collapsed) {
      for (const corner of ['nw','ne','sw','se']) {
        const handle = document.createElement('div');
        handle.className = `group-resize-handle group-resize-${corner}`;
        handle.dataset.corner = corner;
        handle.addEventListener('pointerdown', event => startOrganizationResize(event, group, corner));
        box.appendChild(handle);
      }
    }

    // 組織枠は関係線より前、キャラより後ろに配置。
    map.appendChild(box);
  }
}

function startOrganizationResize(event, group, corner) {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  event.preventDefault();
  event.stopPropagation();
  selectedOrganizationId = group.id;
  resizingOrganization = group;
  organizationResizePointerId = event.pointerId;
  organizationResizeCorner = corner;
  organizationResizeWasMoved = false;
  const world = screenToWorld(event.clientX, event.clientY);
  organizationResizeStartWorldX = world.x;
  organizationResizeStartWorldY = world.y;
  organizationResizeOriginal = { x:group.x, y:group.y, width:group.width, height:group.height };
  document.addEventListener('pointermove', handleOrganizationResize);
  document.addEventListener('pointerup', endOrganizationResize);
  document.addEventListener('pointercancel', endOrganizationResize);
}

function moveCharacterOutsideRect(character, rect) {
  const r = CHARACTER_COLLISION_RADIUS;
  const left = rect.x - r;
  const right = rect.x + rect.width + r;
  const top = rect.y - r;
  const bottom = rect.y + rect.height + r;
  if (character.x < left || character.x > right || character.y < top || character.y > bottom) return true;

  const distances = [
    {x:left, y:character.y, d:Math.abs(character.x-left)},
    {x:right, y:character.y, d:Math.abs(right-character.x)},
    {x:character.x, y:top, d:Math.abs(character.y-top)},
    {x:character.x, y:bottom, d:Math.abs(bottom-character.y)}
  ];
  distances.sort((a,b)=>a.d-b.d);
  const p = distances[0];
  character.x = clamp(p.x, r + 20, MAP_WIDTH - r - 20);
  character.y = clamp(p.y, r + 20, MAP_HEIGHT - r - 20);
  return true;
}

function pushOrganizationOutOfRect(other, rect) {
  if (other.collapsed || !rectsOverlap(rect, other)) return true;
  const gap = 12;
  const candidates = [
    {dx: rect.x - (other.x + other.width) - gap, dy:0},
    {dx: rect.x + rect.width - other.x + gap, dy:0},
    {dx:0, dy: rect.y - (other.y + other.height) - gap},
    {dx:0, dy: rect.y + rect.height - other.y + gap}
  ];
  candidates.sort((a,b)=>Math.hypot(a.dx,a.dy)-Math.hypot(b.dx,b.dy));
  for (const c of candidates) {
    const nx = clamp(other.x + c.dx, 0, MAP_WIDTH - other.width);
    const ny = clamp(other.y + c.dy, 0, MAP_HEIGHT - other.height);
    const test = {...other, x:nx, y:ny};
    if (organizationData.some(g => g.id !== other.id && g.id !== resizingOrganization?.id && !g.collapsed && rectsOverlap(test,g))) continue;
    if (rectsOverlap(test, rect)) continue;
    other.x=nx; other.y=ny;
    // 呼び出し側で移動前後の差分を使って所属キャラも追従させる。
    return true;
  }
  return false;
}

function prepareResizeObstacles(test, originalGroup) {
  // 先に別組織を押し出す。
  for (const other of organizationData) {
    if (other.id === originalGroup.id || other.collapsed) continue;
    if (rectsOverlap(test, other)) {
      const oldX=other.x, oldY=other.y;
      const ok = pushOrganizationOutOfRect(other, test);
      if (!ok) return false;
      const shiftX=other.x-oldX, shiftY=other.y-oldY;
      for (const c of getOrganizationCharacters(other.id)) {
        c.x += shiftX; c.y += shiftY;
      }
    }
  }
  // 組織外のキャラが新しい枠に入り込む場合は、枠の外へ押し出す。
  for (const c of characters) {
    if (c.organizationId === originalGroup.id) continue;
    if (pointInsideOrganization(c.x, c.y, test, 0)) {
      moveCharacterOutsideRect(c, test);
    }
  }
  return true;
}

function handleOrganizationResize(event) {
  if (!resizingOrganization || event.pointerId !== organizationResizePointerId) return;
  const world = screenToWorld(event.clientX, event.clientY);
  const dx = world.x - organizationResizeStartWorldX;
  const dy = world.y - organizationResizeStartWorldY;
  if (Math.hypot(dx,dy) > 5) organizationResizeWasMoved = true;
  const o = organizationResizeOriginal;
  const minW = NODE_RADIUS*2 + 50;
  const minH = NODE_RADIUS*2 + 80;
  let x=o.x, y=o.y, w=o.width, h=o.height;
  if (organizationResizeCorner.includes('w')) { x = clamp(o.x + dx, 0, o.x+o.width-minW); w = o.width - (x-o.x); }
  if (organizationResizeCorner.includes('e')) { w = clamp(o.width + dx, minW, MAP_WIDTH-o.x); }
  if (organizationResizeCorner.includes('n')) { y = clamp(o.y + dy, 0, o.y+o.height-minH); h = o.height - (y-o.y); }
  if (organizationResizeCorner.includes('s')) { h = clamp(o.height + dy, minH, MAP_HEIGHT-o.y); }
  const test = {...resizingOrganization, x,y,width:w,height:h};
  const projectedMembers = getProjectedMemberPositions(resizingOrganization, x, y, w, h);
  if (!organizationMembersOverlap(resizingOrganization, projectedMembers)) {
    const snapshot = organizationData.map(g => ({id:g.id,x:g.x,y:g.y,chars:getOrganizationCharacters(g.id).map(c=>({id:c.id,x:c.x,y:c.y}))}));
    if (prepareResizeObstacles(test, resizingOrganization)) {
      resizingOrganization.x=x; resizingOrganization.y=y; resizingOrganization.width=w; resizingOrganization.height=h;
      projectedMembers.forEach(pos => {
        const c = getCharacter(pos.id);
        if (c) { c.x=pos.x; c.y=pos.y; }
      });
      updateNodes(); updateRelations();
      return;
    }
    // 押し出せない場合は、今回のリサイズだけ元に戻す。
    organizationData.forEach(g=>{const old=snapshot.find(v=>v.id===g.id); if(old){g.x=old.x;g.y=old.y; old.chars.forEach(v=>{const c=getCharacter(v.id);if(c){c.x=v.x;c.y=v.y;}});}});
  }
}

function endOrganizationResize(event) {
  if (!resizingOrganization || event.pointerId !== organizationResizePointerId) return;
  const moved=organizationResizeWasMoved;
  resizingOrganization=null; organizationResizePointerId=null; organizationResizeOriginal=null; organizationResizeCorner=null; organizationResizeWasMoved=false;
  document.removeEventListener('pointermove', handleOrganizationResize);
  document.removeEventListener('pointerup', endOrganizationResize);
  document.removeEventListener('pointercancel', endOrganizationResize);
  updateNodes(); updateRelations();
  if (moved) scheduleAutoSave();
}

function getOrganizationCharacters(groupId) {
  return characters.filter(c => c.organizationId === groupId);
}

function organizationCanOccupy(group, x, y, width = group.width, height = group.height) {
  const test = { ...group, x, y, width, height };
  const pad = NODE_RADIUS + 8;

  if (organizationData.some(other => other.id !== group.id && !other.collapsed && rectsOverlap(test, other))) return false;

  if (characters.some(c => {
    if (c.organizationId === group.id) return false;
    return pointInsideOrganization(c.x, c.y, test, pad);
  })) return false;

  const projected = getProjectedMemberPositions(group, x, y, width, height);
  if (organizationMembersOverlap(group, projected)) return false;

  return true;
}

function startOrganizationDrag(event, group) {
  draggingOrganization = group;
  organizationDragPointerId = event.pointerId;
  organizationWasDragged = false;
  const world = screenToWorld(event.clientX, event.clientY);
  organizationDragStartWorldX = world.x;
  organizationDragStartWorldY = world.y;
  organizationOriginalX = group.x;
  organizationOriginalY = group.y;
  organizationOriginalPositions = getOrganizationCharacters(group.id).map(c => ({ id:c.id, x:c.x, y:c.y }));
  document.addEventListener('pointermove', handleOrganizationDrag);
  document.addEventListener('pointerup', endOrganizationDrag);
  document.addEventListener('pointercancel', endOrganizationDrag);
}

function handleOrganizationDrag(event) {
  if (!draggingOrganization || event.pointerId !== organizationDragPointerId) return;
  const world = screenToWorld(event.clientX, event.clientY);
  const dx = world.x - organizationDragStartWorldX;
  const dy = world.y - organizationDragStartWorldY;
  if (Math.hypot(dx, dy) > 8) organizationWasDragged = true;

  const nextX = clamp(organizationOriginalX + dx, 0, MAP_WIDTH - draggingOrganization.width);
  const nextY = clamp(organizationOriginalY + dy, 0, MAP_HEIGHT - draggingOrganization.height);

  // 組織外のキャラクターを枠の中へ巻き込まない。
  if (!organizationCanOccupy(draggingOrganization, nextX, nextY)) return;

  const actualDx = nextX - organizationOriginalX;
  const actualDy = nextY - organizationOriginalY;
  draggingOrganization.x = nextX;
  draggingOrganization.y = nextY;

  for (const original of organizationOriginalPositions || []) {
    const c = getCharacter(original.id);
    if (!c) continue;
    c.x = original.x + actualDx;
    c.y = original.y + actualDy;
  }
  updateNodes();
  updateRelations();
}

function endOrganizationDrag(event) {
  if (!draggingOrganization || event.pointerId !== organizationDragPointerId) return;
  const group = draggingOrganization;
  const wasDragged = organizationWasDragged;
  draggingOrganization = null;
  organizationDragPointerId = null;
  organizationOriginalPositions = null;
  organizationOriginalX = 0;
  organizationOriginalY = 0;
  organizationWasDragged = false;
  document.removeEventListener('pointermove', handleOrganizationDrag);
  document.removeEventListener('pointerup', endOrganizationDrag);
  document.removeEventListener('pointercancel', endOrganizationDrag);

  if (!wasDragged) {
    group.collapsed = !group.collapsed;
  } else {
    keepOrganizationMembersInside(group);
  }
  updateNodes();
  updateRelations();
  scheduleAutoSave();
}

function startOrganizationCreation() {
  hideContextMenu();
  cancelRelationMode();
  organizationCreateActive = true;
  organizationCreateStart = null;
  organizationCreatePointerId = null;
  organizationCreateMode.style.display = 'block';
  organizationCreateMode.innerHTML = '<strong>組織枠作成モード</strong>　始点を押して、離したところを終点にしてください　<span>ESCでキャンセル</span>';
}

function cancelOrganizationCreation() {
  organizationCreateActive = false;
  organizationCreateStart = null;
  organizationCreatePointerId = null;
  organizationCreateMode.style.display = 'none';
}

function handleOrganizationCreationStart(event) {
  if (!organizationCreateActive) return false;
  if (event.pointerType === 'mouse' && event.button !== 0) return false;
  event.preventDefault();
  event.stopPropagation();
  organizationCreatePointerId = event.pointerId;
  organizationCreateStart = screenToWorld(event.clientX, event.clientY);
  organizationCreateMode.innerHTML = '<strong>組織枠作成モード</strong>　そのままドラッグして終点で離してください　<span>ESCでキャンセル</span>';
  document.addEventListener('pointermove', handleOrganizationCreationMove);
  document.addEventListener('pointerup', handleOrganizationCreationEnd);
  document.addEventListener('pointercancel', handleOrganizationCreationEnd);
  return true;
}

function handleOrganizationCreationMove(event) {
  if (!organizationCreateActive || organizationCreatePointerId !== event.pointerId || !organizationCreateStart) return;
  event.preventDefault();
}

function handleOrganizationCreationEnd(event) {
  if (!organizationCreateActive || organizationCreatePointerId !== event.pointerId || !organizationCreateStart) return;
  event.preventDefault();
  event.stopPropagation();
  const world = screenToWorld(event.clientX, event.clientY);
  const startPoint = organizationCreateStart;
  document.removeEventListener('pointermove', handleOrganizationCreationMove);
  document.removeEventListener('pointerup', handleOrganizationCreationEnd);
  document.removeEventListener('pointercancel', handleOrganizationCreationEnd);
  cancelOrganizationCreation();

  const x = Math.min(startPoint.x, world.x);
  const y = Math.min(startPoint.y, world.y);
  const width = Math.abs(world.x - startPoint.x);
  const height = Math.abs(world.y - startPoint.y);
  if (width < NODE_RADIUS * 2 + 30 || height < NODE_RADIUS * 2 + 30) {
    alert('組織枠が小さすぎます。キャラクターが入る大きさで指定してください。');
    return true;
  }
  const test = {x,y,width,height};
  if (organizationData.some(g => !g.collapsed && rectsOverlap(test, g))) {
    alert('別の組織枠と重なるため、組織枠を作成できません。');
    return true;
  }
  const group = normalizeOrganization({
    id: generateId('org'), name: pick(generatorLists.organizations, '組織'),
    x, y, width, height, collapsed:false
  });
  organizationData.push(group);
  assignCharactersToOrganization(group);
  keepOrganizationMembersInside(group);
  updateNodes();
  updateRelations();
  scheduleAutoSave();
  return true;
}

// 既存の「クリック→クリック」API名を残しつつ、実体は押下→離上方式にする。
function handleOrganizationCreationPoint(event) {
  return handleOrganizationCreationStart(event);
}

function showOrganizationContextMenu(x, y, group) {
  cancelRelationMode();
  hideContextMenu();

  contextMenu.appendChild(createContextButton(group.collapsed ? '組織をOPEN' : '組織をCLOSE', () => {
    hideContextMenu(); group.collapsed=!group.collapsed; selectedOrganizationId=group.id; updateNodes(); updateRelations(); scheduleAutoSave();
  }));
  contextMenu.appendChild(createContextButton('組織名を変更', () => {
    hideContextMenu(); showTextDialog('組織名を変更', group.name).then(value=>{ if(value && value.trim()){group.name=value.trim();updateNodes();scheduleAutoSave();} });
  }));
  contextMenu.appendChild(createContextButton('組織内に新規キャラ', () => { hideContextMenu(); addCharacterAtInOrganization(group); }));
  contextMenu.appendChild(createContextButton('組織内にランダムキャラ生成', () => { hideContextMenu(); createRandomCharacterInOrganization(group); }));
  contextMenu.appendChild(createContextButton('＋ 関係追加', () => { hideContextMenu(); startRelationMode(group.id); }));
  contextMenu.appendChild(createContextButton('所属キャラを詳細表示', () => { hideContextMenu(); showOrganizationMembers(group); }));
  contextMenu.appendChild(createContextButton('組織内を整列', () => { hideContextMenu(); arrangeOrganization(group); }));
  contextMenu.appendChild(createContextButton('組織を削除', () => { deleteOrganization(group); }));
  showContextMenuAt(x, y);
}

function deleteOrganization(group) {
  hideContextMenu();
  const target = organizationData.find(g => g.id === group.id);
  if (!target) return;

  // 「組織を削除」を選択した時点で、組織枠そのものは必ず削除する。
  // 所属キャラを残すか削除するかだけをここで選択する。
  const members = getOrganizationCharacters(target.id);
  let deleteMembers = false;

  if (members.length) {
    deleteMembers = confirm(
      `「${target.name}」を完全に削除します。\n\n` +
      `所属キャラ ${members.length} 人も削除しますか？\n\n` +
      `【OK】組織＋所属キャラを削除\n` +
      `【キャンセル】組織だけ削除し、キャラは無所属で残す`
    );
  }

  // 組織への関係を先に削除する。
  relationData = relationData.filter(r => r.from !== target.id && r.to !== target.id);

  if (deleteMembers) {
    const memberIds = new Set(members.map(c => c.id));
    characters = characters.filter(c => !memberIds.has(c.id));
    relationData = relationData.filter(r => !memberIds.has(r.from) && !memberIds.has(r.to));
  } else {
    // 組織だけ完全に消し、キャラは無所属として残す。
    characters.forEach(c => {
      if (c.organizationId === target.id) c.organizationId = null;
    });
  }

  organizationData = organizationData.filter(g => g.id !== target.id);
  if (selectedOrganizationId === target.id) selectedOrganizationId = null;

  updateNodes();
  updateRelations();
  scheduleAutoSave();
}

function addCharacterAtInOrganization(group) {
  const pad = NODE_RADIUS + 25;
  const x = group.x + group.width/2;
  const y = group.y + group.height/2;
  showTextDialog('組織内にキャラクター追加', '').then(name => {
    if (!name || !name.trim()) return;
    const pos = findOpenOrganizationPosition(group, x, y);
    if (!pos) { alert('組織内にキャラクターを配置できる空きがありません。'); return; }
    characters.push(normalizeCharacter({id:generateId('character'),name:name.trim(),x:pos.x,y:pos.y,status:'OPEN',organizationId:group.id}));
    updateNodes(); updateRelations(); scheduleAutoSave();
  });
}

function createRandomCharacterInOrganization(group) {
  const pos = findOpenOrganizationPosition(group, group.x+group.width/2, group.y+group.height/2);
  if (!pos) { alert('組織内にキャラクターを配置できる空きがありません。'); return; }
  const name = pick(generatorLists.surnames,'名無し') + pick(generatorLists.names,'太郎');
  characters.push(normalizeCharacter({id:generateId('character'),name,x:pos.x,y:pos.y,status:'OPEN',organizationId:group.id,details:{notes:'ランダム生成（組織内）'},stats:{'体力':Math.floor(Math.random()*101),'知力':Math.floor(Math.random()*101),'精神力':Math.floor(Math.random()*101),'戦闘力':Math.floor(Math.random()*101),'運':Math.floor(Math.random()*101)}}));
  updateNodes(); updateRelations(); scheduleAutoSave();
}

function findOpenOrganizationPosition(group, preferredX, preferredY) {
  const pad=NODE_RADIUS+30;
  const minX=group.x+pad, maxX=group.x+group.width-pad;
  const minY=group.y+pad, maxY=group.y+group.height-pad;
  if (minX>maxX || minY>maxY) return null;
  const candidates=[];
  for(let r=0;r<8;r++) for(let a=0;a<24;a++) {
    const radius=r*70;
    const angle=(a/24)*Math.PI*2;
    candidates.push({x:clamp(preferredX+Math.cos(angle)*radius,minX,maxX),y:clamp(preferredY+Math.sin(angle)*radius,minY,maxY)});
  }
  candidates.push({x:(minX+maxX)/2,y:(minY+maxY)/2});
  for(const pos of candidates) {
    const occupied=characters.some(c=>c.organizationId===group.id && Math.hypot(c.x-pos.x,c.y-pos.y)<NODE_RADIUS*2+20);
    if(!occupied) return pos;
  }
  return null;
}

function createOrganization() {
  startOrganizationCreation();
}

function showOrganizationMembers(group) {
  const members = getOrganizationCharacters(group.id);
  const names = members.length ? members.map(c => c.name).join('、') : '所属キャラクターなし';
  alert(`【${group.name}】\n${names}`);
}

function arrangeOrganization(group) {
  const members = getOrganizationCharacters(group.id);
  if (!members.length) return;
  const pad = NODE_RADIUS + 30;
  const cols = Math.max(1, Math.floor((group.width - pad*2) / (NODE_RADIUS*2 + 25)));
  const rows = Math.ceil(members.length / cols);
  const stepX = cols > 1 ? (group.width - pad*2) / (cols-1) : 0;
  const stepY = rows > 1 ? (group.height - pad*2) / (rows-1) : 0;
  members.forEach((c,i) => {
    const col = i % cols, row = Math.floor(i / cols);
    c.x = group.x + (cols > 1 ? pad + col*stepX : group.width/2);
    c.y = group.y + (rows > 1 ? pad + row*stepY : group.height/2);
  });
  updateNodes(); updateRelations(); scheduleAutoSave();
}

/* =====================================================
   関係更新
===================================================== */

function updateRelations() {

  relationLayer
    .querySelectorAll(
      ".relation-group"
    )
    .forEach(
      element =>
        element.remove()
    );


  const pairMap =
    new Map();


  for (
    const relation
    of relationData
  ) {

    const key =
      [relation.from, relation.to]
        .sort()
        .join("|");

    if (
      !pairMap.has(key)
    ) {

      pairMap.set(
        key,
        []
      );
    }

    pairMap
      .get(key)
      .push(relation);
  }


  for (
    const relation
    of relationData
  ) {

    const from = getRelationEntity(relation.from);
    const to = getRelationEntity(relation.to);

    if (isRelationHiddenByOrganization(relation)) continue;

    if (
      !from ||
      !to
    ) {
      continue;
    }


    /*
      CLOSEキャラから出る関係は非表示。
      CLOSEキャラへ向かう関係は表示。
    */

    if (
      from.status === "CLOSE"
    ) {
      continue;
    }


    const pairKey =
      [relation.from, relation.to]
        .sort()
        .join("|");

    const pair =
      pairMap.get(pairKey) || [];


    let perpendicularOffset = 0;


    if (
      pair.length >= 2
    ) {

      const reverse =
        pair.find(
          item =>
            item.from === relation.to &&
            item.to === relation.from
        );

      if (reverse) {

        perpendicularOffset =
          relation.from === pair[0].from
            ? -28
            : 28;
      }
    }


    drawRelation(
      relation,
      from,
      to,
      perpendicularOffset
    );
  }
}


/* =====================================================
   関係描画
===================================================== */

function getRelationBoundaryPoint(entity, dx, dy, direction) {
  if (organizationData.some(g => g.id === entity.id)) {
    const g = entity;
    const ux = dx * direction, uy = dy * direction;
    const halfW = g.width/2, halfH = g.height/2;
    const scale = 1 / Math.max(Math.abs(ux)/Math.max(halfW,1), Math.abs(uy)/Math.max(halfH,1), 0.0001);
    return { x:g.x+halfW+ux*scale, y:g.y+halfH+uy*scale };
  }
  const radius = NODE_RADIUS;
  return { x:entity.x + dx*radius*direction, y:entity.y + dy*radius*direction };
}

function drawRelation(
  relation,
  from,
  to,
  perpendicularOffset
) {

  let dx =
    to.x - from.x;

  let dy =
    to.y - from.y;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if (
    distance < 1
  ) {
    return;
  }


  dx /= distance;
  dy /= distance;


  const px = -dy;
  const py = dx;


  const startPoint = getRelationBoundaryPoint(from, dx, dy, 1);
  const endPoint = getRelationBoundaryPoint(to, dx, dy, -1);
  const startX = startPoint.x + px * perpendicularOffset;
  const startY = startPoint.y + py * perpendicularOffset;
  const endX = endPoint.x + px * perpendicularOffset;
  const endY = endPoint.y + py * perpendicularOffset;


  const centerX =
    (startX + endX) / 2;

  const centerY =
    (startY + endY) / 2;


  const offsetX =
    Number.isFinite(
      relation.offsetX
    )
      ? relation.offsetX
      : 0;

  const offsetY =
    Number.isFinite(
      relation.offsetY
    )
      ? relation.offsetY
      : 0;


  const labelX =
    centerX + offsetX;

  const labelY =
    centerY + offsetY;


  const group =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "g"
    );

  group.classList.add(
    "relation-group"
  );

  group.dataset.id =
    relation.id;


  /*
    線1
  */

  const line1 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  line1.classList.add(
    "relation-line"
  );


  /*
    線2
  */

  const line2 =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );

  line2.classList.add(
    "relation-line"
  );


  line1.setAttribute(
    "x1",
    startX
  );

  line1.setAttribute(
    "y1",
    startY
  );

  line1.setAttribute(
    "x2",
    labelX
  );

  line1.setAttribute(
    "y2",
    labelY
  );


  line2.setAttribute(
    "x1",
    labelX
  );

  line2.setAttribute(
    "y1",
    labelY
  );

  line2.setAttribute(
    "x2",
    endX
  );

  line2.setAttribute(
    "y2",
    endY
  );


  line2.setAttribute(
    "marker-end",
    "url(#arrow)"
  );

  const fromIsOrganization = organizationData.some(g => g.id === from.id);
  const toIsOrganization = organizationData.some(g => g.id === to.id);
  const organizationToOrganization = fromIsOrganization && toIsOrganization;
  if (organizationToOrganization) {
    line1.classList.add("organization-relation");
    line2.classList.add("organization-relation");
    line2.setAttribute("marker-end", "url(#organizationArrow)");
  }


  const relationColor =
    relation.color ||
    "#00eaff";


  line1.style.stroke =
    relationColor;

  line2.style.stroke =
    relationColor;


  /*
    中央マーカー
  */

  const circle =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  circle.setAttribute(
    "cx",
    labelX
  );

  circle.setAttribute(
    "cy",
    labelY
  );

  circle.setAttribute(
    "r",
    7
  );

  circle.setAttribute(
    "fill",
    relationColor
  );


  /*
    関係名
  */

  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  text.classList.add(
    "relation-label-text"
  );

  text.setAttribute(
    "x",
    labelX
  );

  text.setAttribute(
    "y",
    labelY
  );

  text.textContent =
    relation.name;


  /*
    ラベル幅
  */

  const estimatedWidth =
    Math.max(
      90,
      relation.name.length * 25 + 34
    );


  const rect =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );

  rect.classList.add(
    "relation-label-bg"
  );


  rect.setAttribute(
    "x",
    labelX -
    estimatedWidth / 2
  );

  rect.setAttribute(
    "y",
    labelY - 21
  );

  rect.setAttribute(
    "width",
    estimatedWidth
  );

  rect.setAttribute(
    "height",
    42
  );

  rect.setAttribute(
    "stroke",
    relationColor
  );


  /*
    関係名のドラッグ
  */

  rect.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();
      event.stopPropagation();

      if (event.pointerType === "touch") {
        startLongPress(
          event,
          rect,
          "relation",
          relation
        );
      }

      startRelationLabelDrag(
        event,
        relation
      );
    }
  );


  /*
    関係名の右クリックメニュー
  */

  rect.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();

      showRelationContextMenu(
        event.clientX,
        event.clientY,
        relation
      );
    }
  );


  /*
    関係名のダブルクリックでも
    名前変更
  */

  rect.addEventListener(
    "dblclick",
    event => {

      event.preventDefault();
      event.stopPropagation();

      renameRelation(
        relation
      );
    }
  );


  group.appendChild(line1);
  group.appendChild(line2);
  group.appendChild(circle);
  group.appendChild(rect);
  group.appendChild(text);


  relationLayer.appendChild(
    group
  );
}


/* =====================================================
   関係名ドラッグ
===================================================== */

function startRelationLabelDrag(
  event,
  relation
) {

  draggingRelation =
    relation;

  relationDragPointerId =
    event.pointerId;

  relationWasDragged =
    false;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  relation.__dragStartX =
    world.x;

  relation.__dragStartY =
    world.y;


  relation.__originalOffsetX =
    relation.offsetX || 0;

  relation.__originalOffsetY =
    relation.offsetY || 0;


  document.addEventListener(
    "pointermove",
    handleRelationLabelMove
  );

  document.addEventListener(
    "pointerup",
    handleRelationLabelUp
  );

  document.addEventListener(
    "pointercancel",
    handleRelationLabelUp
  );
}


function handleRelationLabelMove(
  event
) {

  if (
    !draggingRelation ||
    event.pointerId !==
      relationDragPointerId
  ) {
    return;
  }


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    draggingRelation.__dragStartX;

  const dy =
    world.y -
    draggingRelation.__dragStartY;


  if (
    Math.sqrt(
      dx * dx +
      dy * dy
    ) > 8
  ) {

    relationWasDragged =
      true;
  }


  draggingRelation.offsetX =
    draggingRelation.__originalOffsetX +
    dx;

  draggingRelation.offsetY =
    draggingRelation.__originalOffsetY +
    dy;


  updateRelations();
}


function handleRelationLabelUp(
  event
) {

  if (
    event.pointerId !==
      relationDragPointerId
  ) {
    return;
  }


  if (
    draggingRelation
  ) {

    delete
      draggingRelation.__dragStartX;

    delete
      draggingRelation.__dragStartY;

    delete
      draggingRelation.__originalOffsetX;

    delete
      draggingRelation.__originalOffsetY;
  }


  draggingRelation = null;

  relationDragPointerId = null;


  document.removeEventListener(
    "pointermove",
    handleRelationLabelMove
  );

  document.removeEventListener(
    "pointerup",
    handleRelationLabelUp
  );

  document.removeEventListener(
    "pointercancel",
    handleRelationLabelUp
  );


  scheduleAutoSave();
}


/* =====================================================
   キャラ PointerDown
===================================================== */

function handleCharacterPointerDown(
  event
) {

  if (organizationCreateActive) {
    handleOrganizationCreationPoint(event);
    return;
  }

  if (
    event.pointerType === "touch"
  ) {

    registerTouchPointer(event);
  }


  /*
    関係追加モード
  */

  if (
    relationModeSourceId
  ) {

    if (
      event.pointerType === "mouse" &&
      event.button === 2
    ) {
      return;
    }


    const target =
      getCharacter(
        event.currentTarget.dataset.id
      );


    if (
      target
    ) {

      event.preventDefault();
      event.stopPropagation();

      addRelation(
        relationModeSourceId,
        target.id
      );

      return;
    }
  }


  /*
    PC右クリック
  */

  if (
    event.pointerType === "mouse" &&
    event.button !== 0
  ) {

    return;
  }


  /*
    スマホ2本指
  */

  if (
    event.pointerType === "touch" &&
    touchPointers.size >= 2
  ) {

    return;
  }


  draggingCharacter =
    getCharacter(
      event.currentTarget.dataset.id
    );


  if (
    !draggingCharacter
  ) {
    return;
  }


  dragPointerId =
    event.pointerId;


  characterWasDragged =
    false;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  dragStartWorldX =
    world.x;

  dragStartWorldY =
    world.y;


  dragStartCharacterX =
    draggingCharacter.x;

  dragStartCharacterY =
    draggingCharacter.y;

  dragStartCharacterOrganizationId = draggingCharacter.organizationId || null;


  /*
    スマホ長押し
  */

  if (
    event.pointerType === "touch"
  ) {

    startLongPress(
      event,
      event.currentTarget
    );
  }


  document.addEventListener(
    "pointermove",
    handleCharacterDrag
  );

  document.addEventListener(
    "pointerup",
    handleCharacterDragEnd
  );

  document.addEventListener(
    "pointercancel",
    handleCharacterDragEnd
  );


  event.preventDefault();
  event.stopPropagation();
}


/* =====================================================
   キャラドラッグ
===================================================== */

function handleCharacterDrag(
  event
) {

  if (
    !draggingCharacter ||
    event.pointerId !==
      dragPointerId
  ) {

    return;
  }


  if (
    event.pointerType === "touch" &&
    touchPointers.size >= 2
  ) {

    cancelLongPress();

    return;
  }


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    dragStartWorldX;

  const dy =
    world.y -
    dragStartWorldY;


  /*
    ★一定距離動いたら
    「これはクリックではなくドラッグ」
    と確定する。
  */

  if (
    Math.sqrt(
      dx * dx +
      dy * dy
    ) > 12
  ) {

    characterWasDragged =
      true;

    cancelLongPress();
  }


  // 移動中は他ノードとの重なりを許可する。
  // 重なり判定はドラッグ終了時だけ行う。
  const candidateX = clamp(dragStartCharacterX + dx, NODE_RADIUS + 20, MAP_WIDTH - NODE_RADIUS - 20);
  const candidateY = clamp(dragStartCharacterY + dy, NODE_RADIUS + 20, MAP_HEIGHT - NODE_RADIUS - 20);
  draggingCharacter.x = candidateX;
  draggingCharacter.y = candidateY;

  updateNodes();

  updateRelations();
}


/* =====================================================
   キャラドラッグ終了
===================================================== */

function handleCharacterDragEnd(
  event
) {

  if (
    !draggingCharacter ||
    event.pointerId !==
      dragPointerId
  ) {

    return;
  }


  const character =
    draggingCharacter;


  const wasDragged =
    characterWasDragged;


  const wasLongPress =
    longPressTriggered;


  const world =
    screenToWorld(
      event.clientX,
      event.clientY
    );


  const dx =
    world.x -
    dragStartWorldX;

  const dy =
    world.y -
    dragStartWorldY;


  /*
    ★まずドラッグ状態を解除
  */

  draggingCharacter = null;

  dragPointerId = null;

  characterWasDragged =
    false;


  cancelLongPress();


  document.removeEventListener(
    "pointermove",
    handleCharacterDrag
  );

  document.removeEventListener(
    "pointerup",
    handleCharacterDragEnd
  );

  document.removeEventListener(
    "pointercancel",
    handleCharacterDragEnd
  );


  /*
    ★ドラッグした場合は
    絶対にOPEN/CLOSEを切り替えない
  */

  if (wasDragged) {
    const originalX = dragStartCharacterX;
    const originalY = dragStartCharacterY;
    const originalOrganizationId = dragStartCharacterOrganizationId;
    const originalGroup = originalOrganizationId
      ? organizationData.find(g => g.id === originalOrganizationId) || null
      : null;

    // pointerup位置を最終位置として必ず反映する（最後のpointermoveが届かなかった場合にも対応）。
    const finalX = clamp(dragStartCharacterX + dx, NODE_RADIUS + 20, MAP_WIDTH - NODE_RADIUS - 20);
    const finalY = clamp(dragStartCharacterY + dy, NODE_RADIUS + 20, MAP_HEIGHT - NODE_RADIUS - 20);
    character.x = finalX;
    character.y = finalY;

    const destinationGroup = getCharacterOrganizationAt(finalX, finalY, null);
    const destinationOrganizationId = destinationGroup ? destinationGroup.id : null;
    const leavingOriginal = !!originalGroup && destinationOrganizationId !== originalOrganizationId;
    const joiningDestination = !!destinationGroup && destinationOrganizationId !== originalOrganizationId;

    let accepted = true;
    if (leavingOriginal) {
      accepted = confirm(`「${originalGroup.name}」から離脱させますか？\n\n【OK】離脱する\n【キャンセル】移動をキャンセル`);
    }
    if (accepted && joiningDestination) {
      accepted = confirm(`「${destinationGroup.name}」に所属しますか？\n\n【OK】所属する\n【キャンセル】移動をキャンセル`);
    }

    if (!accepted) {
      character.x = originalX;
      character.y = originalY;
      character.organizationId = originalOrganizationId;
    } else {
      character.organizationId = destinationOrganizationId;
      // 最終位置だけは丸全体の重なりを禁止する。
      if (charactersOverlapAt(character, character.x, character.y)) {
        character.x = originalX;
        character.y = originalY;
        character.organizationId = originalOrganizationId;
      }
    }

    updateNodes();
    updateRelations();
    scheduleAutoSave();
    return;
  }


  /*
    ★長押しした場合も
    OPEN/CLOSEを切り替えない
  */

  if (
    wasLongPress
  ) {

    longPressTriggered =
      false;

    return;
  }


  /*
    PC左クリック
  */

  if (
    event.pointerType === "mouse" &&
    event.button === 0
  ) {

    toggleCharacterStatus(
      character.id
    );

    return;
  }


  /*
    スマホ短タップ
  */

  if (
    event.pointerType === "touch"
  ) {

    if (
      Math.sqrt(
        dx * dx +
        dy * dy
      ) < 15
    ) {

      toggleCharacterStatus(
        character.id
      );
    }
  }
}


/* =====================================================
   OPEN / CLOSE
===================================================== */

function toggleCharacterStatus(
  id
) {

  const character =
    getCharacter(id);

  if (
    !character
  ) {
    return;
  }


  character.status =
    character.status === "OPEN"
      ? "CLOSE"
      : "OPEN";


  updateNodes();

  updateRelations();

  scheduleAutoSave();
}


/* =====================================================
   長押し
===================================================== */

function startLongPress(
  event,
  target,
  kind = "character",
  relation = null
) {

  if (event.pointerType !== "touch") {
    return;
  }

  cancelLongPress();

  longPressStartX = event.clientX;
  longPressStartY = event.clientY;
  longPressTarget = target;
  longPressKind = kind;
  longPressTriggered = false;

  longPressTimer = setTimeout(() => {

    if (longPressTriggered) {
      return;
    }

    if (characterWasDragged || relationWasDragged) {
      return;
    }

    longPressTriggered = true;

    // 長押しした瞬間はパン・関係名ドラッグを止める
    isPanning = false;
    panPointerId = null;

    if (longPressKind === "background") {
      showBackgroundContextMenu(
        longPressStartX,
        longPressStartY,
        screenToWorld(longPressStartX, longPressStartY).x,
        screenToWorld(longPressStartX, longPressStartY).y
      );
      return;
    }

    if (longPressKind === "relation" && relation) {
      // 関係名を長押しした場合はドラッグを解除してメニューを表示
      if (draggingRelation === relation) {
        handleRelationLabelUp({
          pointerId: relationDragPointerId
        });
      }

      showRelationContextMenu(
        longPressStartX,
        longPressStartY,
        relation
      );
      return;
    }

    if (longPressKind === "character" && longPressTarget) {
      const character = getCharacter(
        longPressTarget.dataset.id
      );

      if (character) {
        draggingCharacter = null;
        dragPointerId = null;

        showCharacterContextMenu(
          longPressStartX,
          longPressStartY,
          character
        );
      }
    }

  }, 600);
}

function cancelLongPress() {

  if (
    longPressTimer
  ) {

    clearTimeout(
      longPressTimer
    );

    longPressTimer = null;
  }

  longPressTarget = null;
  longPressKind = null;
}


/* =====================================================
   Touch登録
===================================================== */

function registerTouchPointer(
  event
) {

  touchPointers.set(
    event.pointerId,
    {
      x: event.clientX,
      y: event.clientY
    }
  );


  /*
    2本指になった瞬間
  */

  if (
    touchPointers.size === 2
  ) {

    cancelLongPress();

    draggingCharacter = null;

    dragPointerId = null;


    const points =
      [...touchPointers.values()];


    pinchStartDistance =
      getTouchDistance();


    pinchStartZoom =
      zoom;


    pinchCenterX =
      (
        points[0].x +
        points[1].x
      ) / 2;


    pinchCenterY =
      (
        points[0].y +
        points[1].y
      ) / 2;


    const world =
      screenToWorld(
        pinchCenterX,
        pinchCenterY
      );


    pinchWorldX =
      world.x;

    pinchWorldY =
      world.y;
  }
}


function getTouchDistance() {

  const points =
    [...touchPointers.values()];


  if (
    points.length < 2
  ) {

    return 0;
  }


  const dx =
    points[1].x -
    points[0].x;

  const dy =
    points[1].y -
    points[0].y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =====================================================
   VIEWPORT POINTER DOWN
===================================================== */

viewport.addEventListener(
  "pointerdown",
  event => {

    if (organizationCreateActive) {
      handleOrganizationCreationPoint(event);
      return;
    }

    /*
      タッチ
    */

    if (
      event.pointerType === "touch"
    ) {

      registerTouchPointer(event);


      /*
        2本指
      */

      if (
        touchPointers.size >= 2
      ) {

        return;
      }


      /*
        キャラ上なら
        キャラ側で処理
      */

      if (
        event.target.closest(
          ".character-node"
        )
      ) {

        return;
      }


      /*
        関係名上なら
        関係名側で処理
      */

      if (
        event.target.closest(
          ".relation-label-bg"
        )
      ) {

        return;
      }


      /*
        背景長押し開始
      */

      startLongPress(
        event,
        null,
        "background"
      );


      /*
        背景パン開始
      */

      isPanning = true;

      panPointerId =
        event.pointerId;

      panStartX =
        event.clientX;

      panStartY =
        event.clientY;

      panStartPanX =
        panX;

      panStartPanY =
        panY;

      return;
    }


    /*
      PC
    */

    if (
      event.pointerType === "mouse"
    ) {

      if (
        event.button !== 0
      ) {

        return;
      }


      if (
        event.target.closest(
          ".character-node"
        )
      ) {

        return;
      }


      if (
        event.target.closest(
          ".relation-label-bg"
        )
      ) {

        return;
      }


      isPanning = true;

      panPointerId =
        event.pointerId;

      panStartX =
        event.clientX;

      panStartY =
        event.clientY;

      panStartPanX =
        panX;

      panStartPanY =
        panY;
    }

  },
  {
    passive: false
  }
);


/* =====================================================
   VIEWPORT POINTER MOVE
===================================================== */

viewport.addEventListener(
  "pointermove",
  event => {

    /*
      タッチ位置更新
    */

    if (
      event.pointerType === "touch" &&
      touchPointers.has(
        event.pointerId
      )
    ) {

      touchPointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );


      /*
        ピンチ
      */

      if (
        touchPointers.size >= 2
      ) {

        event.preventDefault();

        cancelLongPress();

        isPanning = false;


        const distance =
          getTouchDistance();


        if (
          pinchStartDistance > 0 &&
          distance > 0
        ) {

          const newZoom =
            clamp(
              pinchStartZoom *
              (
                distance /
                pinchStartDistance
              ),
              MIN_ZOOM,
              MAX_ZOOM
            );


          panX =
            pinchCenterX -
            pinchWorldX *
            newZoom;


          panY =
            pinchCenterY -
            pinchWorldY *
            newZoom;


          zoom =
            newZoom;


          constrainPan();

          applyTransform();
        }


        return;
      }


      /*
        1本指
      */

      const dx =
        event.clientX -
        longPressStartX;

      const dy =
        event.clientY -
        longPressStartY;


      if (
        Math.sqrt(
          dx * dx +
          dy * dy
        ) > 12
      ) {

        cancelLongPress();
      }


      /*
        背景パン
      */

      if (
        isPanning &&
        event.pointerId ===
          panPointerId
      ) {

        const moveX =
          event.clientX -
          panStartX;

        const moveY =
          event.clientY -
          panStartY;


        panX =
          panStartPanX +
          moveX;

        panY =
          panStartPanY +
          moveY;


        constrainPan();

        applyTransform();
      }


      return;
    }


    /*
      PCパン
    */

    if (
      event.pointerType === "mouse" &&
      isPanning &&
      event.pointerId ===
        panPointerId
    ) {

      const moveX =
        event.clientX -
        panStartX;

      const moveY =
        event.clientY -
        panStartY;


      panX =
        panStartPanX +
        moveX;

      panY =
        panStartPanY +
        moveY;


      constrainPan();

      applyTransform();
    }

  },
  {
    passive: false
  }
);


/* =====================================================
   Pointer UP
===================================================== */

document.addEventListener(
  "pointerup",
  event => {

    if (
      event.pointerType === "touch"
    ) {

      // タップで終わった場合は長押しタイマーを必ず解除。
      // 長押し発火後でも解除して問題ない。
      cancelLongPress();

      touchPointers.delete(
        event.pointerId
      );


      if (
        touchPointers.size < 2
      ) {

        pinchStartDistance = 0;
      }
    }


    if (
      event.pointerId ===
      panPointerId
    ) {

      isPanning = false;

      panPointerId = null;
    }

  }
);


/* =====================================================
   PC右クリック
===================================================== */

viewport.addEventListener(
  "contextmenu",
  event => {

    event.preventDefault();


    const characterNode =
      event.target.closest(
        ".character-node"
      );


    if (
      characterNode
    ) {

      const character =
        getCharacter(
          characterNode.dataset.id
        );


      if (
        character
      ) {

        showCharacterContextMenu(
          event.clientX,
          event.clientY,
          character
        );
      }

      return;
    }


    const relationLabel =
      event.target.closest(
        ".relation-label-bg"
      );


    if (
      relationLabel
    ) {

      const group =
        relationLabel.closest(
          ".relation-group"
        );


      if (
        group
      ) {

        const relation =
          relationData.find(
            item =>
              item.id ===
              group.dataset.id
          );


        if (
          relation
        ) {

          showRelationContextMenu(
            event.clientX,
            event.clientY,
            relation
          );
        }
      }

      return;
    }


    const world =
      screenToWorld(
        event.clientX,
        event.clientY
      );


    showBackgroundContextMenu(
      event.clientX,
      event.clientY,
      world.x,
      world.y
    );
  }
);


/* =====================================================
   ホイールズーム
===================================================== */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const oldZoom =
      zoom;


    const factor =
      event.deltaY < 0
        ? 1.12
        : 0.89;


    const newZoom =
      clamp(
        oldZoom * factor,
        MIN_ZOOM,
        MAX_ZOOM
      );


    const world =
      screenToWorld(
        event.clientX,
        event.clientY
      );


    zoom =
      newZoom;


    panX =
      event.clientX -
      world.x * zoom;


    panY =
      event.clientY -
      world.y * zoom;


    constrainPan();

    applyTransform();

  },
  {
    passive: false
  }
);


/* =====================================================
