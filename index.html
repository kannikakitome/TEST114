<script>
"use strict";

/* =========================================================
   MAP SETTINGS
========================================================= */

const MAP_WIDTH = 6000;
const MAP_HEIGHT = 6000;

const NODE_RADIUS = 75;

const MIN_ZOOM = 0.25;
const MAX_ZOOM = 2.5;

const AUTO_SAVE_KEY =
  "character_relationship_map_v4";

let zoom = 0.75;

let panX = 0;
let panY = 0;

let panPointer = null;

let relationModeFromId = null;

let contextMenuCharacterId = null;
let contextMenuRelationId = null;

let contextMapX = 0;
let contextMapY = 0;

/* =========================================================
   SAMPLE DATA
========================================================= */

let characters = [
  {
    id: "hero",
    name: "主人公",
    x: 2500,
    y: 2500,
    status: "OPEN"
  },
  {
    id: "rival",
    name: "ライバル",
    x: 3300,
    y: 2100,
    status: "OPEN"
  },
  {
    id: "childhood",
    name: "幼馴染",
    x: 1900,
    y: 3300,
    status: "OPEN"
  },
  {
    id: "boss",
    name: "組織ボス",
    x: 3900,
    y: 3500,
    status: "OPEN"
  }
];

let relationData = [
  {
    id: "r1",
    from: "hero",
    to: "rival",
    name: "憧れ",
    color: "#ff4d8d",
    offsetX: 0,
    offsetY: 0
  },
  {
    id: "r2",
    from: "rival",
    to: "hero",
    name: "対抗心",
    color: "#ff9f43",
    offsetX: 0,
    offsetY: 0
  },
  {
    id: "r3",
    from: "hero",
    to: "childhood",
    name: "信頼",
    color: "#00eaff",
    offsetX: 0,
    offsetY: 0
  },
  {
    id: "r4",
    from: "rival",
    to: "boss",
    name: "敵意",
    color: "#ff416c",
    offsetX: 0,
    offsetY: 0
  },
  {
    id: "r5",
    from: "hero",
    to: "boss",
    name: "警戒",
    color: "#ffc857",
    offsetX: 0,
    offsetY: 0
  }
];

/* =========================================================
   DOM
========================================================= */

const map = document.getElementById("map");
const viewport = document.getElementById("viewport");
const world = document.getElementById("world");

const nodeLayer =
  document.getElementById("nodeLayer");

const relationSvg =
  document.getElementById("relationSvg");

const relationLabelLayer =
  document.getElementById("relationLabelLayer");

const contextMenu =
  document.getElementById("contextMenu");

const relationMode =
  document.getElementById("relationMode");

const saveStatus =
  document.getElementById("saveStatus");

/* =========================================================
   AUTO SAVE
========================================================= */

let autoSaveTimer = null;

function getSaveData() {

  return {
    version: 4,

    mapWidth: MAP_WIDTH,
    mapHeight: MAP_HEIGHT,

    characters:
      JSON.parse(
        JSON.stringify(characters)
      ),

    relations:
      JSON.parse(
        JSON.stringify(relationData)
      )
  };
}

function saveAutoMap() {

  try {

    const data =
      getSaveData();

    localStorage.setItem(
      AUTO_SAVE_KEY,
      JSON.stringify(data)
    );

    showSaveStatus(
      "自動保存：保存済み",
      true
    );

  } catch (error) {

    console.error(
      "自動保存に失敗しました",
      error
    );

    showSaveStatus(
      "自動保存：失敗",
      false
    );
  }
}

function scheduleAutoSave() {

  clearTimeout(autoSaveTimer);

  showSaveStatus(
    "自動保存：変更あり",
    false
  );

  autoSaveTimer =
    setTimeout(
      saveAutoMap,
      400
    );
}

function loadAutoMap() {

  try {

    const raw =
      localStorage.getItem(
        AUTO_SAVE_KEY
      );

    if (!raw) {
      return false;
    }

    const data =
      JSON.parse(raw);

    if (
      !data ||
      !Array.isArray(data.characters) ||
      !Array.isArray(data.relations)
    ) {
      return false;
    }

    const loadedCharacters =
      data.characters
        .filter(c =>
          c &&
          typeof c.id === "string" &&
          typeof c.name === "string" &&
          Number.isFinite(Number(c.x)) &&
          Number.isFinite(Number(c.y))
        )
        .map(c => {

          return {
            id: c.id,
            name: c.name,
            x: Number(c.x),
            y: Number(c.y),
            status:
              c.status === "CLOSE"
                ? "CLOSE"
                : "OPEN"
          };

        });

    const characterIds =
      new Set(
        loadedCharacters.map(
          c => c.id
        )
      );

    const loadedRelations =
      data.relations
        .filter(r =>
          r &&
          typeof r.id === "string" &&
          characterIds.has(r.from) &&
          characterIds.has(r.to)
        )
        .map(r => {

          return {
            id: r.id,
            from: r.from,
            to: r.to,
            name:
              typeof r.name === "string"
                ? r.name
                : "",

            color:
              typeof r.color === "string"
                ? r.color
                : "#00eaff",

            offsetX:
              Number.isFinite(Number(r.offsetX))
                ? Number(r.offsetX)
                : (
                  Number.isFinite(Number(r.labelOffsetX))
                    ? Number(r.labelOffsetX)
                    : 0
                ),

            offsetY:
              Number.isFinite(Number(r.offsetY))
                ? Number(r.offsetY)
                : (
                  Number.isFinite(Number(r.labelOffsetY))
                    ? Number(r.labelOffsetY)
                    : 0
                )
          };

        });

    if (loadedCharacters.length === 0) {
      return false;
    }

    characters =
      loadedCharacters;

    relationData =
      loadedRelations;

    showSaveStatus(
      "自動保存：前回のマップを復元",
      true
    );

    return true;

  } catch (error) {

    console.error(
      "自動ロードに失敗しました",
      error
    );

    return false;
  }
}

function showSaveStatus(
  message,
  saved = false
) {

  saveStatus.textContent =
    message;

  saveStatus.classList.toggle(
    "saved",
    saved
  );
}

/* =========================================================
   UTILITY
========================================================= */

function makeId(prefix = "id") {

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2, 8)
  );
}

function getCharacter(id) {

  return characters.find(
    c => c.id === id
  );
}

function getRelation(id) {

  return relationData.find(
    r => r.id === id
  );
}

function clamp(value, min, max) {

  return Math.max(
    min,
    Math.min(max, value)
  );
}

/* =========================================================
   TRANSFORM
========================================================= */

function clampPan() {

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const scaledWidth =
    MAP_WIDTH * zoom;

  const scaledHeight =
    MAP_HEIGHT * zoom;

  /*
    マップが画面より小さい場合は中央寄せ。
    大きい場合は画面外へ行き過ぎないよう制限。
  */

  if (scaledWidth <= vw) {

    panX =
      (vw - scaledWidth) / 2;

  } else {

    panX =
      clamp(
        panX,
        vw - scaledWidth,
        0
      );
  }

  if (scaledHeight <= vh) {

    panY =
      (vh - scaledHeight) / 2;

  } else {

    panY =
      clamp(
        panY,
        vh - scaledHeight,
        0
      );
  }
}

function applyTransform() {

  clampPan();

  viewport.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;
}

/* =========================================================
   SCREEN → MAP
========================================================= */

function screenToMap(
  screenX,
  screenY
) {

  return {

    x:
      (screenX - panX) /
      zoom,

    y:
      (screenY - panY) /
      zoom
  };
}

/* =========================================================
   NODE RENDERING
========================================================= */

function updateNodes() {

  nodeLayer.innerHTML = "";

  for (const character of characters) {

    const node =
      document.createElement("div");

    node.className =
      "character" +
      (
        character.status === "CLOSE"
          ? " is-close"
          : ""
      );

    node.dataset.id =
      character.id;

    node.style.left =
      `${character.x}px`;

    node.style.top =
      `${character.y}px`;

    const name =
      document.createElement("div");

    name.className =
      "character-name";

    name.textContent =
      character.name;

    const status =
      document.createElement("div");

    status.className =
      "character-status " +
      (
        character.status === "OPEN"
          ? "open"
          : "close"
      );

    status.textContent =
      character.status;

    node.appendChild(name);
    node.appendChild(status);

    setupCharacterPointer(
      node,
      character.id
    );

    nodeLayer.appendChild(node);
  }
}

/* =========================================================
   CHARACTER POINTER
========================================================= */

function setupCharacterPointer(
  node,
  characterId
) {

  let pointerStartX = 0;
  let pointerStartY = 0;

  let originalX = 0;
  let originalY = 0;

  let moved = false;
  let dragging = false;

  node.addEventListener(
    "pointerdown",
    event => {

      /*
        右クリックは完全に別処理。
      */

      if (event.button === 2) {
        return;
      }

      event.stopPropagation();

      const character =
        getCharacter(characterId);

      if (!character) {
        return;
      }

      pointerStartX =
        event.clientX;

      pointerStartY =
        event.clientY;

      originalX =
        character.x;

      originalY =
        character.y;

      moved = false;
      dragging = false;

      node.setPointerCapture(
        event.pointerId
      );
    }
  );

  node.addEventListener(
    "pointermove",
    event => {

      if (
        !node.hasPointerCapture(
          event.pointerId
        )
      ) {
        return;
      }

      const dx =
        (event.clientX - pointerStartX)
        / zoom;

      const dy =
        (event.clientY - pointerStartY)
        / zoom;

      if (
        Math.abs(dx) > 4 ||
        Math.abs(dy) > 4
      ) {

        moved = true;
        dragging = true;

        node.classList.add(
          "dragging"
        );
      }

      if (!dragging) {
        return;
      }

      const character =
        getCharacter(characterId);

      if (!character) {
        return;
      }

      character.x =
        clamp(
          originalX + dx,
          NODE_RADIUS,
          MAP_WIDTH - NODE_RADIUS
        );

      character.y =
        clamp(
          originalY + dy,
          NODE_RADIUS,
          MAP_HEIGHT - NODE_RADIUS
        );

      node.style.left =
        `${character.x}px`;

      node.style.top =
        `${character.y}px`;

      updateRelations();
    }
  );

  node.addEventListener(
    "pointerup",
    event => {

      if (
        node.hasPointerCapture(
          event.pointerId
        )
      ) {

        node.releasePointerCapture(
          event.pointerId
        );
      }

      node.classList.remove(
        "dragging"
      );

      /*
        移動していなければクリック扱い。
      */

      if (!moved) {

        /*
          関係追加モード中なら
          タップ対象を関係先として扱う。
        */

        if (relationModeFromId) {

          handleRelationTarget(
            characterId
          );

          return;
        }

        /*
          左クリックでOPEN/CLOSE切替
        */

        const character =
          getCharacter(characterId);

        if (character) {

          character.status =
            character.status === "OPEN"
              ? "CLOSE"
              : "OPEN";

          updateNodes();
          updateRelations();

          scheduleAutoSave();
        }

      } else {

        scheduleAutoSave();
      }
    }
  );

  node.addEventListener(
    "pointercancel",
    event => {

      if (
        node.hasPointerCapture(
          event.pointerId
        )
      ) {

        node.releasePointerCapture(
          event.pointerId
        );
      }

      node.classList.remove(
        "dragging"
      );
    }
  );

  /*
    右クリック
  */

  node.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();

      showNodeMenu(
        event,
        characterId
      );
    }
  );
}

/* =========================================================
   RELATION OFFSET
========================================================= */

function getParallelOffset(
  relation
) {

  const reverse =
    relationData.find(r =>
      r.id !== relation.id &&
      r.from === relation.to &&
      r.to === relation.from
    );

  if (!reverse) {

    return {
      x: 0,
      y: 0
    };
  }

  const from =
    getCharacter(relation.from);

  const to =
    getCharacter(relation.to);

  if (!from || !to) {

    return {
      x: 0,
      y: 0
    };
  }

  const dx =
    to.x - from.x;

  const dy =
    to.y - from.y;

  const length =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (length === 0) {

    return {
      x: 0,
      y: 0
    };
  }

  /*
    垂直方向に28px。
  */

  const offset =
    relation.id < reverse.id
      ? 28
      : -28;

  return {

    x:
      (-dy / length) *
      offset,

    y:
      (dx / length) *
      offset
  };
}

/* =========================================================
   RELATION RENDERING
========================================================= */

function updateRelations() {

  relationSvg.innerHTML = "";
  relationLabelLayer.innerHTML = "";

  for (
    const relation of relationData
  ) {

    const from =
      getCharacter(
        relation.from
      );

    const to =
      getCharacter(
        relation.to
      );

    if (!from || !to) {
      continue;
    }

    /*
      CLOSEのキャラクターから
      出る関係は非表示。
    */

    if (
      from.status === "CLOSE"
    ) {
      continue;
    }

    const dx =
      to.x - from.x;

    const dy =
      to.y - from.y;

    const length =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (length < 1) {
      continue;
    }

    /*
      ノード円の内側に線が入らないようにする。
    */

    const ux =
      dx / length;

    const uy =
      dy / length;

    const parallel =
      getParallelOffset(
        relation
      );

    const startX =
      from.x +
      ux * NODE_RADIUS +
      parallel.x;

    const startY =
      from.y +
      uy * NODE_RADIUS +
      parallel.y;

    const endX =
      to.x -
      ux * NODE_RADIUS +
      parallel.x;

    const endY =
      to.y -
      uy * NODE_RADIUS +
      parallel.y;

    /*
      線の基本中央。
    */

    const centerX =
      (startX + endX) / 2;

    const centerY =
      (startY + endY) / 2;

    /*
      ラベル位置。
    */

    const pointX =
      centerX +
      Number(relation.offsetX || 0);

    const pointY =
      centerY +
      Number(relation.offsetY || 0);

    /*
      SVG線を2本に分割。
      こうすることでラベルを動かしても
      線が追従する。
    */

    const line1 =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line1.setAttribute(
      "x1",
      startX
    );

    line1.setAttribute(
      "y1",
      startY
    );

    line1.setAttribute(
      "x2",
      pointX
    );

    line1.setAttribute(
      "y2",
      pointY
    );

    line1.setAttribute(
      "stroke",
      relation.color
    );

    line1.classList.add(
      "relation-line"
    );

    line1.style.color =
      relation.color;

    relationSvg.appendChild(
      line1
    );

    const line2 =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line2.setAttribute(
      "x1",
      pointX
    );

    line2.setAttribute(
      "y1",
      pointY
    );

    line2.setAttribute(
      "x2",
      endX
    );

    line2.setAttribute(
      "y2",
      endY
    );

    line2.setAttribute(
      "stroke",
      relation.color
    );

    line2.setAttribute(
      "marker-end",
      "url(#arrow)"
    );

    line2.classList.add(
      "relation-line"
    );

    line2.style.color =
      relation.color;

    relationSvg.appendChild(
      line2
    );

    /*
      中央ポイント
    */

    const point =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );

    point.setAttribute(
      "cx",
      pointX
    );

    point.setAttribute(
      "cy",
      pointY
    );

    point.setAttribute(
      "r",
      "7"
    );

    point.setAttribute(
      "stroke",
      relation.color
    );

    point.classList.add(
      "relation-point"
    );

    relationSvg.appendChild(
      point
    );

    /*
      ラベル
    */

    const label =
      document.createElement("div");

    label.className =
      "relation-label";

    label.textContent =
      relation.name;

    label.style.left =
      `${pointX}px`;

    label.style.top =
      `${pointY}px`;

    label.style.color =
      relation.color;

    label.dataset.relationId =
      relation.id;

    setupRelationLabelPointer(
      label,
      relation.id
    );

    relationLabelLayer.appendChild(
      label
    );
  }
}

/* =========================================================
   RELATION LABEL DRAG
========================================================= */

function setupRelationLabelPointer(
  label,
  relationId
) {

  let dragging = false;

  let startClientX = 0;
  let startClientY = 0;

  let originalOffsetX = 0;
  let originalOffsetY = 0;

  function onMove(event) {

    if (!dragging) {
      return;
    }

    const relation =
      getRelation(relationId);

    if (!relation) {
      return;
    }

    const dx =
      (event.clientX - startClientX)
      / zoom;

    const dy =
      (event.clientY - startClientY)
      / zoom;

    relation.offsetX =
      originalOffsetX + dx;

    relation.offsetY =
      originalOffsetY + dy;

    updateRelations();
  }

  function onUp() {

    if (!dragging) {
      return;
    }

    dragging = false;

    document.removeEventListener(
      "pointermove",
      onMove
    );

    document.removeEventListener(
      "pointerup",
      onUp
    );

    document.removeEventListener(
      "pointercancel",
      onUp
    );

    scheduleAutoSave();
  }

  label.addEventListener(
    "pointerdown",
    event => {

      if (event.button !== 0) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      const relation =
        getRelation(relationId);

      if (!relation) {
        return;
      }

      dragging = true;

      startClientX =
        event.clientX;

      startClientY =
        event.clientY;

      originalOffsetX =
        Number(
          relation.offsetX || 0
        );

      originalOffsetY =
        Number(
          relation.offsetY || 0
        );

      document.addEventListener(
        "pointermove",
        onMove
      );

      document.addEventListener(
        "pointerup",
        onUp
      );

      document.addEventListener(
        "pointercancel",
        onUp
      );
    }
  );

  label.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();

      showRelationMenu(
        event,
        relationId
      );
    }
  );
}

/* =========================================================
   CONTEXT MENU
========================================================= */

function hideContextMenu() {

  contextMenu.style.display =
    "none";

  contextMenuCharacterId =
    null;

  contextMenuRelationId =
    null;
}

function showContextMenu(
  x,
  y,
  items
) {

  contextMenu.innerHTML = "";

  for (
    const item of items
  ) {

    if (item.separator) {

      const separator =
        document.createElement("div");

      separator.className =
        "menu-separator";

      contextMenu.appendChild(
        separator
      );

      continue;
    }

    const element =
      document.createElement("div");

    element.className =
      "menu-item" +
      (
        item.danger
          ? " danger"
          : ""
      );

    element.textContent =
      item.label;

    element.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        hideContextMenu();

        item.action();
      }
    );

    contextMenu.appendChild(
      element
    );
  }

  contextMenu.style.display =
    "block";

  /*
    画面外にはみ出さないようにする。
  */

  const rect =
    contextMenu.getBoundingClientRect();

  let finalX = x;
  let finalY = y;

  if (
    finalX + rect.width >
    window.innerWidth - 8
  ) {

    finalX =
      window.innerWidth -
      rect.width -
      8;
  }

  if (
    finalY + rect.height >
    window.innerHeight - 8
  ) {

    finalY =
      window.innerHeight -
      rect.height -
      8;
  }

  contextMenu.style.left =
    `${Math.max(4, finalX)}px`;

  contextMenu.style.top =
    `${Math.max(4, finalY)}px`;
}

/* =========================================================
   CHARACTER ADD
========================================================= */

function addCharacterAtContextPosition() {

  const x =
    clamp(
      contextMapX,
      NODE_RADIUS,
      MAP_WIDTH - NODE_RADIUS
    );

  const y =
    clamp(
      contextMapY,
      NODE_RADIUS,
      MAP_HEIGHT - NODE_RADIUS
    );

  const name =
    prompt(
      "キャラクター名を入力してください",
      "新キャラクター"
    );

  if (
    name === null
  ) {
    return;
  }

  const trimmed =
    name.trim();

  if (!trimmed) {
    return;
  }

  const character = {

    id:
      makeId("character"),

    name:
      trimmed,

    x,
    y,

    status:
      "OPEN"
  };

  characters.push(
    character
  );

  updateNodes();
  updateRelations();

  scheduleAutoSave();
}

/* =========================================================
   CHARACTER DELETE
========================================================= */

function deleteCharacter(
  characterId
) {

  const character =
    getCharacter(characterId);

  if (!character) {
    return;
  }

  const ok =
    confirm(
      `「${character.name}」を削除しますか？\n関連する関係も削除されます。`
    );

  if (!ok) {
    return;
  }

  characters =
    characters.filter(
      c => c.id !== characterId
    );

  relationData =
    relationData.filter(
      r =>
        r.from !== characterId &&
        r.to !== characterId
    );

  updateNodes();
  updateRelations();

  scheduleAutoSave();
}

/* =========================================================
   RELATION MODE
========================================================= */

function startRelationMode(
  fromId
) {

  relationModeFromId =
    fromId;

  relationMode.style.display =
    "block";
}

function cancelRelationMode() {

  relationModeFromId =
    null;

  relationMode.style.display =
    "none";
}

function handleRelationTarget(
  targetId
) {

  if (!relationModeFromId) {
    return;
  }

  const fromId =
    relationModeFromId;

  const from =
    getCharacter(fromId);

  const to =
    getCharacter(targetId);

  if (!from || !to) {
    cancelRelationMode();
    return;
  }

  if (fromId === targetId) {

    alert(
      "自分自身への関係は作成できません。"
    );

    return;
  }

  /*
    source → target
  */

  const relationName =
    prompt(
      `${from.name} → ${to.name}\n\n「${from.name}」は「${to.name}」をどう思っていますか？`,
      "関係"
    );

  if (
    relationName === null
  ) {

    cancelRelationMode();
    return;
  }

  const name =
    relationName.trim() ||
    "関係";

  const relation = {

    id:
      makeId("relation"),

    from:
      fromId,

    to:
      targetId,

    name,

    color:
      "#00eaff",

    offsetX:
      0,

    offsetY:
      0
  };

  relationData.push(
    relation
  );

  cancelRelationMode();

  updateRelations();

  scheduleAutoSave();
}

/* =========================================================
   BACKGROUND PAN
========================================================= */

map.addEventListener(
  "pointerdown",
  event => {

    if (
      event.button !== 0
    ) {
      return;
    }

    /*
      キャラクターや関係ラベル上では
      マップ移動を開始しない。
    */

    if (
      event.target.closest(
        ".character"
      )
    ) {
      return;
    }

    if (
      event.target.closest(
        ".relation-label"
      )
    ) {
      return;
    }

    hideContextMenu();

    panPointer = {

      id:
        event.pointerId,

      startX:
        event.clientX,

      startY:
        event.clientY,

      originalPanX:
        panX,

      originalPanY:
        panY
    };

    map.setPointerCapture(
      event.pointerId
    );
  }
);

map.addEventListener(
  "pointermove",
  event => {

    if (
      !panPointer ||
      event.pointerId !==
        panPointer.id
    ) {
      return;
    }

    panX =
      panPointer.originalPanX +
      (
        event.clientX -
        panPointer.startX
      );

    panY =
      panPointer.originalPanY +
      (
        event.clientY -
        panPointer.startY
      );

    applyTransform();
  }
);

map.addEventListener(
  "pointerup",
  event => {

    if (
      !panPointer ||
      event.pointerId !==
        panPointer.id
    ) {
      return;
    }

    panPointer = null;

    if (
      map.hasPointerCapture(
        event.pointerId
      )
    ) {

      map.releasePointerCapture(
        event.pointerId
      );
    }
  }
);

map.addEventListener(
  "pointercancel",
  event => {

    if (
      panPointer &&
      event.pointerId ===
        panPointer.id
    ) {

      panPointer = null;
    }
  }
);

/* =========================================================
   BACKGROUND RIGHT CLICK
========================================================= */

map.addEventListener(
  "contextmenu",
  event => {

    event.preventDefault();

    /*
      キャラや関係ラベルなら
      それぞれのメニューに任せる。
    */

    if (
      event.target.closest(
        ".character"
      )
    ) {
      return;
    }

    if (
      event.target.closest(
        ".relation-label"
      )
    ) {
      return;
    }

    showBackgroundMenu(
      event
    );
  }
);

/* =========================================================
   WHEEL ZOOM
========================================================= */

map.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    const rect =
      map.getBoundingClientRect();

    const mouseX =
      event.clientX -
      rect.left;

    const mouseY =
      event.clientY -
      rect.top;

    const before =
      screenToMap(
        mouseX,
        mouseY
      );

    const zoomFactor =
      event.deltaY < 0
        ? 1.12
        : 0.89;

    const newZoom =
      clamp(
        zoom * zoomFactor,
        MIN_ZOOM,
        MAX_ZOOM
      );

    if (
      newZoom === zoom
    ) {
      return;
    }

    zoom =
      newZoom;

    /*
      マウス位置を中心に
      ズームする。
    */

    panX =
      mouseX -
      before.x * zoom;

    panY =
      mouseY -
      before.y * zoom;

    applyTransform();
  },
  {
    passive: false
  }
);

   OUTSIDE CLICK
========================================================= */

document.addEventListener(

    if (

);

/* =========================================================
   ARRANGE
========================================================= */
function arrangeCharacters() {

  const count = characters.length;

  if (count === 0) {
    return;
  }

  if (count === 1) {

    characters[0].x = MAP_WIDTH / 2;
    characters[0].y = MAP_HEIGHT / 2;

    updateNodes();
    updateRelations();
    centerOnCharacters();

    scheduleAutoSave();

    return;
  }

  const centerX = MAP_WIDTH / 2;
  const centerY = MAP_HEIGHT / 2;

  /*
   * =====================================================
   * まず接続数を計算
   * =====================================================
   */

  const connectionCount = new Map();

  for (const character of characters) {
    connectionCount.set(character.id, 0);
  }

  for (const relation of relationData) {

    if (connectionCount.has(relation.from)) {
      connectionCount.set(
        relation.from,
        connectionCount.get(relation.from) + 1
      );
    }

    if (connectionCount.has(relation.to)) {
      connectionCount.set(
        relation.to,
        connectionCount.get(relation.to) + 1
      );
    }
  }

  /*
   * 接続の多いキャラを中心寄りにする。
   */

  const sortedCharacters = [...characters].sort(
    (a, b) =>
      connectionCount.get(b.id) -
      connectionCount.get(a.id)
  );

  /*
   * =====================================================
   * 初期配置
   *
   * キャラ数に応じて同心円状に配置
   * =====================================================
   */

  const usableWidth = MAP_WIDTH - 700;
  const usableHeight = MAP_HEIGHT - 700;

  const maxRadius =
    Math.min(
      usableWidth,
      usableHeight
    ) / 2;

  /*
   * キャラ数が多いほど外側まで使う。
   */

  const baseRadius =
    Math.min(
      maxRadius,
      Math.max(
        650,
        450 + Math.sqrt(count) * 500
      )
    );

  /*
   * 中心キャラ
   */

  if (sortedCharacters.length > 0) {

    const main =
      sortedCharacters[0];

    main.x = centerX;
    main.y = centerY;
  }

  /*
   * 残りを円形配置
   */

  const rest =
    sortedCharacters.slice(1);

  const ringCount =
    Math.max(
      1,
      Math.ceil(
        Math.sqrt(rest.length / 6)
      )
    );

  rest.forEach(
    (character, index) => {

      const ring =
        Math.floor(
          index / Math.max(
            1,
            Math.ceil(
              rest.length / ringCount
            )
          )
        );

      const indexInRing =
        index -
        ring *
        Math.ceil(
          rest.length / ringCount
        );

      const countInRing =
        Math.ceil(
          rest.length / ringCount
        );

      const radius =
        Math.min(
          maxRadius,
          baseRadius *
          (
            0.45 +
            (ring + 1) /
            Math.max(
              1,
              ringCount
            ) *
            0.55
          )
        );

      const angle =
        (
          indexInRing /
          Math.max(
            1,
            countInRing
          )
        ) *
        Math.PI *
        2;

      character.x =
        centerX +
        Math.cos(angle) *
        radius;

      character.y =
        centerY +
        Math.sin(angle) *
        radius;
    }
  );

  /*
   * =====================================================
   * 関係を意識したレイアウト調整
   * =====================================================
   */

  for (
    let iteration = 0;
    iteration < 120;
    iteration++
  ) {

    const forces = new Map();

    for (const character of characters) {

      forces.set(
        character.id,
        {
          x: 0,
          y: 0
        }
      );
    }

    /*
     * -----------------------------------------------
     * ノード同士を強く反発
     * -----------------------------------------------
     */

    for (
      let i = 0;
      i < characters.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < characters.length;
        j++
      ) {

        const a = characters[i];
        const b = characters[j];

        let dx = b.x - a.x;
        let dy = b.y - a.y;

        let distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );

        if (distance < 1) {
          distance = 1;

          /*
           * 同じ位置に重なった場合の
           * ランダムではない微調整
           */
          dx = 1;
          dy = 0;
        }

        const minimumDistance = 280;

        if (
          distance <
          minimumDistance
        ) {

          const strength =
            (
              minimumDistance -
              distance
            ) * 0.09;

          const ux =
            dx / distance;

          const uy =
            dy / distance;

          forces.get(a.id).x -=
            ux * strength;

          forces.get(a.id).y -=
            uy * strength;

          forces.get(b.id).x +=
            ux * strength;

          forces.get(b.id).y +=
            uy * strength;
        }
      }
    }

    /*
     * -----------------------------------------------
     * 関係のあるキャラは適度に近づける
     * -----------------------------------------------
     */

    for (const relation of relationData) {

      const from =
        getCharacter(relation.from);

      const to =
        getCharacter(relation.to);

      if (!from || !to) {
        continue;
      }

      let dx =
        to.x - from.x;

      let dy =
        to.y - from.y;

      let distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if (distance < 1) {
        distance = 1;
      }

      const targetDistance = 850;

      const strength =
        (
          distance -
          targetDistance
        ) * 0.002;

      const ux =
        dx / distance;

      const uy =
        dy / distance;

      forces.get(from.id).x +=
        ux * strength;

      forces.get(from.id).y +=
        uy * strength;

      forces.get(to.id).x -=
        ux * strength;

      forces.get(to.id).y -=
        uy * strength;
    }

    /*
     * -----------------------------------------------
     * 中央への弱い引力
     * -----------------------------------------------
     */

    for (const character of characters) {

      const force =
        forces.get(
          character.id
        );

      force.x +=
        (
          centerX -
          character.x
        ) * 0.00045;

      force.y +=
        (
          centerY -
          character.y
        ) * 0.00045;
    }

    /*
     * -----------------------------------------------
     * 力を適用
     * -----------------------------------------------
     */

    for (const character of characters) {

      const force =
        forces.get(
          character.id
        );

      /*
       * 1回の移動量を制限。
       * 大きく飛びすぎるのを防止。
       */

      const maxMove = 35;

      const moveX =
        clamp(
          force.x,
          -maxMove,
          maxMove
        );

      const moveY =
        clamp(
          force.y,
          -maxMove,
          maxMove
        );

      character.x += moveX;
      character.y += moveY;

      character.x =
        clamp(
          character.x,
          NODE_RADIUS + 80,
          MAP_WIDTH -
            NODE_RADIUS -
            80
        );

      character.y =
        clamp(
          character.y,
          NODE_RADIUS + 80,
          MAP_HEIGHT -
            NODE_RADIUS -
            80
        );
    }
  }

  /*
   * =====================================================
   * 最後に重なりを完全に解消
   * =====================================================
   */

  separateCharacters();

  /*
   * =====================================================
   * 表示更新
   * =====================================================
   */

  updateNodes();
  updateRelations();

  /*
   * キャラクター群が画面中央に来るようにする
   */

  centerOnCharacters();

  /*
   * 自動保存
   */

  scheduleAutoSave();
}
/* =========================================================
   FINAL CHARACTER SEPARATION
========================================================= */

function separateCharacters() {

  const minimum =
    190;

  for (
    let iteration = 0;
    iteration < 15;
    iteration++
  ) {

    for (
      let i = 0;
      i < characters.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < characters.length;
        j++
      ) {

        const a =
          characters[i];

        const b =
          characters[j];

        let dx =
          b.x - a.x;

        let dy =
          b.y - a.y;

        let dist =
          Math.sqrt(
            dx * dx +
            dy * dy
          );

        if (dist < 1) {
          dist = 1;
        }

        if (
          dist < minimum
        ) {

          const push =
            (
              minimum -
              dist
            ) /
            2;

          dx /= dist;
          dy /= dist;

          a.x -=
            dx * push;

          a.y -=
            dy * push;

          b.x +=
            dx * push;

          b.y +=
            dy * push;
        }
      }
    }
  }

  for (
    const character of characters
  ) {

    character.x =
      clamp(
        character.x,
        NODE_RADIUS,
        MAP_WIDTH -
          NODE_RADIUS
      );

    character.y =
      clamp(
        character.y,
        NODE_RADIUS,
        MAP_HEIGHT -
          NODE_RADIUS
      );
  }
}

/* =========================================================
   CENTER VIEW ON CHARACTERS
========================================================= */

function centerOnCharacters() {

  if (
    characters.length === 0
  ) {
    return;
  }

  let minX = Infinity;
  let minY = Infinity;

  let maxX = -Infinity;
  let maxY = -Infinity;

  for (
    const character of characters
  ) {

    minX =
      Math.min(
        minX,
        character.x
      );

    minY =
      Math.min(
        minY,
        character.y
      );

    maxX =
      Math.max(
        maxX,
        character.x
      );

    maxY =
      Math.max(
        maxY,
        character.y
      );
  }

  const centerX =
    (minX + maxX) / 2;

  const centerY =
    (minY + maxY) / 2;

  panX =
    window.innerWidth / 2 -
    centerX * zoom;

  panY =
    window.innerHeight / 2 -
    centerY * zoom;

  applyTransform();
}

/* =========================================================
   EXPORT
========================================================= */

function exportMap() {

  const data =
    getSaveData();

  const json =
    JSON.stringify(
      data,
      null,
      2
    );

  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const a =
    document.createElement("a");

  const date =
    new Date();

  const filename =
    `character-map-${date
      .toISOString()
      .slice(0, 10)}.json`;

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );
}

/* =========================================================
   IMPORT
========================================================= */

function importMap() {

  const input =
    document.createElement(
      "input"
    );

  input.type =
    "file";

  input.accept =
    ".json,application/json";

  input.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        () => {

          try {

            const data =
              JSON.parse(
                reader.result
              );

            if (
              !data ||
              !Array.isArray(
                data.characters
              ) ||
              !Array.isArray(
                data.relations
              )
            ) {

              throw new Error(
                "データ形式が不正です"
              );
            }

            const importedCharacters =
              data.characters
                .filter(c =>
                  c &&
                  typeof c.id ===
                    "string" &&
                  typeof c.name ===
                    "string" &&
                  Number.isFinite(
                    Number(c.x)
                  ) &&
                  Number.isFinite(
                    Number(c.y)
                  )
                )
                .map(c => {

                  return {

                    id:
                      c.id,

                    name:
                      c.name,

                    x:
                      clamp(
                        Number(c.x),
                        NODE_RADIUS,
                        MAP_WIDTH -
                          NODE_RADIUS
                      ),

                    y:
                      clamp(
                        Number(c.y),
                        NODE_RADIUS,
                        MAP_HEIGHT -
                          NODE_RADIUS
                      ),

                    status:
                      c.status ===
                        "CLOSE"
                        ? "CLOSE"
                        : "OPEN"
                  };
                });

            if (
              importedCharacters.length ===
              0
            ) {

              throw new Error(
                "キャラクターがありません"
              );
            }

            const ids =
              new Set(
                importedCharacters.map(
                  c => c.id
                )
              );

            const importedRelations =
              data.relations
                .filter(r =>
                  r &&
                  typeof r.id ===
                    "string" &&
                  ids.has(r.from) &&
                  ids.has(r.to)
                )
                .map(r => {

                  return {

                    id:
                      r.id,

                    from:
                      r.from,

                    to:
                      r.to,

                    name:
                      typeof r.name ===
                        "string"
                        ? r.name
                        : "",

                    color:
                      typeof r.color ===
                        "string"
                        ? r.color
                        : "#00eaff",

                    offsetX:
                      Number.isFinite(
                        Number(r.offsetX)
                      )
                        ? Number(r.offsetX)
                        : (
                          Number.isFinite(
                            Number(
                              r.labelOffsetX
                            )
                          )
                            ? Number(
                                r.labelOffsetX
                              )
                            : 0
                        ),

                    offsetY:
                      Number.isFinite(
                        Number(r.offsetY)
                      )
                        ? Number(r.offsetY)
                        : (
                          Number.isFinite(
                            Number(
                              r.labelOffsetY
                            )
                          )
                            ? Number(
                                r.labelOffsetY
                              )
                            : 0
                        )
                  };
                });

            characters =
              importedCharacters;

            relationData =
              importedRelations;

            updateNodes();
            updateRelations();

            centerOnCharacters();

            /*
              読み込んだ内容を
              次回起動時にも残す。
            */

            saveAutoMap();

            alert(
              "マップを読み込みました。"
            );

          } catch (error) {

            console.error(
              error
            );

            alert(
              "マップの読み込みに失敗しました。\n\n" +
              error.message
            );
          }
        };

      reader.readAsText(
        file,
        "UTF-8"
      );
    }
  );

  input.click();
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    applyTransform();
  }
);

/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  /*
    まずlocalStorageを確認。

    データが存在すれば
    前回のマップを使用。

    存在しなければ
    初期サンプルデータを使用。
  */

  const restored =
    loadAutoMap();

  updateNodes();
  updateRelations();

  if (!restored) {

    /*
      初回だけサンプルデータを
      中央付近に表示。
    */

    centerOnCharacters();

    showSaveStatus(

    );

  } else {

    centerOnCharacters();
  }

  applyTransform();
}

initialize();

</script>
